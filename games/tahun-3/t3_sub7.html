                this.score = 0;
                this.correctCount = 0;
                this.incorrectCount = 0;
                this.timerInterval = null;
                this.timeLeft = 0;
                this.isAnswered = false;
                
                this.loadUsers();
            }

            loadUsers() {
                const stored = localStorage.getItem('math_kids_users');
                this.users = stored ? JSON.parse(stored) : {};
            }

            saveUsers() {
                localStorage.setItem('math_kids_users', JSON.stringify(this.users));
            }

            register(username, fullName, password) {
                if (!username || !fullName || !password) {
                    return { success: false, message: "Sila lengkapkan semua medan." };
                }
                if (this.users[username]) {
                    return { success: false, message: "Nama pengguna telah wujud. Sila pilih nama lain." };
                }
                this.users[username] = {
                    username,
                    fullName,
                    password,
                    history: [],
                    progress: {
                        "Kenali Prisma dan Bukan Prisma": 0,
                        "Kenal Poligon Sekata": 0,
                        "Paksi Simetri": 0,
                        "Penyelesaian Masalah": 0
                    },
                    totalScore: 0,
                    highestScore: 0
                };
                this.saveUsers();
                return { success: true, message: "Pendaftaran berjaya! Sila log masuk." };
            }

            login(username, password) {
                if (!username || !password) {
                    return { success: false, message: "Sila masukkan nama pengguna dan kata laluan." };
                }
                const user = this.users[username];
                if (!user || user.password !== password) {
                    return { success: false, message: "Nama pengguna atau kata laluan tidak sah." };
                }
                this.currentUser = username;
                return { success: true };
            }

            logout() {
                this.currentUser = null;
                this.navigate('login');
            }

            getLeaderboard() {
                let list = [];
                for (let uname in this.users) {
                    let u = this.users[uname];
                    list.push({
                        username: u.username,
                        fullName: u.fullName,
                        totalScore: u.totalScore || 0,
                        highestScore: u.highestScore || 0
                    });
                }
                list.sort((a, b) => b.totalScore - a.totalScore);
                return list;
            }

            navigate(view) {
                this.currentView = view;
                if (view !== 'game') {
                    this.stopTimer();
                }
                renderApp();
            }

            startQuiz(category, difficulty, timerSec) {
                this.selectedCategory = category;
                this.selectedDifficulty = difficulty;
                this.selectedTimerSeconds = timerSec;

                // Filter questions
                let pool = questionDatabase.filter(q => q.kategori === category && q.tahap === difficulty);
                // Shuffle and pick 20 unique
                pool.sort(() => Math.random() - 0.5);
                this.currentQuestions = pool.slice(0, 20);
                this.currentIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.incorrectCount = 0;
                this.isAnswered = false;

                this.navigate('game');
                this.initGameTimer();
            }

            initGameTimer() {
                this.stopTimer();
                if (this.selectedTimerSeconds === null) return;
                this.timeLeft = this.selectedTimerSeconds;
                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    updateTimerDisplay();
                    if (this.timeLeft <= 0) {
                        this.stopTimer();
                        this.finishQuiz();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            submitAnswer(userAnswer) {
                if (this.isAnswered) return;
                this.isAnswered = true;
                this.stopTimer();

                const q = this.currentQuestions[this.currentIndex];
                const isCorrect = String(userAnswer).trim().toLowerCase() === String(q.jawapan).trim().toLowerCase();

                if (isCorrect) {
                    this.score += 5;
                    this.correctCount++;
                } else {
                    this.incorrectCount++;
                }

                showFeedbackModal(isCorrect, q);
            }

            nextQuestion() {
                this.currentIndex++;
                if (this.currentIndex >= this.currentQuestions.length) {
                    this.finishQuiz();
                } else {
                    this.isAnswered = false;
                    renderApp();
                    if (this.selectedTimerSeconds !== null) {
                        this.initGameTimer();
                    }
                }
            }

            finishQuiz() {
                this.stopTimer();
                // Save progress to user profile
                if (this.currentUser && this.users[this.currentUser]) {
                    let u = this.users[this.currentUser];
                    u.totalScore += this.score;
                    if (this.score > u.highestScore) {
                        u.highestScore = this.score;
                    }
                    // Update category progress percentage (simplified estimation based on score)
                    let cat = this.selectedCategory;
                    let maxCatScore = 20 * 5; // 100
                    let currentProgress = u.progress[cat] || 0;
                    let sessionPct = Math.round((this.score / maxCatScore) * 100);
                    if (sessionPct > currentProgress) {
                        u.progress[cat] = sessionPct;
                    }

                    u.history.push({
                        date: new Date().toLocaleDateString('ms-MY'),
                        category: cat,
                        difficulty: this.selectedDifficulty,
                        score: this.score,
                        correct: this.correctCount,
                        incorrect: this.incorrectCount
                    });
                    this.saveUsers();
                }
                this.navigate('results');
            }
        }

            const percentage = Math.round((appState.score / maxScore) * 100);
            let badgeText = "💪 JANGAN PUTUS ASA! CUBA LAGI!";
            let badgeColor = "text-rose-600 bg-rose-50 border-rose-200";
            if (percentage >= 80) {
                badgeText = "🏆 CEMERLANG!";
                badgeColor = "text-amber-600 bg-amber-50 border-amber-200";
            } else if (percentage >= 50) {
                badgeText = "👏 BAGUS! TERUSKAN BERLATIH!";
                badgeColor = "text-cyan-600 bg-cyan-50 border-cyan-200";
            }

            return `
            <div class="max-w-md w-full bg-white p-8 rounded-3xl card-shadow border border-cyan-100 text-center space-y-6">
                <div class="inline-block px-4 py-2 rounded-2xl font-extrabold text-sm border ${badgeColor}">
                    ${badgeText}
                </div>

                <div class="space-y-2">
                    <h2 class="text-3xl font-extrabold text-slate-800">🎉 TAHNIAH!</h2>
                    <p class="text-xs text-slate-500">Sesi latihan bentuk telah selesai</p>
                </div>

                <div class="bg-cyan-50/50 p-6 rounded-2xl border border-cyan-100 space-y-3 text-left">
                    <div class="flex justify-between text-sm"><span class="font-semibold text-slate-500">Nama Pemain:</span><span class="font-extrabold text-slate-800">${appState.users[appState.currentUser]?.fullName || 'Pelajar'}</span></div>
                    <div class="flex justify-between text-sm"><span class="font-semibold text-slate-500">Kategori:</span><span class="font-extrabold text-slate-800 text-right">${appState.selectedCategory}</span></div>
                    <div class="flex justify-between text-sm"><span class="font-semibold text-slate-500">Tahap:</span><span class="font-extrabold text-slate-800">${appState.selectedDifficulty}</span></div>
                    <div class="flex justify-between text-sm"><span class="font-semibold text-slate-500">Markah Diperoleh:</span><span class="font-extrabold text-cyan-600 text-lg">${appState.score} / ${maxScore}</span></div>
                    <div class="flex justify-between text-sm"><span class="font-semibold text-slate-500">Betul / Salah:</span><span class="font-extrabold text-slate-800">${appState.correctCount} / ${appState.incorrectCount}</span></div>
                    <div class="flex justify-between text-sm"><span class="font-semibold text-slate-500">Ketepatan:</span><span class="font-extrabold text-emerald-600">${percentage}%</span></div>
                </div>

                <div class="space-y-3">
                    <button onclick="appState.startQuiz(appState.selectedCategory, appState.selectedDifficulty, appState.selectedTimerSeconds)" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold rounded-xl shadow-lg transition">
                        🔄 MAIN SEMULA
                    </button>
                    <button onclick="appState.navigate('category')" class="w-full py-3 bg-white hover:bg-slate-50 text-slate-700 font-bold rounded-xl border border-slate-200 transition">
                        📚 PILIH TOPIK LAIN
                    </button>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="appState.navigate('progress')" class="py-2.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold rounded-xl text-xs border border-emerald-200">
                            📊 LIHAT PROGRESS
                        </button>
                        <button onclick="appState.navigate('leaderboard')" class="py-2.5 bg-amber-50 text-amber-700 hover:bg-amber-100 font-bold rounded-xl text-xs border border-amber-200">
                            🏆 LEADERBOARD
                        </button>
                    </div>
                    <button onclick="appState.navigate('menu')" class="w-full py-2 text-slate-500 hover:text-slate-800 text-xs font-bold">
                        🏠 KEMBALI KE MENU UTAMA
                    </button>
                </div>
            </div>
            `;
        }

        function renderProgressView() {
            const user = appState.users[appState.currentUser];
            const prog = user ? user.progress : {};

            return `
            <div class="max-w-3xl w-full bg-white p-6 sm:p-8 rounded-3xl card-shadow border border-cyan-100 space-y-6">
                <div class="flex items-center justify-between border-b border-cyan-50 pb-4">
                    <button onclick="appState.navigate('menu')" class="px-4 py-2 bg-slate-50 text-slate-600 rounded-xl font-bold hover:bg-slate-100 text-sm">⬅ Kembali</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">📊 PROGRESS SAYA</h2>
                    <div></div>
                </div>

                <div class="space-y-6">
                    <div class="p-4 bg-cyan-50 rounded-2xl border border-cyan-200 flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-cyan-700">PENGGUNA AKTIF</span>
                            <h3 class="text-lg font-extrabold text-slate-800">${user ? user.fullName : 'Pelajar'}</h3>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-cyan-700">SKOR TERTINGGI</span>
                            <h3 class="text-lg font-extrabold text-cyan-600">${user ? user.highestScore : 0} Mata</h3>
                        </div>
                    </div>

                    <div class="space-y-4">
                        ${Object.keys(prog).map(cat => `
                            <div class="space-y-1">
                                <div class="flex justify-between text-sm font-bold text-slate-700">
                                    <span>${cat}</span>
                                    <span>${prog[cat]}%</span>
                                </div>
                                <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                                    <div class="bg-gradient-to-r from-cyan-500 to-blue-600 h-full rounded-full transition-all duration-500" style="width: ${prog[cat]}%"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="space-y-3 pt-4 border-t border-slate-100">
                        <h4 class="text-sm font-extrabold text-slate-800">Sejarah Permainan Terkini</h4>
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                            ${user && user.history.length > 0 ? user.history.slice(-5).reverse().map(h => `
                                <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                                    <div>
                                        <span class="font-bold text-slate-800 block">${h.category} (${h.difficulty})</span>
                                        <span class="text-slate-400">${h.date}</span>
                                    </div>
                                    <span class="font-extrabold text-cyan-600">${h.score} Mata</span>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-400 text-center py-4">Belum ada sejarah permainan.</p>'}
                        </div>
                    </div>
                </div>
            </div>
            `;
        }

        function renderLeaderboardView() {
            const lb = appState.getLeaderboard();

            return `
            <div class="max-w-3xl w-full bg-white p-6 sm:p-8 rounded-3xl card-shadow border border-cyan-100 space-y-6">
                <div class="flex items-center justify-between border-b border-cyan-50 pb-4">
                    <button onclick="appState.navigate('menu')" class="px-4 py-2 bg-slate-50 text-slate-600 rounded-xl font-bold hover:bg-slate-100 text-sm">⬅ Kembali</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">🏆 LEADERBOARD UTAMA</h2>
                    <div></div>
                </div>

                <div class="space-y-3">
                    ${lb.length > 0 ? lb.map((p, idx) => `
                        <div class="p-4 rounded-2xl border ${idx === 0 ? 'bg-amber-50/80 border-amber-300' : idx === 1 ? 'bg-slate-100 border-slate-300' : idx === 2 ? 'bg-orange-50 border-orange-200' : 'bg-slate-50 border-slate-200'} flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <span class="w-8 h-8 rounded-full ${idx === 0 ? 'bg-amber-500 text-white' : idx === 1 ? 'bg-slate-400 text-white' : idx === 2 ? 'bg-orange-500 text-white' : 'bg-slate-200 text-slate-600'} flex items-center justify-center font-extrabold text-sm">${idx + 1}</span>
                                <div>
                                    <h4 class="font-extrabold text-slate-800 text-sm">${p.fullName}</h4>
                                    <span class="text-xs text-slate-400">@${p.username}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <span class="font-extrabold text-cyan-600 text-base">${p.totalScore} Mata</span>
                                <span class="block text-[10px] text-slate-400">Skor Tertinggi: ${p.highestScore}</span>
                            </div>
                        </div>
                    `).join('') : '<p class="text-center text-xs text-slate-400 py-8">Belum ada data leaderboard.</p>'}
                </div>
            </div>
            `;
        }

        function renderInstructionsView() {
            return `
            <div class="max-w-3xl w-full bg-white p-6 sm:p-8 rounded-3xl card-shadow border border-cyan-100 space-y-6">
                <div class="flex items-center justify-between border-b border-cyan-50 pb-4">
                    <button onclick="appState.navigate('menu')" class="px-4 py-2 bg-slate-50 text-slate-600 rounded-xl font-bold hover:bg-slate-100 text-sm">⬅ Kembali</button>
                    <h2 class="text-2xl font-extrabold text-slate-800">📖 CARA BERMAIN & ARAHAN</h2>
                    <div></div>
                </div>

                <div class="space-y-4 text-sm text-slate-600 leading-relaxed">
                    <div class="p-4 bg-cyan-50 rounded-2xl border border-cyan-100 space-y-2">
                        <h3 class="font-extrabold text-cyan-800">1. Pendaftaran & Log Masuk</h3>
                        <p class="text-xs text-slate-600">Daftar akaun baharu menggunakan nama pengguna dan kata laluan anda supaya markah dan progress disimpan secara peribadi tanpa bercampur dengan pemain lain.</p>
                    </div>

                    <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100 space-y-2">
                        <h3 class="font-extrabold text-blue-800">2. Pemilihan Topik & Tahap</h3>
                        <p class="text-xs text-slate-600">Pilih antara 4 kategori bentuk utama (Prisma, Poligon Sekata, Paksi Simetri, Penyelesaian Masalah) serta pilih tahap Senang, Sederhana, atau Susah.</p>
                    </div>

                    <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-100 space-y-2">
                        <h3 class="font-extrabold text-emerald-800">3. Pemarkahan & Maklum Balas</h3>
                        <p class="text-xs text-slate-600">Setiap jawapan betul bernilai <strong>+5 markah</strong>. Jika jawapan salah, sistem akan memaparkan jawapan yang betul berserta penerangan ringkas mengikut silibus Tahun 3 KPM.</p>
                    </div>

                    <div class="p-4 bg-amber-50 rounded-2xl border border-amber-100 space-y-2">
                        <h3 class="font-extrabold text-amber-800">4. Progress & Leaderboard</h3>
                        <p class="text-xs text-slate-600">Semak prestasi anda melalui menu Progress dan bandingkan kedudukan markah bersama rakan-rakan di Leaderboard utama!</p>
                    </div>
                </div>
            </div>
            `;
        }

        // ==========================================
        // 4. FEEDBACK MODAL & CONTROLLER HELPERS
        // ==========================================
        function showFeedbackModal(isCorrect, q) {
            const modalBg = document.createElement('div');
            modalBg.id = 'feedback-modal';
            modalBg.className = 'fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4';
            
            modalBg.innerHTML = `
            <div class="max-w-md w-full bg-white p-8 rounded-3xl card-shadow border ${isCorrect ? 'border-emerald-200' : 'border-rose-200'} text-center space-y-5 animate-bounce-slow">
                <div class="w-20 h-20 mx-auto rounded-3xl ${isCorrect ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} flex items-center justify-center text-4xl shadow-md">
                    ${isCorrect ? '🎉' : '❌'}
                </div>
                <div class="space-y-1">
                    <h3 class="text-2xl font-extrabold ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">
                        ${isCorrect ? 'BETUL! +5 MARKAH' : 'BELUM TEPAT!'}
                    </h3>
                    ${!isCorrect ? `<p class="text-xs font-bold text-slate-700 bg-slate-100 p-2 rounded-xl">Jawapan Betul: ${q.jawapan}</p>` : ''}
                </div>
                <p class="text-xs text-slate-500 bg-cyan-50/50 p-4 rounded-2xl border border-cyan-100 leading-relaxed font-medium">
                    💡 <strong>Penerangan:</strong> ${q.penerangan}
                </p>
                <button onclick="closeFeedbackModal()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold rounded-xl shadow-lg transition">
                    SOALAN SETERUSNYA ➔
                </button>
            </div>
            `;
            document.body.appendChild(modalBg);
        }

        function closeFeedbackModal() {
            const modal = document.getElementById('feedback-modal');
            if (modal) modal.remove();
            appState.nextQuestion();
        }

        function updateTimerDisplay() {
            const timerEl = document.getElementById('time-left-val');
            if (timerEl) {
                timerEl.textContent = appState.timeLeft + 's';
            }
        }

        // Action handlers
        function handleLoginSubmit() {
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const res = appState.login(u, p);
            if (res.success) {
                appState.navigate('menu');
            } else {
                showCustomAlert(res.message);
            }
        }

        function handleRegisterSubmit() {
            const u = document.getElementById('reg-user').value.trim();
            const n = document.getElementById('reg-name').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            const res = appState.register(u, n, p);
            if (res.success) {
                showCustomAlert(res.message);
                appState.navigate('login');
            } else {
                showCustomAlert(res.message);
            }
        }

        function selectCategory(cat) {
            appState.selectedCategory = cat;
            appState.navigate('difficulty');
        }

        function selectDifficulty(diff) {
            appState.selectedDifficulty = diff;
            appState.navigate('timer');
        }

        function startQuizFinal(sec) {
            appState.startQuiz(appState.selectedCategory, appState.selectedDifficulty, sec);
        }

        function submitAnswerVal(val) {
            appState.submitAnswer(val);
        }

        function submitSubjective() {
            const inp = document.getElementById('subjective-input');
            if (inp) {
                appState.submitAnswer(inp.value.trim());
            }
        }

        function showCustomAlert(msg) {
            const alertBox = document.createElement('div');
            alertBox.className = 'fixed top-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl z-50 text-xs font-bold border border-slate-700 animate-bounce-slow';
            alertBox.textContent = msg;
            document.body.appendChild(alertBox);
            setTimeout(() => alertBox.remove(), 3000);
        }

        function escapeHtml(str) {
            return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Initialize default app on window load
        window.onload = function() {
            // Seed a default demo user if none exists
            if (Object.keys(appState.users).length === 0) {
                appState.register("aiman123", "Aiman Hakim", "123456");
            }
            appState.navigate('login');
        };
    </script>

</body>
</html>
