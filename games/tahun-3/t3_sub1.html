    <script>
        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },
            playCorrect() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } catch(e) {}
            },
            playWrong() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } catch(e) {}
            },
            playClick() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } catch(e) {}
            }
        };

        function numToWords(n) {
            const saList = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "lapan", "sembilan"];
            const belasList = ["sepuluh", "sebelas", "dua belas", "tiga belas", "empat belas", "lima belas", "enam belas", "tujuh belas", "lapan belas", "sembilan belas"];
            const puluhList = ["", "", "dua puluh", "tiga puluh", "empat puluh", "lima puluh", "enam puluh", "tujuh puluh", "lapan puluh", "sembilan puluh"];
            
            if (n === 10000) return "sepuluh ribu";
            let r = Math.floor(n / 1000);
            let s = n % 1000;
            let rt = Math.floor(s / 100);
            let p = s % 100;
            
            let res = "";
            if (r > 0) {
                res += (r === 1 ? "satu ribu" : saList[r] + " ribu") + " ";
            }
            if (rt > 0) {
                res += (rt === 1 ? "seratus" : saList[rt] + " ratus") + " ";
            }
            if (p >= 10 && p < 20) {
                res += belasList[p - 10];
            } else {
                let pu = Math.floor(p / 10);
                let unit = p % 10;
                if (pu > 0) res += puluhList[pu] + " ";
                if (unit > 0) res += saList[unit];
            }
            return res.trim().replace(/\s+/g, ' ');
        }

        function generateQuestionBank(topicId, level) {
            let questions = [];
            let prefix = "T3-N10000-T" + topicId + "-" + level.charAt(0);
            const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
            const formatNum = (n) => n.toLocaleString('en-US');

            for (let i = 1; i <= 20; i++) {
                let id = prefix + "-" + String(i).padStart(3, '0');
                let qData = {};

                if (topicId === 1) {
                    let targetNum = rnd(1001, 9999);
                    let words = numToWords(targetNum);
                    let options = [formatNum(targetNum), formatNum(targetNum + 10), formatNum(Math.max(100, targetNum - 10)), formatNum(targetNum + 100)].sort(() => Math.random() - 0.5);
                    
                    qData = {
                        id: id, topik: "Kenali Nombor", tahap: level, aras_kognitif: "Mengingat", jenis_game: "OBJEKTIF",
                        soalan: "Apakah angka bagi nombor perkataan berikut:<br><strong class='text-emerald-700 text-lg sm:text-xl'>\"" + words + "\"</strong>?",
                        gambarajah: "Kad Perkataan Nombor (KSSR Tahun 3)",
                        pilihan: options,
                        jawapan: formatNum(targetNum),
                        markah: 5,
                        penerangan: "Nombor \"" + words + "\" ditulis dalam angka sebagai " + formatNum(targetNum) + "."
                    };
                } else if (topicId === 2) {
                    let n = rnd(1234, 9876);
                    let sStr = String(n);
                    let posIdx = i % 4;
                    let places = ["ribu", "ratus", "puluh", "sa"];
                    let digits = [sStr[0], sStr[1], sStr[2], sStr[3]];
                    let targetDigit = digits[posIdx];
                    let placeName = places[posIdx];

                    qData = {
                        id: id, topik: "Teroka Nombor", tahap: level, aras_kognitif: "Mengingat", jenis_game: "OBJEKTIF",
                        soalan: "Dalam nombor <strong>" + formatNum(n) + "</strong>, apakah nilai tempat bagi digit <span class='text-rose-600 font-bold underline'>" + targetDigit + "</span>?",
                        gambarajah: "Jadual Nilai Tempat (Ribu | Ratus | Puluh | Sa)",
                        pilihan: ["Ribu", "Ratus", "Puluh", "Sa"].sort(() => Math.random() - 0.5),
                        jawapan: placeName.charAt(0).toUpperCase() + placeName.slice(1),
                        markah: 5,
                        penerangan: "Bagi nombor " + formatNum(n) + ", digit " + targetDigit + " terletak pada rumah nilai tempat " + placeName + "."
                    };
                } else if (topicId === 3) {
                    let r = rnd(1, 9) * 1000;
                    let rt = rnd(1, 9) * 100;
                    let p = rnd(1, 9) * 10;
                    let s = rnd(1, 9);
                    let total = r + rt + p + s;
                    let correctCerakin = r + " + " + rt + " + " + p + " + " + s;
                    let wrong1 = r + " + " + p + " + " + rt + " + " + s;
                    let wrong2 = (r+100) + " + " + rt + " + " + p + " + " + s;
                    let wrong3 = r + " + " + rt + " + " + (p+10) + " + " + s;

                    qData = {
                        id: id, topik: "Cerakinan Nombor", tahap: level, aras_kognitif: "Memahami", jenis_game: "OBJEKTIF",
                        soalan: "Pilih cerakinan mengikut nilai digit yang betul bagi nombor <strong>" + formatNum(total) + "</strong>:",
                        gambarajah: "Blok Asas Nilai Digit Nombor",
                        pilihan: [correctCerakin, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5),
                        jawapan: correctCerakin,
                        markah: 5,
                        penerangan: "Cerakin mengikut nilai digit bagi " + formatNum(total) + " ialah " + correctCerakin + "."
                    };
                } else if (topicId === 4) {
                    let a = rnd(1000, 9500);
                    let b = a + rnd(10, 300) * (i % 2 === 0 ? 1 : -1);
                    if (b < 1000) b = 1500;
                    if (a === b) b = a + 45;
                    let larger = Math.max(a, b);

                    qData = {
                        id: id, topik: "Bandingkan Nombor", tahap: level, aras_kognitif: "Memahami", jenis_game: "OBJEKTIF",
                        soalan: "Antara nombor berikut, yang manakah lebih besar?<br><span class='text-lg sm:text-xl text-indigo-700 font-bold'>" + formatNum(a) + " &nbsp; dan &nbsp; " + formatNum(b) + "</span>",
                        gambarajah: "Garis Nombor Perbandingan",
                        pilihan: [formatNum(a), formatNum(b), "Kedua-duanya sama", "Tidak pasti"].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(larger),
                        markah: 5,
                        penerangan: "Apabila membandingkan " + formatNum(a) + " dan " + formatNum(b) + ", nombor yang lebih besar ialah " + formatNum(larger) + "."
                    };
                } else if (topicId === 5) {
                    let base = rnd(2000, 7000);
                    let step = rnd(50, 200);
                    let seq = [base, base + step, base + (step*2), base + (step*3)];

                    qData = {
                        id: id, topik: "Susunan Nombor", tahap: level, aras_kognitif: "Memahami", jenis_game: "OBJEKTIF",
                        soalan: "Susun nombor berikut secara <strong>menaik</strong> (kecil ke besar):<br><span class='text-base sm:text-lg font-bold text-sky-700'>" + seq.map(formatNum).join(', ') + "</span>",
                        gambarajah: "Carta Rangkaian Nombor Menaik",
                        pilihan: [
                            seq.map(formatNum).join(' , '),
                            [seq[3], seq[2], seq[1], seq[0]].map(formatNum).join(' , '),
                            [seq[1], seq[0], seq[3], seq[2]].map(formatNum).join(' , '),
                            [seq[2], seq[0], seq[1], seq[3]].map(formatNum).join(' , ')
                        ].sort(() => Math.random() - 0.5),
                        jawapan: seq.map(formatNum).join(' , '),
                        markah: 5,
                        penerangan: "Susunan menaik bermula daripada nombor terkecil kepada nombor terbesar iaitu: " + seq.map(formatNum).join(', ') + "."
                    };
                } else if (topicId === 6) {
                    let actual = rnd(1500, 8000);
                    let approx = Math.round(actual / 500) * 500;
                    if (approx === actual) approx += 100;

                    qData = {
                        id: id, topik: "Anggarkan Nombor", tahap: level, aras_kognitif: "Mengaplikasi", jenis_game: "OBJEKTIF",
                        soalan: "Sebuah balang mengandungi lebih kurang <strong>" + formatNum(actual) + "</strong> biji guli. Jika set rujukan separuh balang ialah 2,000 biji, pilih anggaran yang paling munasabah untuk seluruh balang:",
                        gambarajah: "Ilustrasi Set Rujukan Kuantiti Guli",
                        pilihan: [formatNum(approx), formatNum(actual + 3000), formatNum(Math.max(200, actual - 2000)), formatNum(actual + 4500)].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(approx),
                        markah: 5,
                        penerangan: "Anggaran yang paling munasabah berdasarkan set rujukan terdekat ialah " + formatNum(approx) + "."
                    };
                } else if (topicId === 7) {
                    let num = rnd(1234, 8950);
                    let rounded = Math.round(num / 100) * 100;

                    qData = {
                        id: id, topik: "Bundarkan Nombor", tahap: level, aras_kognitif: "Memahami", jenis_game: "OBJEKTIF",
                        soalan: "Bundarkan nombor <strong>" + formatNum(num) + "</strong> kepada <strong>ratus terdekat</strong>.",

                        pilihan: [formatNum(rounded), formatNum(rounded + 100), formatNum(Math.max(100, rounded - 100)), formatNum(rounded + 500)].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(rounded),
                        markah: 5,
                        penerangan: "Digit puluh menentukan pembundaran kepada ratus terdekat. Hasil pembundaran bagi " + formatNum(num) + " ialah " + formatNum(rounded) + "."
                    };
                } else if (topicId === 8) {
                    let start = rnd(1000, 4000);
                    let step = [10, 100, 1000, 50][i % 4];
                    let s1 = start;
                    let s2 = start + step;
                    let s3 = start + (step * 2);
                    let s4 = start + (step * 3);
                    let s5 = start + (step * 4);

                    qData = {
                        id: id, topik: "Pola Nombor", tahap: level, aras_kognitif: "Memahami", jenis_game: "OBJEKTIF",
                        soalan: "Kenal pasti pola nombor dan cari nombor yang hilang (?):<br><strong class='text-emerald-700 text-base sm:text-lg'>" + formatNum(s1) + " → " + formatNum(s2) + " → " + formatNum(s3) + " → ? → " + formatNum(s5) + "</strong>",
                        gambarajah: "Carta Pola Sela Nombor Menaik",
                        pilihan: [formatNum(s4), formatNum(s4 + step), formatNum(s4 - step), formatNum(s4 + 200)].sort(() => Math.random() - 0.5),
                        jawapan: formatNum(s4),
                        markah: 5,
                        penerangan: "Pola nombor ini bertambah secara menaik sebanyak " + step + " setiap langkah. Nombor yang hilang ialah " + formatNum(s4) + "."
                    };
                } else {
                    let pType = (i - 1) % 20;
                    let qText = "";
                    let ansVal = 0;
                    let explanation = "";

                    if (pType === 0) {
                        let a = rnd(2100, 4500);

                        ansVal = a + b;

                    } else if (pType === 1) {
                        let total = rnd(6500, 9800);

                        ansVal = total - sold;

                    } else if (pType === 3) {

                        let b3 = rnd(1200, 2100);
                        ansVal = b1 + b2 + b3;
                        qText = "Perpustakaan merekodkan " + formatNum(b1) + " buku cerita, " + formatNum(b2) + " buku sains, dan " + formatNum(b3) + " majalah. Hitung jumlah bahan bacaan.";
                        explanation = "Campurkan ketiga-tiga jenis bahan bacaan untuk mendapat " + formatNum(ansVal) + ".";
                    } else if (pType === 10) {
                        let budget = rnd(8000, 9900);
                        let spent = rnd(3400, 5200);
                        ansVal = budget - spent;
                        qText = "PIBG memperuntukkan dana " + formatNum(budget) + " Ringgit. Sebanyak " + formatNum(spent) + " Ringgit telah dibelanjakan. Berapakah baki dana?";
                        explanation = "Tolak perbelanjaan daripada peruntukan asal untuk mendapat baki " + formatNum(ansVal) + " Ringgit.";
                    } else if (pType === 11) {
                        let kids = rnd(2000, 3500);
                        let adults = rnd(1500, 2500);
                        let seniors = rnd(800, 1300);
                        ansVal = kids + adults + seniors;
                        qText = "Konsert dihadiri oleh " + formatNum(kids) + " kanak-kanak, " + formatNum(adults) + " dewasa, dan " + formatNum(seniors) + " warga emas. Berapakah jumlah penonton?";
                        explanation = "Jumlahkan semua golongan penonton untuk mendapat " + formatNum(ansVal) + " orang.";
                    } else if (pType === 12) {
                        let birds = rnd(4000, 7000);
                        let flown = rnd(1500, 2800);
                        ansVal = birds - flown;
                        qText = "Di paya terdapat " + formatNum(birds) + " ekor burung. Sebanyak " + formatNum(flown) + " ekor terbang berpindah. Berapakah baki burung?";
                        explanation = "Tolak burung yang terbang daripada jumlah awal untuk mendapat " + formatNum(ansVal) + " ekor.";
                    } else if (pType === 13) {
                        let packs = rnd(120, 200);
                        ansVal = packs * 30;
                        qText = "Kedai menerima " + packs + " bungkus pen. Setiap bungkus ada 30 batang. Hitung jumlah batang pen.";
                        explanation = "Darabkan bungkusan dengan kandungan sebungkus untuk mendapat " + formatNum(ansVal) + ".";
                    } else if (pType === 14) {
                        let packets = rnd(4000, 8000);
                        packets = Math.round(packets / 8) * 8;
                        ansVal = packets / 8;
                        qText = "Sebanyak " + formatNum(packets) + " paket serbuk dimasukkan sama banyak ke dalam 8 kotak. Berapakah paket dalam setiap kotak?";
                        explanation = "Bahagikan jumlah paket dengan 8 kotak menghasilkan " + formatNum(ansVal) + ".";
                    } else if (pType === 15) {
                        let s1 = rnd(2000, 3500);
                        let s2 = rnd(2100, 4000);
                        ansVal = s1 + s2;
                        qText = "Pasukan Rumah Merah mengumpul " + formatNum(s1) + " markah pada separuh masa pertama dan " + formatNum(s2) + " markah pada separuh masa kedua. Jumlah markah?";
                        explanation = "Campurkan markah kedua-dua masa untuk mendapat " + formatNum(ansVal) + ".";
                    } else if (pType === 16) {
                        let cap = rnd(8000, 9900);
                        let curr = rnd(4500, 7000);
                        ansVal = cap - curr;
                        qText = "Stadium mempunyai kapasiti " + formatNum(cap) + " penonton. Hari ini " + formatNum(curr) + " penonton hadir. Berapakah tempat duduk kosong?";
                        explanation = "Tolak kehadiran penonton daripada kapasiti stadium untuk mendapat " + formatNum(ansVal) + ".";
                    } else if (pType === 17) {
                        let dist = rnd(1500, 3000);
                        ansVal = dist * 3;
                        qText = "Jarak ke bandar A ialah " + formatNum(dist) + " meter. Jarak ke bandar B adalah 3 kali ganda lebih jauh. Berapakah jarak ke bandar B?";
                        explanation = "Darabkan jarak asas dengan 3 untuk mendapat " + formatNum(ansVal) + " meter.";
                    } else if (pType === 18) {
                        let money = rnd(5000, 9000);
                        money = Math.round(money / 5) * 5;
                        ansVal = money / 5;
                        qText = "Sebanyak " + formatNum(money) + " sen wang sumbangan diagihkan sama rata kepada 5 orang anak yatim. Berapakah bahagian setiap anak?";
                        explanation = "Bahagikan jumlah wang dengan 5 orang untuk mendapat " + formatNum(ansVal) + " sen.";
                    } else {
                        let stock = rnd(6000, 9500);
                        let s1 = rnd(1200, 2200);
                        let s2 = rnd(1500, 2500);
                        ansVal = stock - s1 - s2;
                        qText = "Stok kedai ada " + formatNum(stock) + " tin susu. Terjual " + formatNum(s1) + " tin pada minggu pertama dan " + formatNum(s2) + " tin pada minggu kedua. Baki stok?";
                        explanation = "Tolak jualan minggu pertama dan kedua daripada stok awal untuk mendapat " + formatNum(ansVal) + " tin.";
                    }

                    let w1 = ansVal + rnd(100, 300);
                    let w2 = ansVal > 400 ? ansVal - rnd(100, 300) : ansVal + 400;
                    let w3 = ansVal + rnd(400, 800);
                    let options = [formatNum(ansVal), formatNum(w1), formatNum(w2), formatNum(w3)].sort(() => Math.random() - 0.5);

                    qData = {
                        id: id, topik: "Penyelesaian Masalah", tahap: level, aras_kognitif: "Mengaplikasi", jenis_game: "OBJEKTIF",
                        soalan: qText,
                        gambarajah: "Ilustrasi Situasi Masalah Harian KSSR Tahun 3",
                        pilihan: options,
                        jawapan: formatNum(ansVal),
                        markah: 5,
                        penerangan: explanation
                    };
                }

                questions.push(qData);
            }
            return questions;
        }

                        <button onclick="renderDashboard()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 font-bold shrink-0"><i class="fa-solid fa-arrow-left"></i></button>
                        <div>
                            <h2 class="text-base sm:text-lg font-bold text-slate-900 font-fun">📊 LAPORAN PENCAPAIAN</h2>
                            <p class="text-xs text-slate-500">Analisis Prestasi Pembelajaran ${u.name}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 text-center">
                            <div class="text-xl sm:text-2xl font-bold font-fun text-emerald-700">${completedCount} / 9</div>
                            <div class="text-[10px] font-bold text-emerald-600 uppercase mt-1">Topik Selesai</div>
                        </div>
                        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 text-center">
                            <div class="text-xl sm:text-2xl font-bold font-fun text-indigo-700">${accuracy}%</div>
                            <div class="text-[10px] font-bold text-indigo-600 uppercase mt-1">Tahap Ketepatan</div>
                        </div>
                    </div>

                    <div class="bg-slate-50 rounded-2xl p-4 mb-6 space-y-2 text-xs font-bold text-slate-700">
                        <div class="flex justify-between"><span>Jumlah Soalan Dijawab:</span><span class="text-slate-900">${totalAnswered}</span></div>
                        <div class="flex justify-between"><span>Jawapan Betul:</span><span class="text-emerald-600">${totalCorrect}</span></div>
                        <div class="flex justify-between"><span>Jawapan Salah:</span><span class="text-rose-600">${totalWrong}</span></div>
                        <div class="flex justify-between"><span>Jumlah Markah Terkumpul:</span><span class="text-amber-600">⭐ ${u.score}</span></div>
                    </div>

                    <h4 class="text-xs font-bold text-slate-700 uppercase mb-3">Status Setiap Topik</h4>
                    <div class="space-y-2.5 max-h-[35vh] overflow-y-auto pr-1 mb-6">
                        ${topicListProgressHTML}
                    </div>

                    <button onclick="renderDashboard()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/30 font-fun text-sm sm:text-base transition-all active:scale-95">
                        KEMBALI KE DASHBOARD
                    </button>
                </div>
            `;
        }

        function setupGame(topicId) {
            appState.selectedTopic = topicId;
            const topic = TOPICS.find(t => t.id === topicId);
            const vp = document.getElementById('main-viewport');
            
            vp.innerHTML = `
                <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl p-5 sm:p-8 border border-slate-100 my-auto">
                    <div class="flex items-center space-x-3 mb-5 sm:mb-6">
                        <button onclick="renderDashboard()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 font-bold shrink-0"><i class="fa-solid fa-arrow-left"></i></button>
                        <div>
                            <h2 class="text-base sm:text-lg font-bold text-slate-900 font-fun">${topic.title}</h2>
                            <p class="text-[11px] sm:text-xs text-slate-500">Tetapan Permainan Kuiz</p>
                        </div>
                    </div>

                    <div class="space-y-5 sm:space-y-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-2">PILIH TAHAP KESUKARAN</label>
                            <div class="grid grid-cols-3 gap-2 sm:gap-3">
                                <button onclick="setGameLevel('SENANG', this)" class="level-btn py-3 px-2 sm:px-4 bg-emerald-50 border-2 border-emerald-500 text-emerald-700 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">SENANG</button>
                                <button onclick="setGameLevel('SEDERHANA', this)" class="level-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">SEDERHANA</button>
                                <button onclick="setGameLevel('SUKAR', this)" class="level-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">SUKAR</button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-2">PILIH MASA</label>
                            <div class="grid grid-cols-3 gap-2 sm:gap-3">
                                <button onclick="setGameTime(30, this)" class="time-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">30 SAAT</button>
                                <button onclick="setGameTime(60, this)" class="time-btn py-3 px-2 sm:px-4 bg-emerald-50 border-2 border-emerald-500 text-emerald-700 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">1 MINIT</button>
                                <button onclick="setGameTime(0, this)" class="time-btn py-3 px-2 sm:px-4 bg-slate-50 border-2 border-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-all active:scale-95">TIADA HAD</button>
                            </div>
                        </div>

                        <button onclick="startGameSession()" class="w-full py-3.5 sm:py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 font-fun text-base sm:text-lg transition-all active:scale-95">
                            MULA KUIZ SEKARANG 🚀
                        </button>
                    </div>
                </div>
            `;
            appState.selectedLevel = 'SENANG';
            appState.selectedTime = 60;
        }

        function setGameLevel(lvl, el) {
            document.querySelectorAll('.level-btn').forEach(b => {
                b.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                b.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-600');
            });
            el.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-600');
            el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            appState.selectedLevel = lvl;
        }

        function setGameTime(t, el) {
            document.querySelectorAll('.time-btn').forEach(b => {
                b.classList.remove('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                b.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-600');
            });
            el.classList.remove('border-slate-200', 'bg-slate-50', 'text-slate-600');
            el.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            appState.selectedTime = t;
        }

        function startGameSession() {
            SoundFX.playClick();
            appState.activeQuestions = generateQuestionBank(appState.selectedTopic, appState.selectedLevel);
            appState.currentQuestionIndex = 0;
            appState.score = 0;
            appState.correctCount = 0;
            appState.wrongCount = 0;
            appState.timeLeft = appState.selectedTime;
            
            renderQuizQuestion();

            if (appState.selectedTime > 0) {
                if (appState.timerInterval) clearInterval(appState.timerInterval);
                appState.timerInterval = setInterval(() => {
                    appState.timeLeft--;
                    const timerEl = document.getElementById('quiz-timer-display');
                    if (timerEl) timerEl.innerText = appState.timeLeft + 's';
                    if (appState.timeLeft <= 0) {
                        clearInterval(appState.timerInterval);
                        endGameSession();
                    }
                }, 1000);
            }
        }

        function renderQuizQuestion() {
            if (appState.currentQuestionIndex >= appState.activeQuestions.length) {
                endGameSession();
                return;
            }

            const q = appState.activeQuestions[appState.currentQuestionIndex];
            const topic = TOPICS.find(t => t.id === appState.selectedTopic);
            const vp = document.getElementById('main-viewport');

            let optionsHTML = "";
            if (q.pilihan && Array.isArray(q.pilihan)) {
                optionsHTML = q.pilihan.map((opt, idx) => `
                    <button onclick="handleAnswerSelection('${opt.toString().replace(/'/g, "\\'")}', this)" class="answer-option w-full p-3.5 sm:p-4 bg-slate-50 hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-500 rounded-2xl font-bold text-slate-800 text-left transition-all flex items-center justify-between group active:scale-[0.98]">
                        <span class="flex items-center space-x-3">
                            <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-500 group-hover:bg-emerald-500 group-hover:text-white group-hover:border-emerald-500 transition-all shrink-0">${String.fromCharCode(65 + idx)}</span>
                            <span class="text-sm sm:text-base">${opt}</span>
                        </span>
                        <i class="fa-solid fa-chevron-right text-slate-300 group-hover:text-emerald-600 transition-all text-sm shrink-0"></i>
                    </button>
                `).join('');
            }

            vp.innerHTML = `
                <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl p-5 sm:p-8 border border-slate-100 flex flex-col my-auto">
                    <div class="flex items-center justify-between mb-4 sm:mb-6 pb-3 sm:pb-4 border-b border-slate-100 gap-2">
                        <div class="flex items-center space-x-2">
                            <span class="bg-emerald-100 text-emerald-800 text-[10px] sm:text-xs font-bold px-2.5 sm:px-3 py-1 rounded-full">${topic.short}</span>
                            <span class="text-[11px] sm:text-xs font-bold text-slate-400">Soalan ${appState.currentQuestionIndex + 1} / 20</span>
                        </div>
                        <div class="flex items-center space-x-2 sm:space-x-3 shrink-0">
                            <div class="text-[11px] sm:text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 sm:px-3 py-1.5 rounded-xl">⭐ ${appState.score}</div>
                            ${appState.selectedTime > 0 ? `<div id="quiz-timer-display" class="text-[11px] sm:text-xs font-bold text-rose-600 bg-rose-50 px-2.5 sm:px-3 py-1.5 rounded-xl"><i class="fa-solid fa-clock mr-1"></i>${appState.timeLeft}s</div>` : ''}
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-slate-50 to-emerald-50/40 border border-slate-100 rounded-2xl p-4 mb-5 sm:mb-6 text-center">
                        <div class="text-[10px] sm:text-xs font-bold text-emerald-700 uppercase tracking-wide mb-1"><i class="fa-solid fa-chart-pie mr-1"></i> ${q.gambarajah}</div>
                        <div class="text-xs sm:text-sm font-medium text-slate-700 leading-relaxed">${q.soalan}</div>
                    </div>

                    <div class="space-y-2.5 sm:space-y-3 mb-5 sm:mb-6">
                        ${optionsHTML}
                    </div>

                    <div id="feedback-box" class="hidden rounded-2xl p-4 mb-4 text-xs sm:text-sm"></div>

                    <button id="next-btn" onclick="nextQuestion()" class="hidden w-full py-3.5 sm:py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-lg shadow-emerald-600/30 font-fun text-base sm:text-lg transition-all active:scale-95">
                        SOALAN SETERUSNYA <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            `;
        }

        function handleAnswerSelection(selectedOpt, btnEl) {
            document.querySelectorAll('.answer-option').forEach(b => b.disabled = true);
            
            const q = appState.activeQuestions[appState.currentQuestionIndex];
            const isCorrect = (selectedOpt.trim() === q.jawapan.toString().trim());

            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                SoundFX.playCorrect();
                appState.score += 5;
                appState.correctCount++;
                btnEl.classList.remove('bg-slate-50', 'border-slate-200');
                btnEl.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900');
                
                feedbackBox.className = "rounded-2xl p-4 mb-4 bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs sm:text-sm";
                feedbackBox.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-emerald-700 mb-1 text-sm sm:text-base">
                        <i class="fa-solid fa-circle-check"></i><span>BETUL! (+5 Markah)</span>
                    </div>
                    <p class="text-emerald-800">${q.penerangan}</p>
                `;
                
                try {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                } catch(e) {}
            } else {
                SoundFX.playWrong();
                appState.wrongCount++;
                btnEl.classList.remove('bg-slate-50', 'border-slate-200');
                btnEl.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');

                feedbackBox.className = "rounded-2xl p-4 mb-4 bg-rose-50 border border-rose-200 text-rose-900 text-xs sm:text-sm";
                feedbackBox.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-rose-700 mb-1 text-sm sm:text-base">
                        <i class="fa-solid fa-circle-xmark"></i><span>CUBA LAGI!</span>
                    </div>
                    <p class="text-rose-800 mb-1">Jawapan anda: <strong>${selectedOpt}</strong> | Jawapan betul: <strong class="text-emerald-700">${q.jawapan}</strong></p>
                    <p class="text-slate-700">${q.penerangan}</p>
                `;
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            SoundFX.playClick();
            appState.currentQuestionIndex++;
            renderQuizQuestion();
        }

        function endGameSession() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            
            const u = appState.currentUser;
            if (u) {
                if (!u.topicScores) u.topicScores = {};
                u.score += appState.score;
                u.stats.totalAnswered += (appState.correctCount + appState.wrongCount);
                u.stats.totalCorrect += appState.correctCount;
                u.stats.totalWrong += appState.wrongCount;
                
                if (!u.topicScores[appState.selectedTopic] || appState.score > u.topicScores[appState.selectedTopic]) {
                    u.topicScores[appState.selectedTopic] = appState.score;
                }

                if (!u.completedTopics.includes(appState.selectedTopic)) {
                    u.completedTopics.push(appState.selectedTopic);
                }
                saveAppStateToStorage();
            }

            const topic = TOPICS.find(t => t.id === appState.selectedTopic);
            const vp = document.getElementById('main-viewport');
            const totalQ = appState.correctCount + appState.wrongCount || 1;
            const accuracy = Math.round((appState.correctCount / totalQ) * 100);

            vp.innerHTML = `
                <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100 text-center my-auto">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-emerald-100 text-emerald-600 rounded-3xl mx-auto flex items-center justify-center text-3xl sm:text-4xl mb-4 shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold font-fun text-slate-900 mb-1">TAHNIAH! 🎉</h2>
                    <p class="text-xs text-slate-500 mb-5">Anda telah melengkapkan sesi latihan ${topic.title}</p>

                    <div class="bg-slate-50 rounded-2xl p-4 mb-6 space-y-2 text-left text-xs font-bold text-slate-700">
                        <div class="flex justify-between"><span>Tahap:</span><span class="text-indigo-600">${appState.selectedLevel}</span></div>
                        <div class="flex justify-between"><span>Jawapan Betul:</span><span class="text-emerald-600">${appState.correctCount} / 20</span></div>
                        <div class="flex justify-between"><span>Jawapan Salah:</span><span class="text-rose-600">${appState.wrongCount}</span></div>
                        <div class="flex justify-between"><span>Markah Diperolehi:</span><span class="text-amber-600">${appState.score} / 100</span></div>
                        <div class="flex justify-between"><span>Ketepatan:</span><span class="text-teal-600">${accuracy}%</span></div>
                    </div>

                    <div class="space-y-3">
                        <button onclick="startGameSession()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/30 font-fun text-sm sm:text-base transition-all active:scale-95">
                            MAIN SEMULA
                        </button>
                        <button onclick="renderDashboard()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl font-fun text-sm sm:text-base transition-all active:scale-95">
                            DASHBOARD UTAMA
                        </button>
                    </div>
                </div>
            `;
            try {
                confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } });
            } catch(e) {}
        }

        function renderLeaderboard() {
            SoundFX.playClick();
            let sortedUsers = [...appState.users].sort((a, b) => b.score - a.score);
            let lbHTML = sortedUsers.map((u, idx) => `
                <div class="flex items-center justify-between p-3.5 sm:p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div class="flex items-center space-x-3">
                        <span class="w-7 h-7 sm:w-8 sm:h-8 rounded-xl bg-amber-100 text-amber-700 font-bold flex items-center justify-center text-xs shrink-0">#${idx + 1}</span>
                        <div class="w-9 h-9 sm:w-10 sm:h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center shrink-0"><i class="fa-solid ${u.avatar}"></i></div>
                        <div>
                            <div class="text-xs font-bold text-slate-800">${u.name}</div>
                            <div class="text-[10px] text-slate-400">Topik Selesai: ${u.completedTopics ? u.completedTopics.length : 0}</div>
                        </div>
                    </div>
                    <div class="text-xs sm:text-sm font-bold text-emerald-600 shrink-0">⭐ ${u.score}</div>
                </div>
            `).join('');

            if (sortedUsers.length === 0) {
                lbHTML = `<div class="text-center text-xs text-slate-400 py-8">Belum ada rekod pemain lagi.</div>`;
            }

            const vp = document.getElementById('main-viewport');
            vp.innerHTML = `
                <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100 my-auto">
                    <div class="flex items-center space-x-3 mb-6">
                        <button onclick="renderDashboard()" class="w-10 h-10 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 font-bold shrink-0"><i class="fa-solid fa-arrow-left"></i></button>
                        <div>
                            <h2 class="text-base sm:text-lg font-bold text-slate-900 font-fun">🏆 LEADERBOARD</h2>
                            <p class="text-xs text-slate-500">Kedudukan Pencapaian Pemain</p>
                        </div>
                    </div>
                    <div class="space-y-3 max-h-[50vh] overflow-y-auto pr-1">
                        ${lbHTML}
                    </div>
                </div>
            `;
        }

        window.onload = function () {
            renderWelcomeScreen();
        };
    </script>
</body>
</html>
