<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kids Bernama Edu Kidz - Matematik Tahun 3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti for Celebration Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.1), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
        }
        .btn-hover {
            transition: all 0.2s ease-in-out;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .game-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-card:hover {
            transform: translateY(-4px);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.showScreen('home')">
                <div class="bg-yellow-400 text-blue-900 font-extrabold p-2 rounded-xl text-2xl shadow-md flex items-center justify-center w-12 h-12">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl tracking-wide">Bernama Edu Kidz</h1>
                    <p class="text-xs text-blue-200 font-medium">Matematik Tahun 3: Panjang, Jisim & Isipadu</p>
                </div>
            </div>
            
            <!-- Navigation Links / User Status -->
            <div class="flex items-center space-x-2 sm:space-x-4" id="nav-user-area">
                <!-- Dynamically updated based on login state -->
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6" id="main-container">
        <!-- Dynamic Screens injected here -->
    </main>

    <footer class="bg-slate-800 text-slate-300 py-6 mt-auto border-t border-slate-700">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="font-semibold text-sm sm:text-base text-white">Math Kids Bernama Edu Kidz &copy; 2026</p>
            <p class="text-xs text-slate-400 mt-1">Silibus Kementerian Pendidikan Malaysia (KPM) - Kurikulum Standard Sekolah Rendah (KSSR) Tahun 3</p>
        </div>
    </footer>

    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-100" id="modal-content">
            <!-- Modal content dynamically loaded -->
        </div>
    </div>

    <script>
        // --- DATA STRUCTURE & COMPREHENSIVE QUESTION BANK (660 UNIQUE QUESTIONS GENERATOR) ---
        
        const categoriesData = [
            { id: 1, name: "Tukar Unit Panjang", icon: "fa-ruler", color: "bg-blue-500", desc: "Meter (m) kepada Sentimeter (cm) dan sebaliknya." },
            { id: 2, name: "Tambah & Tolak Panjang", icon: "fa-ruler-combined", color: "bg-indigo-500", desc: "Operasi tambah dan tolak unit panjang m dan cm." },
            { id: 3, name: "Darab & Bahagi Panjang", icon: "fa-scissors", color: "bg-violet-500", desc: "Pendaraban dan pembahagian ukuran panjang." },
            { id: 4, name: "Tukar Unit Jisim", icon: "fa-weight-scale", color: "bg-amber-500", desc: "Kilogram (kg) kepada Gram (g) dan sebaliknya." },
            { id: 5, name: "Tambah & Tolak Jisim", icon: "fa-scale-balanced", color: "bg-orange-500", desc: "Operasi tambah dan tolak jisim objek." },
            { id: 6, name: "Darab & Bahagi Jisim", icon: "fa-boxes-packing", color: "bg-red-500", desc: "Pendaraban dan pembahagian jisim barangan." },
            { id: 7, name: "Tukar Unit Isipadu Cecair", icon: "fa-bottle-droplet", color: "bg-teal-500", desc: "Liter (l) kepada Mililiter (ml) dan sebaliknya." },
            { id: 8, name: "Tambah & Tolak Isipadu", icon: "fa-jug-detergent", color: "bg-cyan-500", desc: "Operasi tambah dan tolak isipadu cecair." },
            { id: 9, name: "Darab & Bahagi Isipadu", icon: "fa-glass-water", color: "bg-sky-500", desc: "Pendaraban dan pembahagian isipadu cecair." },
            { id: 10, name: "Ayat Matematik Gambar", icon: "fa-image", color: "bg-emerald-500", desc: "Lengkapkan ayat matematik berdasarkan rajah." },
            { id: 11, name: "Penyelesaian Masalah", icon: "fa-brain", color: "bg-purple-500", desc: "Soalan situasi harian dan rutin kehidupan." }
        ];

        // Question Bank Storage generator guaranteeing exactly 20 unique questions per level
        class QuestionBankGenerator {
            static generateAll() {
                const bank = {};
                categoriesData.forEach(cat => {
                    bank[cat.id] = {
                        senang: this.generateCategoryQuestions(cat.id, 'Senang', 20),
                        sederhana: this.generateCategoryQuestions(cat.id, 'Sederhana', 20),
                        susah: this.generateCategoryQuestions(cat.id, 'Susah', 20)
                    };
                });
                return bank;
            }

            static generateCategoryQuestions(catId, level, count) {
                const list = [];
                for (let i = 1; i <= count; i++) {
                    const qId = `CAT${catId}_${level.toUpperCase()}_${String(i).padStart(3, '0')}`;
                    list.push(this.createSpecificQuestion(catId, level, i, qId));
                }
                return list;
            }

            static createSpecificQuestion(catId, level, index, qId) {
                let qText = "", options = [], answer = "";
                let num1 = index * (level === 'Senang' ? 1 : level === 'Sederhana' ? 3 : 7);
                if (num1 <= 0) num1 = 2;

                switch(catId) {
                    case 1: // Tukar Unit Panjang
                        if (level === 'Senang') {
                            const m = index;
                            qText = `${m} m bersamaan dengan berapa sentimeter?`;
                            answer = `${m * 100} cm`;
                            options = [`${m * 100} cm`, `${m * 10 + 50} cm`, `${m * 100 + 10} cm`, `${m} cm`];
                        } else if (level === 'Sederhana') {
                            const cm = index * 100 + 50;
                            qText = `${cm} cm bersamaan dengan berapa meter dan sentimeter?`;
                            const mPart = Math.floor(cm / 100);
                            const cmPart = cm % 100;
                            answer = `${mPart} m ${cmPart} cm`;
                            options = [`${mPart} m ${cmPart} cm`, `${mPart + 1} m ${cmPart} cm`, `${mPart} m ${cmPart + 20} cm`, `${mPart - 1} m ${cmPart} cm`];
                        } else {
                            const m = index + 4;
                            const cm = index * 25;
                            qText = `Tukarkan ${m} m ${cm} cm kepada sentimeter (cm).`;
                            const total = m * 100 + cm;
                            answer = `${total} cm`;
                            options = [`${total} cm`, `${total + 50} cm`, `${total - 25} cm`, `${total + 100} cm`];
                        }
                        break;
                    case 2: // Tambah & Tolak Panjang
                        if (level === 'Senang') {
                            const a = index * 10;
                            const b = index * 5;
                            qText = `${a} cm + ${b} cm = ______ cm`;
                            answer = `${a + b} cm`;
                            options = [`${a + b} cm`, `${a + b + 10} cm`, `${Math.abs(a - b)} cm`, `${a + b - 5} cm`];
                        } else if (level === 'Sederhana') {
                            const m1 = index;
                            const m2 = index + 2;
                            qText = `${m1} m 40 cm + ${m2} m 30 cm = ______ m ______ cm`;
                            const tM = m1 + m2;
                            const tCm = 70;
                            answer = `${tM} m ${tCm} cm`;
                            options = [`${tM} m ${tCm} cm`, `${tM + 1} m ${tCm} cm`, `${tM} m ${tCm - 20} cm`, `${tM - 1} m ${tCm} cm`];
                        } else {
                            const m = index + 5;
                            qText = `${m} m - 2 m 45 cm = ______ cm`;
                            const totalCm = m * 100 - 245;
                            answer = `${totalCm} cm`;
                            options = [`${totalCm} cm`, `${totalCm + 10} cm`, `${totalCm - 5} cm`, `${totalCm + 100} cm`];
                        }
                        break;
                    case 3: // Darab & Bahagi Panjang
                        if (level === 'Senang') {
                            qText = `Panjang seutas reben ialah ${index * 10} cm. Berapakah jumlah panjang 2 utas reben yang sama?`;
                            const ans = index * 20;
                            answer = `${ans} cm`;
                            options = [`${ans} cm`, `${ans + 10} cm`, `${ans - 5} cm`, `${ans + 20} cm`];
                        } else if (level === 'Sederhana') {
                            const m = index * 2;
                            qText = `${m} m 50 cm × 3 = ______ m ______ cm`;
                            const totalCm = (m * 100 + 50) * 3;
                            const resM = Math.floor(totalCm / 100);
                            const resCm = totalCm % 100;
                            answer = `${resM} m ${resCm} cm`;
                            options = [`${resM} m ${resCm} cm`, `${resM + 1} m ${resCm} cm`, `${resM} m ${resCm + 10} cm`, `${resM - 1} m ${resCm} cm`];
                        } else {
                            const cm = index * 100 + 200;
                            qText = `${cm} cm bahagi dengan 4 = ______ cm`;
                            const ans = cm / 4;
                            answer = `${ans} cm`;
                            options = [`${ans} cm`, `${ans + 10} cm`, `${ans - 10} cm`, `${ans + 25} cm`];
                        }
                        break;
                    case 4: // Tukar Unit Jisim
                        if (level === 'Senang') {
                            const kg = index;
                            qText = `${kg} kg bersamaan dengan berapa gram?`;
                            answer = `${kg * 1000} g`;
                            options = [`${kg * 1000} g`, `${kg * 100} g`, `${kg * 1000 + 500} g`, `${kg} g`];
                        } else if (level === 'Sederhana') {
                            const g = index * 250 + 1000;
                            qText = `Tukarkan ${g} g kepada kilogram dan gram.`;
                            const kgPart = Math.floor(g / 1000);
                            const gPart = g % 1000;
                            answer = `${kgPart} kg ${gPart} g`;
                            options = [`${kgPart} kg ${gPart} g`, `${kgPart + 1} kg ${gPart} g`, `${kgPart} kg ${gPart + 100} g`, `${kgPart} kg ${gPart - 50} g`];
                        } else {
                            const kg = index + 1;
                            const g = index * 125;
                            qText = `Berapakah jumlah dalam gram bagi ${kg} kg ${g} g?`;
                            const total = kg * 1000 + g;
                            answer = `${total} g`;
                            options = [`${total} g`, `${total + 100} g`, `${total - 50} g`, `${total + 250} g`];
                        }
                        break;
                    case 5: // Tambah & Tolak Jisim (Refined Susah Level with High Variety)
                        if (level === 'Senang') {
                            const a = index * 100;
                            const b = index * 50;
                            qText = `${a} g + ${b} g = ______ g`;
                            answer = `${a + b} g`;
                            options = [`${a + b} g`, `${a + b + 100} g`, `${Math.abs(a - b)} g`, `${a + b - 50} g`];
                        } else if (level === 'Sederhana') {
                            const kg1 = index;
                            const kg2 = index + 1;
                            qText = `${kg1} kg 300 g + ${kg2} kg 400 g = ______ kg ______ g`;
                            const tKg = kg1 + kg2;
                            const tG = 700;
                            answer = `${tKg} kg ${tG} g`;
                            options = [`${tKg} kg ${tG} g`, `${tKg + 1} kg ${tG} g`, `${tKg} kg ${tG - 100} g`, `${tKg} kg ${tG + 200} g`];
                        } else {
                            // Refined & Diverse Difficult Questions for Category 5 (Tambah & Tolak Jisim)
                            const diffTypes = [
                                {
                                    q: `Kira nilai berikut dalam gram (g):\n6 kg 450 g + 3 kg 820 g - 2 kg 100 g = ______ g`,
                                    ans: (6 * 1000 + 450) + (3 * 1000 + 820) - (2 * 1000 + 100),
                                    unit: 'g'
                                },
                                {
                                    q: `Sebuah kontena memuatkan 12 kg 350 g beras. Pekerja menambah 4 beg beras yang masing-masing jisimnya 1 kg 500 g. Berapakah jumlah jisim beras sekarang dalam gram?`,
                                    ans: (12 * 1000 + 350) + 4 * (1 * 1000 + 500),
                                    unit: 'g'
                                },
                                {
                                    q: `Selesaikan dalam kg dan g:\n15 kg 200 g - 4 kg 750 g + 3 kg 400 g = ______ kg ______ g`,
                                    ansTotal: (15 * 1000 + 200) - (4 * 1000 + 750) + (3 * 1000 + 400)
                                },
                                {
                                    q: `Ibu membeli 3 paket tepung. Paket A jisimnya 850 g, Paket B jisimnya 1 kg 200 g, dan Paket C jisimnya 2 kg 450 g. Hitung jumlah jisim ketiga-tiga paket tepung dalam gram.`,
                                    ans: 850 + (1 * 1000 + 200) + (2 * 1000 + 450),
                                    unit: 'g'
                                },
                                {
                                    q: `Sebuah lori kecil membawa muatan durian seberat 25 kg. Selepas dihantar ke gerai pertama, muatannya berkurang sebanyak 7 kg 650 g. Berapakah baki jisim durian dalam kilogram dan gram?`,
                                    ansTotal: (25 * 1000) - (7 * 1000 + 650)
                                },
                                {
                                    q: `Kira hasil tambah berikut dalam gram:\n4 kg 90 g + 7 kg 500 g + 2 kg 85 g = ______ g`,
                                    ans: (4 * 1000 + 90) + (7 * 1000 + 500) + (2 * 1000 + 85),
                                    unit: 'g'
                                },
                                {
                                    q: `Sebuah kotak berisi mangga mempunyai jisim 10 kg. Jisim kotak kosong ialah 1 kg 250 g. Berapakah jisim mangga sahaja dalam gram?`,
                                    ans: (10 * 1000) - (1 * 1000 + 250),
                                    unit: 'g'
                                },
                                {
                                    q: `Kamil mempunyai beban 18 kg 400 g. Dia mengurangkan beban itu sebanyak 9 kg 880 g. Berapakah baki beban dalam gram?`,
                                    ans: (18 * 1000 + 400) - (9 * 1000 + 880),
                                    unit: 'g'
                                }
                            ];

                            const selectedProblem = diffTypes[(index - 1) % diffTypes.length];
                            qText = selectedProblem.q;

                            if (selectedProblem.unit === 'g') {
                                const totalG = selectedProblem.ans;
                                answer = `${totalG} g`;
                                options = [
                                    `${totalG} g`,
                                    `${totalG + 250} g`,
                                    `${totalG - 150} g`,
                                    `${totalG + 500} g`
                                ];
                            } else {
                                const totalG = selectedProblem.ansTotal;
                                const kPart = Math.floor(totalG / 1000);
                                const gPart = totalG % 1000;
                                answer = `${kPart} kg ${gPart} g`;
                                options = [
                                    `${kPart} kg ${gPart} g`,
                                    `${kPart + 1} kg ${gPart} g`,
                                    `${kPart} kg ${gPart + 200} g`,
                                    `${kPart - 1} kg ${gPart} g`
                                ];
                            }
                        }
                        break;
                    case 6: // Darab & Bahagi Jisim
                        if (level === 'Senang') {
                            const g = index * 100;
                            qText = `Jisim sebuku roti ialah ${g} g. Berapakah jisim 3 buku roti yang sama?`;
                            const ans = g * 3;
                            answer = `${ans} g`;
                            options = [`${ans} g`, `${ans + 50} g`, `${ans - 100} g`, `${ans + 200} g`];
                        } else if (level === 'Sederhana') {
                            qText = `2 kg 200 g × 4 = ______ kg ______ g`;
                            const totalG = (2200) * 4;
                            const rKg = Math.floor(totalG / 1000);
                            const rG = totalG % 1000;
                            answer = `${rKg} kg ${rG} g`;
                            options = [`${rKg} kg ${rG} g`, `${rKg + 1} kg ${rG} g`, `${rKg} kg ${rG + 100} g`, `${rKg - 1} kg ${rG} g`];
                        } else {
                            // Refined & Diverse Difficult Questions for Category 6 (Darab & Bahagi Jisim)
                            const diffTypes = [
                                {
                                    q: `Selesaikan dalam kilogram dan gram:\n(5 kg 400 g × 3) ÷ 2 = ______ kg ______ g`,
                                    ansTotal: ((5 * 1000 + 400) * 3) / 2
                                },
                                {
                                    q: `Sebuah kilang menghasilkan 8 paket biskut yang sama jisimnya. Jumlah jisim semua paket ialah 6 kg 400 g. Berapakah jisim bagi 3 paket biskut dalam gram?`,
                                    ans: (6400 / 8) * 3,
                                    unit: 'g'
                                },
                                {
                                    q: `Kira nilai berikut dalam gram:\n12 kg 600 g ÷ 4 + 2 kg 350 g × 2 = ______ g`,
                                    ans: (12600 / 4) + ((2 * 1000 + 350) * 2),
                                    unit: 'g'
                                },
                                {
                                    q: `Ibu membeli 5 biji kek yang setiap satunya mempunyai jisim 1 kg 800 g. Jika ibu membahagikan sama banyak kepada 3 buah keluarga, berapakah jisim kek yang diterima oleh setiap keluarga dalam gram?`,
                                    ans: (5 * (1 * 1000 + 800)) / 3,
                                    unit: 'g'
                                },
                                {
                                    q: `Sebuah kontena memuatkan 4 kotak barang. Jisim setiap kotak ialah 3 kg 750 g. Hitung jumlah jisim dalam kilogram dan gram.`,
                                    ansTotal: (3 * 1000 + 750) * 4
                                },
                                {
                                    q: `Kira hasil darab dan bahagi berikut dalam kg dan g:\n9 kg 120 g ÷ 3 × 2 = ______ kg ______ g`,
                                    ansTotal: (9120 / 3) * 2
                                },
                                {
                                    q: `Pak Cik Ali menuai kelapa sawit dan membungkusnya kepada 6 beg sama berat. Jumlah keseluruhan jisim ialah 24 kg 600 g. Berapakah jisim bagi 4 beg kelapa sawit tersebut dalam kilogram dan gram?`,
                                    ansTotal: (24600 / 6) * 4
                                },
                                {
                                    q: `Sebuah lori kecil mengangkut 6 tong gas. Setiap tong gas mempunyai jisim 14 kg 500 g. Hitung jumlah jisim semua tong gas dalam gram.`,
                                    ans: (14 * 1000 + 500) * 6,
                                    unit: 'g'
                                }
                            ];

                            const selectedProblem = diffTypes[(index - 1) % diffTypes.length];
                            qText = selectedProblem.q;

                            if (selectedProblem.unit === 'g') {
                                const totalG = selectedProblem.ans;
                                answer = `${totalG} g`;
                                options = [
                                    `${totalG} g`,
                                    `${totalG + 200} g`,
                                    `${totalG - 100} g`,
                                    `${totalG + 500} g`
                                ];
                            } else {
                                const totalG = selectedProblem.ansTotal;
                                const kPart = Math.floor(totalG / 1000);
                                const gPart = totalG % 1000;
                                answer = `${kPart} kg ${gPart} g`;
                                options = [
                                    `${kPart} kg ${gPart} g`,
                                    `${kPart + 1} kg ${gPart} g`,
                                    `${kPart} kg ${gPart + 150} g`,
                                    `${kPart - 1} kg ${gPart} g`
                                ];
                            }
                        }
                        break;
                    case 7: // Tukar Unit Isipadu Cecair
                        if (level === 'Senang') {
                            const l = index;
                            qText = `${l} liter (l) bersamaan dengan berapa mililiter (ml)?`;
                            answer = `${l * 1000} ml`;
                            options = [`${l * 1000} ml`, `${l * 100} ml`, `${l * 1000 + 250} ml`, `${l} ml`];
                        } else if (level === 'Sederhana') {
                            const ml = index * 250 + 1000;
                            qText = `Tukarkan ${ml} ml kepada liter dan mililiter.`;
                            const lPart = Math.floor(ml / 1000);
                            const mlPart = ml % 1000;
                            answer = `${lPart} l ${mlPart} ml`;
                            options = [`${lPart} l ${mlPart} ml`, `${lPart + 1} l ${mlPart} ml`, `${lPart} l ${mlPart + 100} ml`, `${lPart} l ${mlPart - 50} ml`];
                        } else {
                            const l = index + 1;
                            const ml = index * 150;
                            qText = `Tukarkan ${l} l ${ml} ml kepada mililiter (ml).`;
                            const total = l * 1000 + ml;
                            answer = `${total} ml`;
                            options = [`${total} ml`, `${total + 50} ml`, `${total - 100} ml`, `${total + 200} ml`];
                        }
                        break;
                    case 8: // Tambah & Tolak Isipadu
                        if (level === 'Senang') {
                            const a = index * 100;
                            const b = index * 50;
                            qText = `${a} ml + ${b} ml = ______ ml`;
                            answer = `${a + b} ml`;
                            options = [`${a + b} ml`, `${a + b + 50} ml`, `${Math.abs(a - b)} ml`, `${a + b + 200} ml`];
                        } else if (level === 'Sederhana') {
                            const l1 = index;
                            const l2 = index + 1;
                            qText = `${l1} l 200 ml + ${l2} l 500 ml = ______ l ______ ml`;
                            const tL = l1 + l2;
                            const tMl = 700;
                            answer = `${tL} l ${tMl} ml`;
                            options = [`${tL} l ${tMl} ml`, `${tL + 1} l ${tMl} ml`, `${tL} l ${tMl - 100} ml`, `${tL} l ${tMl + 200} ml`];
                        } else {
                            // Refined & Diverse Difficult Questions for Category 8 (Tambah & Tolak Isipadu)
                            const diffTypes = [
                                {
                                    q: `Kira nilai berikut dalam mililiter (ml):\n5 l 350 ml + 2 l 820 ml - 1 l 500 ml = ______ ml`,
                                    ans: (5 * 1000 + 350) + (2 * 1000 + 820) - (1 * 1000 + 500),
                                    unit: 'ml'
                                },
                                {
                                    q: `Sebuah tong besar mengandungi 15 l air. Puan Suri menuang keluar 3 l 450 ml air ke dalam baldi dan menambah 2 l 120 ml air oren. Berapakah isipadu cecair sekarang dalam liter dan mililiter?`,
                                    ansTotal: (15 * 1000) - (3 * 1000 + 450) + (2 * 1000 + 120)
                                },
                                {
                                    q: `Selesaikan dalam l dan ml:\n8 l 100 ml - 2 l 650 ml + 4 l 300 ml = ______ l ______ ml`,
                                    ansTotal: (8 * 1000 + 100) - (2 * 1000 + 650) + (4 * 1000 + 300)
                                },
                                {
                                    q: `Sebuah bekas mengandungi 3 botol jus. Botol A ada 1 l 250 ml, Botol B ada 950 ml, dan Botol C ada 2 l 100 ml. Hitung jumlah isipadu jus dalam mililiter.`,
                                    ans: (1 * 1000 + 250) + 950 + (2 * 1000 + 100),
                                    unit: 'ml'
                                },
                                {

                this.timeLeft = 60;
                this.sessionStartTime = null;
            }

            saveUser() {
                if (this.currentUser) {
                    localStorage.setItem('edu_kidz_current_user', JSON.stringify(this.currentUser));
                    let users = JSON.parse(localStorage.getItem('edu_kidz_users')) || [];
                    const idx = users.findIndex(u => u.username === this.currentUser.username);
                    if (idx !== -1) {
                        users[idx] = this.currentUser;
                    } else {
                        users.push(this.currentUser);
                    }
                    localStorage.setItem('edu_kidz_users', JSON.stringify(users));
                } else {
                    localStorage.removeItem('edu_kidz_current_user');
                }
            }

            showScreen(screenName) {
                this.currentScreen = screenName;
                if (screenName !== 'game' && this.timerInterval) {
                    clearInterval(this.timerInterval);
                }
                renderApp();
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;

            let users = JSON.parse(localStorage.getItem('edu_kidz_users')) || [];
            if (users.some(u => u.username === username)) {
                showModal("Nama pengguna telah wujud. Sila pilih nama lain.");
                return;
            }

            const newUser = {
                username,
                password,
                history: [],
                masteredCount: 0
            };

            users.push(newUser);
            localStorage.setItem('edu_kidz_users', JSON.stringify(users));
            app.currentUser = newUser;
            app.saveUser();

            showModal(`Pendaftaran berjaya! Selamat datang, ${username}.`, () => {
                app.showScreen('home');
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            let users = JSON.parse(localStorage.getItem('edu_kidz_users')) || [];
            const found = users.find(u => u.username === username && u.password === password);

            if (found) {
                app.currentUser = found;
                app.saveUser();
                showModal(`Log masuk berjaya! Selamat kembali, ${username}.`, () => {
                    app.showScreen('home');
                });
            } else {
                showModal("Nama pengguna atau kata laluan tidak sah. Sila cuba lagi.");
            }
        }

        function logoutUser() {
            app.currentUser = null;
            localStorage.removeItem('edu_kidz_current_user');
            app.showScreen('home');
        }

        function checkAuthAndNavigate(screen) {
            if (!app.currentUser) {
                showModal("Sila log masuk atau daftar akaun terlebih dahulu untuk melihat profil dan kemajuan.", () => {
                    app.showScreen('login');
                });
            } else {
                app.showScreen(screen);
            }
        }

        function startPlayFlow() {
            app.showScreen('categories');
        }

        function selectCategory(catId) {
            app.selectedCategory = catId;
            app.showScreen('levels');
        }

        function selectLevel(level) {
            app.selectedLevel = level;
            app.showScreen('gametype');
        }

        function setTimerOption(seconds) {
            app.selectedTimer = seconds;
            [30, 60, 0].forEach(sec => {
                const btn = document.getElementById(`timer-${sec}`);
                if (btn) {
                    if (sec === seconds) {
                        btn.className = "py-3 px-4 rounded-xl border-2 font-extrabold transition text-sm border-blue-600 bg-blue-50 text-blue-700";
                    } else {
                        btn.className = "py-3 px-4 rounded-xl border-2 font-extrabold transition text-sm border-slate-200 text-slate-700 hover:border-blue-500";
                    }
                }
            });
        }

        function startActualGame() {
            const catBank = globalQuestionBank[app.selectedCategory][app.selectedLevel.toLowerCase()];
            // Uses all 20 questions generated in the bank
            app.currentQuestions = [...catBank];
            app.currentQuestionIndex = 0;
            app.score = 0;
            app.correctCount = 0;
            app.wrongCount = 0;
            app.userAnswersHistory = [];
            app.sessionStartTime = new Date().toLocaleDateString();

            app.showScreen('game');
            setTimeout(() => {
                initGamePlay();
            }, 50);
        }

        function initGamePlay() {
            loadQuestion();
        }

        function loadQuestion() {
            if (app.currentQuestionIndex >= app.currentQuestions.length) {
                finishGame();
                return;
            }

            const q = app.currentQuestions[app.currentQuestionIndex];
            const cat = categoriesData.find(c => c.id === app.selectedCategory);

            const qCounterEl = document.getElementById('game-q-counter');
            if (!qCounterEl) return;

            qCounterEl.innerText = `Soalan ${app.currentQuestionIndex + 1}/${app.currentQuestions.length}`;
            document.getElementById('game-cat-label').innerText = cat ? cat.name : '';
            document.getElementById('game-level-badge').innerText = `Tahap: ${app.selectedLevel}`;
            document.getElementById('game-score-display').innerText = app.score;
            document.getElementById('question-text').innerText = q.soalan;

            const optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';
            document.getElementById('feedback-box').classList.add('hidden');

            q.pilihan.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-500 text-slate-800 font-extrabold py-3.5 px-4 rounded-2xl transition text-base text-center shadow-sm";
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.jawapan, q);
                optContainer.appendChild(btn);
            });

            if (app.selectedTimer > 0) {
                app.timeLeft = app.selectedTimer;
                document.getElementById('timer-box').classList.remove('hidden');
                document.getElementById('game-timer-display').innerText = `${app.timeLeft}s`;
                
                if (app.timerInterval) clearInterval(app.timerInterval);
                app.timerInterval = setInterval(() => {
                    app.timeLeft--;
                    const timerDisplay = document.getElementById('game-timer-display');
                    if (timerDisplay) timerDisplay.innerText = `${app.timeLeft}s`;
                    if (app.timeLeft <= 0) {
                        clearInterval(app.timerInterval);
                        checkAnswer(null, q.jawapan, q);
                    }
                }, 1000);
            } else {
                const timerBox = document.getElementById('timer-box');
                if (timerBox) timerBox.classList.add('hidden');
            }
        }

        function checkAnswer(selected, correct, questionObj) {
            if (app.timerInterval) clearInterval(app.timerInterval);

            const isCorrect = (selected === correct);
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.remove('hidden');

            const buttons = document.querySelectorAll('#options-container button');
            buttons.forEach(b => {
                b.disabled = true;
                if (b.innerText === correct) {
                    b.className = "bg-emerald-100 border-2 border-emerald-500 text-emerald-800 font-extrabold py-3.5 px-4 rounded-2xl text-base text-center";
                } else if (b.innerText === selected && !isCorrect) {
                    b.className = "bg-rose-100 border-2 border-rose-500 text-rose-800 font-extrabold py-3.5 px-4 rounded-2xl text-base text-center";
                }
            });

            if (isCorrect) {
                app.score += 5;
                app.correctCount++;
                feedbackBox.className = "rounded-2xl p-4 text-center space-y-2 bg-emerald-50 border border-emerald-200 text-emerald-800";
                feedbackBox.innerHTML = `
                    <h4 class="font-extrabold text-lg"><i class="fa-solid fa-circle-check"></i> Tahniah! Jawapan Kamu Betul! (+5 Markah)</h4>
                    <p class="text-xs">${questionObj.penerangan}</p>
                `;
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            } else {
                app.wrongCount++;
                feedbackBox.className = "rounded-2xl p-4 text-center space-y-2 bg-rose-50 border border-rose-200 text-rose-800";
                feedbackBox.innerHTML = `
                    <h4 class="font-extrabold text-lg"><i class="fa-solid fa-circle-xmark"></i> Jangan Putus Asa! Cuba Lagi!</h4>
                    <p class="text-xs">Jawapan yang betul ialah: <strong>${correct}</strong></p>
                    <p class="text-xs text-slate-600">${questionObj.penerangan}</p>
                `;
            }

            app.userAnswersHistory.push({
                question: questionObj.soalan,
                selected: selected || 'Masa Tamat',
                correct: correct,
                isCorrect: isCorrect
            });

            setTimeout(() => {
                app.currentQuestionIndex++;
                loadQuestion();
            }, 3000);
        }

        function finishGame() {
            if (app.currentUser) {
                const cat = categoriesData.find(c => c.id === app.selectedCategory);
                const record = {
                    categoryId: app.selectedCategory,
                    categoryName: cat ? cat.name : '',
                    level: app.selectedLevel,
                    score: app.score,
                    correct: app.correctCount,
                    total: app.currentQuestions.length,
                    date: new Date().toLocaleDateString()
                };

                if (!app.currentUser.history) app.currentUser.history = [];
                app.currentUser.history.push(record);
                
                const uniqueCategories = new Set(app.currentUser.history.map(h => h.categoryId));
                app.currentUser.masteredCount = uniqueCategories.size;

                app.saveUser();
            }

            app.showScreen('result');
        }

        function showModal(message, callback) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div class="text-center space-y-4">
                    <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl mx-auto flex items-center justify-center text-2xl">
                        <i class="fa-solid fa-circle-info"></i>
                    </div>
                    <p class="text-slate-800 font-bold text-base">${message}</p>
                    <button onclick="closeModal(${callback ? callback.toString() : null})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 rounded-xl shadow transition">
                        OK
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal(cb) {
            document.getElementById('custom-modal').classList.add('hidden');
            if (typeof cb === 'function') cb();
        }

        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
