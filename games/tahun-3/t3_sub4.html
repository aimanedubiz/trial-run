    <!-- Audio Effects Synthesizer (Web Audio API) -->
    <script>
        const soundFx = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            },
            playCorrect() {
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554.37, now + 0.1);
                    osc.frequency.setValueAtTime(659.25, now + 0.2);
                    osc.frequency.setValueAtTime(880, now + 0.3);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.6);
                } catch(e) {}
            },
            playWrong() {
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } catch(e) {}
            },
            playClick() {
                try {
                    this.init();
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } catch(e) {}
            }
        };
    </script>

    <!-- Main Game Logic & Question Bank Script -->
    <script>
        
        // Malaysian Ringgit visual SVG or badge helper
        const moneyImages = {
            '5sen': '🪙 5 Sen',
            '10sen': '🪙 10 Sen',
            '20sen': '🪙 20 Sen',
            '50sen': '🪙 50 Sen',
            'RM1': '💵 RM1',
            'RM5': '💵 RM5',
            'RM10': '💵 RM10',
            'RM20': '💵 RM20',
            'RM50': '💵 RM50',
            'RM100': '💵 RM100'
        };

        // Complete robust question bank generator for all 6 categories × 3 levels × 20 questions = 360 questions
        function generateQuestionBank() {
            const bank = {};
            const categories = [
                { id: 'tambah', name: 'Tambah Wang' },
                { id: 'tolak', name: 'Tolak Wang' },
                { id: 'darab', name: 'Darab Wang' },
                { id: 'bahagi', name: 'Bahagi Wang' },
                { id: 'matawang', name: 'Kenal Matawang Negara Luar' },
                { id: 'masalah', name: 'Penyelesaian Masalah Wang' }
            ];
            const levels = ['Senang', 'Sederhana', 'Susah'];

            categories.forEach(cat => {
                bank[cat.id] = {};
                levels.forEach(lvl => {
                    bank[cat.id][lvl] = [];
                    for (let i = 1; i <= 20; i++) {
                        let qObj = createUniqueQuestion(cat.id, lvl, i);
                        bank[cat.id][lvl].push(qObj);
                    }
                });
            });
            return bank;
        }

        function createUniqueQuestion(catId, level, index) {
            const idCode = `${catId.toUpperCase().slice(0,3)}_${level.toUpperCase().slice(0,3)}_${index < 10 ? '0'+index : index}`;
            let q = { id: idCode, kategori: '', subtopik: '', tahap: level, aras_kognitif: 'Mengingat', jenis: 'Objektif', soalan: '', pilihan: [], jawapan: '', markah: 5, penerangan: '', visual: '' };

            if (catId === 'tambah') {
                q.kategori = 'Tambah Wang';
                if (level === 'Senang') {
                    q.subtopik = 'Tambah Wang Dalam Ratus';
                    q.aras_kognitif = 'Mengingat';
                    let a = Math.floor(Math.random() * 40 + 10) * 5;
                    let b = Math.floor(Math.random() * 30 + 10) * 5;
                    let sum = a + b;
                    q.soalan = `Berapakah jumlah bagi RM${a} + RM${b}?`;
                    q.jenis = 'Objektif';
                    let wrong1 = sum + 10;
                    let wrong2 = sum - 5;
                    let wrong3 = sum + 20;
                    q.pilihan = shuffleArray([`RM${sum}`, `RM${wrong1}`, `RM${wrong2}`, `RM${wrong3}`]);
                    q.jawapan = `RM${sum}`;
                    q.penerangan = `RM${a} + RM${b} = RM${sum}`;
                    q.visual = 'Paparkan ilustrasi wang RM50 dan RM10';
                } else if (level === 'Sederhana') {
                    q.subtopik = 'Tambah Wang Dalam Ribu';
                    q.aras_kognitif = 'Memahami';
                    let a = Math.floor(Math.random() * 300 + 100);
                    let b = Math.floor(Math.random() * 200 + 50);
                    let sum = a + b;
                    q.soalan = `Hitung jumlah berikut: RM${a} + RM${b} = ?`;
                    q.jenis = 'Objektif';
                    let wrong1 = sum + 15;
                    let wrong2 = sum - 10;
                    let wrong3 = sum + 30;
                    q.pilihan = shuffleArray([`RM${sum}`, `RM${wrong1}`, `RM${wrong2}`, `RM${wrong3}`]);
                    q.jawapan = `RM${sum}`;
                    q.penerangan = `RM${a} + RM${b} = RM${sum}`;
                    q.visual = 'Paparkan resit kedai buku';
                } else {
                    q.subtopik = 'Tambah Wang Tiga Nilai / Kompleks';
                    q.aras_kognitif = 'Mengaplikasi';
                    let a = Math.floor(Math.random() * 200 + 100);
                    let b = Math.floor(Math.random() * 150 + 50);
                    let c = Math.floor(Math.random() * 100 + 20);
                    let sum = a + b + c;
                    q.soalan = `Cari nilai bagi: RM${a} + RM${b} + RM${c} = RM ______`;
                    q.jenis = 'Isi Tempat Kosong';
                    q.jawapan = `${sum}`;
                    q.penerangan = `RM${a} + RM${b} + RM${c} = RM${sum}`;
                    q.visual = 'Paparkan bentuk lazim tambah wang tiga baris';
                }
            } else if (catId === 'tolak') {
                q.kategori = 'Tolak Wang';
                if (level === 'Senang') {
                    // Refined variety: Combining coin & note subtraction formats, vertical subtraction representation, and cash register change.
                    const subVariant = index % 3;
                    if (subVariant === 0) {
                        q.subtopik = 'Tolak Wang Asas Duit Syiling & Kertas';
                        q.aras_kognitif = 'Mengingat';
                        let a = Math.floor(Math.random() * 20 + 20) * 5; // e.g., RM100 - RM25
                        let b = Math.floor(Math.random() * 5 + 1) * 5;
                        let diff = a - b;
                        q.soalan = `Kira hasil tolak nilai ringgit berikut: RM${a} – RM${b} = ?`;
                        q.jenis = 'Objektif';
                        let w1 = diff + 5;
                        let w2 = diff - 5;
                        let w3 = diff + 10;
                        q.pilihan = shuffleArray([`RM${diff}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                        q.jawapan = `RM${diff}`;
                        q.penerangan = `RM${a} ditolak dengan RM${b} baki bersamaan RM${diff}.`;
                        q.visual = 'Paparkan ilustrasi kepingan wang kertas RM50 dan duit syiling';
                    } else if (subVariant === 1) {
                        q.subtopik = 'Cari Nilai yang Hilang (Pendaraban Tolak)';
                        q.aras_kognitif = 'Memahami';
                        let diff = Math.floor(Math.random() * 30 + 10) * 5;
                        let b = Math.floor(Math.random() * 20 + 5) * 5;
                        let a = diff + b;
                        q.soalan = `Apakah nilai tempat kosong? RM${a} – ______ = RM${diff}`;
                        q.jenis = 'Objektif';
                        let w1 = b + 10;
                        let w2 = b > 5 ? b - 5 : b + 15;
                        let w3 = b + 20;
                        q.pilihan = shuffleArray([`RM${b}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                        q.jawapan = `RM${b}`;
                        q.penerangan = `Untuk mencari nilai kosong: RM${a} – RM${diff} = RM${b}.`;
                        q.visual = 'Paparkan bentuk lazim tolak wang';
                    } else {
                        q.subtopik = 'Baki Wang Jajan Sekolah';
                        q.aras_kognitif = 'Mengingat';
                        let a = 50; // RM50 note
                        let b = Math.floor(Math.random() * 7 + 3) * 5; // e.g., RM15, RM20, RM25
                        let diff = a - b;
                        q.soalan = `Amin membawa wang sebanyak RM${a} ke kantin sekolah. Dia membelanjakan RM${b} untuk membeli makanan. Berapakah baki wang Amin?`;
                        q.jenis = 'Objektif';
                        let w1 = diff + 10;
                        let w2 = diff - 5;
                        let w3 = diff + 15;
                        q.pilihan = shuffleArray([`RM${diff}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                        q.jawapan = `RM${diff}`;
                        q.penerangan = `Baki wang = RM${a} – RM${b} = RM${diff}.`;
                        q.visual = 'Paparkan dompet wang dan kupon makanan kantin';
                    }
                } else if (level === 'Sederhana') {
                    // Refined Sederhana: Ribu subtraction, word problems with decimal cents or dual items, and missing subtrahend in thousands.
                    const subVariant = index % 3;
                    if (subVariant === 0) {
                        q.subtopik = 'Tolak Wang Dalam Ribu';
                        q.aras_kognitif = 'Memahami';
                        let a = Math.floor(Math.random() * 5 + 5) * 100 + 50; // cth: RM750.50
                        let b = Math.floor(Math.random() * 3 + 1) * 100 + 25; // cth: RM225.25
                        let diffNum = parseFloat((a - b).toFixed(2));
                        q.soalan = `Selesaikan operasi tolak berikut:\nRM${a.toFixed(2)} – RM${b.toFixed(2)} = RM ______`;
                        q.jenis = 'Isi Tempat Kosong';
                        q.jawapan = `${diffNum}`;
                        q.penerangan = `RM${a.toFixed(2)} – RM${b.toFixed(2)} = RM${diffNum}`;
                        q.visual = 'Paparkan resit pasar raya besar';
                    } else if (subVariant === 1) {
                        q.subtopik = 'Tolak Berturut-turut Dua Kali (Two-step Subtraction)';
                        q.aras_kognitif = 'Mengaplikasi';
                        let awal = 800;
                        let t1 = Math.floor(Math.random() * 10 + 10) * 10; // e.g. 150
                        let t2 = Math.floor(Math.random() * 5 + 5) * 10;   // e.g. 80
                        let diff = awal - t1 - t2;
                        q.soalan = `Puan Aishah mempunyai wang RM${awal}. Dia membayar bil elektrik sebanyak RM${t1} dan bil air sebanyak RM${t2}. Berapakah baki wang Puan Aishah sekarang?`;
                        q.jenis = 'Objektif';
                        let w1 = diff + 20;
                        let w2 = diff - 30;
                        let w3 = diff + 50;
                        q.pilihan = shuffleArray([`RM${diff}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                        q.jawapan = `RM${diff}`;
                        q.penerangan = `Langkah 1: RM${awal} – RM${t1} = RM${awal - t1}. Langkah 2: RM${awal - t1} – RM${t2} = RM${diff}.`;
                        q.visual = 'Paparkan bil utiliti dan wang tunai';
                    } else {
                        q.subtopik = 'Perbandingan Wang (Siapa Lebih Banyak)';
                        q.aras_kognitif = 'Memahami';
                        let valA = Math.floor(Math.random() * 3 + 4) * 100 + 50; // e.g. RM550
                        let valB = Math.floor(Math.random() * 2 + 1) * 100 + 20; // e.g. RM220
                        let diff = valA - valB;
                        q.soalan = `Tabung Raju mengandungi RM${valA}. Tabung Devi pula mengandungi RM${valB}. Berapakah lebihnya wang Raju berbanding wang Devi?`;
                        q.jenis = 'Objektif';
                        let w1 = diff + 30;
                        let w2 = diff - 20;
                        let w3 = diff + 50;
                        q.pilihan = shuffleArray([`RM${diff}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                        q.jawapan = `RM${diff}`;
                        q.penerangan = `Beza wang = RM${valA} – RM${valB} = RM${diff}.`;
                        q.visual = 'Paparkan dua buah tabung syiling berlabel nama';
                    }
                } else {
                    // Refined Susah: Complex word problems involving savings, purchases, and remaining balance comparison in thousands.
                    const subVariant = index % 3;
                    if (subVariant === 0) {
                        q.subtopik = 'Masalah Kompleks Pembelian & Baki Tabung';
                        q.aras_kognitif = 'Mengaplikasi';
                        let simpanan = 1500;
                        let beg = Math.floor(Math.random() * 15 + 25) * 5; // e.g. RM125
                        let kasut = Math.floor(Math.random() * 20 + 35) * 5; // e.g. RM210
                        let totalBelanja = beg + kasut;
                        let baki = simpanan - totalBelanja;
                        q.soalan = `Encik Lee mempunyai wang simpanan sebanyak RM${simpanan}. Dia membeli sebuah beg sekolah berharga RM${beg} dan sepasang kasut sukan berharga RM${kasut} untuk anaknya. Hitung baki wang simpanan Encik Lee.`;
                        q.jenis = 'Objektif';
                        let w1 = baki + 25;
                        let w2 = baki - 50;
                        let w3 = baki + 40;
                        q.pilihan = shuffleArray([`RM${baki}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                        q.jawapan = `RM${baki}`;
                        q.penerangan = `Jumlah belanja = RM${beg} + RM${kasut} = RM${totalBelanja}. Baki = RM${simpanan} – RM${totalBelanja} = RM${baki}.`;
                        q.visual = 'Paparkan ilustrasi beg sekolah dan kasut sukan';
                    } else if (subVariant === 1) {
                        q.subtopik = 'Tolak Wang Dengan Pendermaan & Amal';
                        q.aras_kognitif = 'Mengaplikasi';
                        let derma = Math.floor(Math.random() * 10 + 10) * 10; // e.g. RM120
                        let tabungAsal = Math.floor(Math.random() * 5 + 8) * 100; // e.g. RM900
                        let baki = tabungAsal - derma;
                        q.soalan = `Kelab Matematik Sekolah mengumpul dana sebanyak RM${tabungAsal}. Sebanyak RM${derma} telah disumbangkan kepada rumah anak yatim. Berapakah baki dana yang masih ada dalam simpanan kelab?`;
                        q.jenis = 'Objektif';
                        let w1 = baki + 50;
                        let w2 = baki - 30;
                        let w3 = baki + 100;
                        q.pilihan = shuffleArray([`RM${baki}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                        q.jawapan = `RM${baki}`;
                        q.penerangan = `Baki dana = RM${tabungAsal} – RM${derma} = RM${baki}.`;
                        q.visual = 'Paparkan tabung derma anak yatim';
                    } else {
                        q.subtopik = 'Tolak Wang Berangkai (Tiga Nombor)';
                        q.aras_kognitif = 'Mengaplikasi';
                        let v1 = 2000;
                        let v2 = Math.floor(Math.random() * 3 + 2) * 100 + 50; // e.g. RM350
                        let v3 = Math.floor(Math.random() * 2 + 1) * 100 + 20; // e.g. RM120
                        let akhir = v1 - v2 - v3;
                        q.soalan = `Cari nilai bagi: RM${v1} – RM${v2} – RM${v3} = RM ______`;
                        q.jenis = 'Isi Tempat Kosong';
                        q.jawapan = `${akhir}`;
                        q.penerangan = `Langkah 1: RM${v1} – RM${v2} = RM${v1-v2}. Langkah 2: RM${v1-v2} – RM${v3} = RM${akhir}.`;
                        q.visual = 'Paparkan bentuk pengiraan berturut-turut';
                    }
                }
            } else if (catId === 'darab') {
                q.kategori = 'Darab Wang';
                if (level === 'Senang') {
                    q.subtopik = 'Darab Nilai Wang Asas';
                    q.aras_kognitif = 'Mengingat';
                    let price = Math.floor(Math.random() * 8 + 2) * 5;
                    let qty = Math.floor(Math.random() * 4 + 2);
                    let prod = price * qty;
                    q.soalan = `Sebuah buku nota berharga RM${price}. Berapakah harga untuk ${qty} buah buku nota yang sama?`;
                    q.jenis = 'Objektif';
                    let w1 = prod + 5;
                    let w2 = prod - 5;
                    let w3 = prod + 10;
                    q.pilihan = shuffleArray([`RM${prod}`, `RM${w1}`, `RM${w2}`, `RM${w3}`]);
                    q.jawapan = `RM${prod}`;
                    q.penerangan = `RM${price} × ${qty} = RM${prod}`;
                    q.visual = 'Paparkan buku tulis';
                } else if (level === 'Sederhana') {
                    q.subtopik = 'Darab Wang Sifir Sederhana';
                    q.aras_kognitif = 'Memahami';
                    let price = Math.floor(Math.random() * 15 + 10) * 2;

        function shuffleArray(array) {

            }

            startQuiz(timerSeconds) {
                gameState.selectedTimer = timerSeconds;
                const pool = questionBank[gameState.selectedCategory][gameState.selectedLevel];

                gameState.activeQuestions = shuffled.slice(0, 20);
                gameState.currentQuestionIndex = 0;
                gameState.score = 0;
                gameState.correctCount = 0;
                gameState.wrongCount = 0;
                gameState.unansweredCount = 0;
                gameState.answersRecord = [];
                gameState.isAnswerLocked = false;

                this.navigate('game');
            },

            // 6. GAME SCREEN & ENGINE
            renderGameScreen() {

                const progressPercent = ((gameState.currentQuestionIndex + 1) / 20) * 100;

                return `

                            <div id="feedback-box" class="hidden mt-4 p-4 rounded-2xl text-sm font-medium"></div>
                        </div>

                        <div class="flex justify-between items-center pt-2">
                            <button onclick="app.confirmExit()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-2xl shadow transition text-xs sm:text-sm flex items-center space-x-2">
                                <i class="fa-solid fa-house"></i>
                                <span>Menu Utama</span>
                            </button>
                            <div id="next-btn-container" class="hidden">
                                <button onclick="app.nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-2xl shadow-lg transition flex items-center space-x-2">
                                    <span>Soalan Seterusnya</span>
                                    <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderAnswerInputType(q) {
                if (q.jenis === 'Objektif') {
                    return `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            ${q.pilihan.map(opt => `
                                <button onclick="app.submitAnswer('${opt.replace(/'/g, "\\'")}')" class="answer-btn text-left p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 font-semibold text-slate-700 transition flex items-center justify-between group shadow-sm">
                                    <span>${opt}</span>
                                    <span class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-xs text-slate-400 group-hover:border-indigo-500 group-hover:text-indigo-600">✓</span>
                                </button>
                            `).join('')}
                        </div>
                    `;
                } else {
                    // Isi tempat kosong / Subjektif ringkas
                    return `
                        <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 items-center">
                            <div class="relative flex-1 w-full">
                                <span class="absolute left-4 top-3.5 font-bold text-slate-400">RM</span>
                                <input type="text" id="subjective-input" placeholder="Masukkan angka jawapan cth: 125" class="w-full pl-12 pr-4 py-3 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:outline-none font-bold text-lg text-slate-800">
                            </div>
                            <button onclick="app.submitSubjectiveAnswer()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg transition">
                                Hantar Jawapan
                            </button>
                        </div>
                    `;
                }
            },

            initGameLoop() {
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);
                if (gameState.selectedTimer > 0) {
                    gameState.timeLeft = gameState.selectedTimer;
                    document.getElementById('countdown-val').textContent = gameState.timeLeft + 's';
                    
                    gameState.timerInterval = setInterval(() => {
                        gameState.timeLeft--;
                        const timerEl = document.getElementById('countdown-val');
                        if (timerEl) timerEl.textContent = gameState.timeLeft + 's';

                        if (gameState.timeLeft <= 0) {
                            clearInterval(gameState.timerInterval);
                            if (!gameState.isAnswerLocked) {
                                this.handleTimeout();
                            }
                        }
                    }, 1000);
                }
            },

            handleTimeout() {
                gameState.isAnswerLocked = true;
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);
                gameState.unansweredCount++;
                const q = gameState.activeQuestions[gameState.currentQuestionIndex];
                gameState.answersRecord.push({ question: q.soalan, userAns: '(Masa Tamat)', correctAns: q.jawapan, isCorrect: false, status: 'unanswered' });

                const feedbackBox = document.getElementById('feedback-box');
                feedbackBox.className = "mt-4 p-4 rounded-2xl text-sm font-semibold bg-amber-50 border border-amber-200 text-amber-800";
                feedbackBox.innerHTML = `⏱️ MASA TAMAT! Jawapan yang betul ialah: <strong>${q.jawapan}</strong>.<br><span class="text-xs font-normal text-slate-600">${q.penerangan}</span>`;
                feedbackBox.classList.remove('hidden');

                soundFx.playWrong();
                document.getElementById('next-btn-container').classList.remove('hidden');
            },

            submitAnswer(selectedOpt) {
                if (gameState.isAnswerLocked) return;
                gameState.isAnswerLocked = true;
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);

                const q = gameState.activeQuestions[gameState.currentQuestionIndex];
                const isCorrect = (selectedOpt.trim() === q.jawapan.trim());
                
                const buttons = document.querySelectorAll('.answer-btn');
                buttons.forEach(btn => {
                    btn.disabled = true;
                    if (btn.textContent.includes(q.jawapan)) {
                        btn.className = "text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-800 flex items-center justify-between shadow-sm";
                    } else if (btn.textContent.includes(selectedOpt) && !isCorrect) {
                        btn.className = "text-left p-4 rounded-2xl border-2 border-rose-500 bg-rose-50 font-bold text-rose-800 flex items-center justify-between shadow-sm";
                    }
                });

                const feedbackBox = document.getElementById('feedback-box');
                if (isCorrect) {
                    gameState.score += 5;
                    gameState.correctCount++;
                    gameState.answersRecord.push({ question: q.soalan, userAns: selectedOpt, correctAns: q.jawapan, isCorrect: true, status: 'correct' });
                    soundFx.playCorrect();
                    feedbackBox.className = "mt-4 p-4 rounded-2xl text-sm font-semibold bg-emerald-50 border border-emerald-200 text-emerald-800";
                    feedbackBox.innerHTML = `🎉 <strong>BETUL!</strong> +5 MARKAH<br><span class="text-xs font-normal text-slate-600">${q.penerangan}</span>`;
                } else {
                    gameState.wrongCount++;
                    gameState.answersRecord.push({ question: q.soalan, userAns: selectedOpt, correctAns: q.jawapan, isCorrect: false, status: 'wrong' });
                    soundFx.playWrong();
                    feedbackBox.className = "mt-4 p-4 rounded-2xl text-sm font-semibold bg-rose-50 border border-rose-200 text-rose-800";
                    feedbackBox.innerHTML = `❌ <strong>SALAH.</strong> Jawapan betul: <strong>${q.jawapan}</strong><br><span class="text-xs font-normal text-slate-600">${q.penerangan}</span>`;
                }

                feedbackBox.classList.remove('hidden');
                document.getElementById('next-btn-container').classList.remove('hidden');
            },

            submitSubjectiveAnswer() {
                if (gameState.isAnswerLocked) return;
                const inputEl = document.getElementById('subjective-input');
                const val = inputEl ? inputEl.value.trim() : '';
                if (!val) {
                    this.showModal('Perhatian', 'Sila masukkan jawapan angka anda.', 'warning');
                    return;
                }
                gameState.isAnswerLocked = true;
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);

                const q = gameState.activeQuestions[gameState.currentQuestionIndex];
                // Clean input for comparison
                const cleanedVal = val.replace(/[^0-9.]/g, '');
                const cleanedCorrect = q.jawapan.replace(/[^0-9.]/g, '');
                const isCorrect = (cleanedVal === cleanedCorrect);

                const feedbackBox = document.getElementById('feedback-box');
                if (isCorrect) {
                    gameState.score += 5;
                    gameState.correctCount++;
                    gameState.answersRecord.push({ question: q.soalan, userAns: 'RM' + val, correctAns: q.jawapan, isCorrect: true, status: 'correct' });
                    soundFx.playCorrect();
                    feedbackBox.className = "mt-4 p-4 rounded-2xl text-sm font-semibold bg-emerald-50 border border-emerald-200 text-emerald-800";
                    feedbackBox.innerHTML = `🎉 <strong>BETUL!</strong> +5 MARKAH<br><span class="text-xs font-normal text-slate-600">${q.penerangan}</span>`;
                } else {
                    gameState.wrongCount++;
                    gameState.answersRecord.push({ question: q.soalan, userAns: 'RM' + val, correctAns: q.jawapan, isCorrect: false, status: 'wrong' });
                    soundFx.playWrong();
                    feedbackBox.className = "mt-4 p-4 rounded-2xl text-sm font-semibold bg-rose-50 border border-rose-200 text-rose-800";
                    feedbackBox.innerHTML = `❌ <strong>SALAH.</strong> Jawapan betul: <strong>${q.jawapan}</strong><br><span class="text-xs font-normal text-slate-600">${q.penerangan}</span>`;
                }

                feedbackBox.classList.remove('hidden');
                document.getElementById('next-btn-container').classList.remove('hidden');
            },

            nextQuestion() {
                gameState.currentQuestionIndex++;
                if (gameState.currentQuestionIndex < gameState.activeQuestions.length) {
                    gameState.isAnswerLocked = false;
                    this.render();
                } else {
                    this.finishQuiz();
                }
            },

            finishQuiz() {
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);
                
                // Update user profile progress & history
                if (gameState.currentUser) {
                    gameState.currentUser.totalScore = (gameState.currentUser.totalScore || 0) + gameState.score;
                    gameState.currentUser.gamesPlayed = (gameState.currentUser.gamesPlayed || 0) + 1;
                    
                    if (!gameState.currentUser.history) gameState.currentUser.history = [];
                    gameState.currentUser.history.push({
                        category: gameState.selectedCategory,
                        level: gameState.selectedLevel,
                        score: gameState.score,
                        correct: gameState.correctCount,
                        wrong: gameState.wrongCount,
                        date: new Date().toLocaleDateString('ms-MY')
                    });

                    // Update storage
                    const idx = gameState.users.findIndex(x => x.username === gameState.currentUser.username);
                    if (idx !== -1) {
                        gameState.users[idx] = gameState.currentUser;
                        localStorage.setItem('math_kids_users', JSON.stringify(gameState.users));
                    }
                }

                this.navigate('results');
            },

            // 7. RESULTS SCREEN
            renderResultsScreen() {
                let motivation = "Hebat sekali! Teruskan usaha yang cemerlang!";
                if (gameState.score < 50) motivation = "Jangan putus asa! Cuba lagi sekali untuk lebih mahir.";

                            </div>

                                    <div class="text-xs text-emerald-600 font-bold">Betul</div>

                                    <div class="text-xs text-rose-600 font-bold">Salah</div>

                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="app.navigate('levels')" class="pulse-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-2xl shadow transition text-sm flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-rotate-right"></i>
                                <span>MAIN LAGI</span>
                            </button>
                            <button onclick="app.navigate('home')" class="pulse-btn bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-2xl shadow transition text-sm flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-house"></i>
                                <span>MENU UTAMA</span>
                            </button>
                        </div>
                    </div>
                `;
            },

            // 16. PROGRESS SCREEN
            renderProgressScreen() {
                const user = gameState.currentUser;
                const history = user && user.history ? user.history : [];

                return `
                    <div class="max-w-xl mx-auto w-full flex flex-col h-full py-2">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h2 class="text-xl font-extrabold text-indigo-900">Progress Pemain</h2>
                                <p class="text-xs text-slate-500">Statistik pencapaian untuk ${user ? user.name : 'Tetamu'}</p>
                            </div>
                            <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-house mr-1"></i> Utama
                            </button>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
                            <div class="bg-indigo-600 text-white p-4 rounded-2xl shadow">
                                <div class="text-xs text-indigo-200">Jumlah Markah</div>
                                <div class="text-2xl font-extrabold mt-1">${user ? user.totalScore : 0}</div>
                            </div>
                            <div class="bg-emerald-600 text-white p-4 rounded-2xl shadow">
                                <div class="text-xs text-emerald-200">Permainan Dijalankan</div>
                                <div class="text-2xl font-extrabold mt-1">${user ? user.gamesPlayed : 0}</div>
                            </div>
                            <div class="bg-amber-600 text-white p-4 rounded-2xl shadow col-span-2 sm:col-span-1">
                                <div class="text-xs text-amber-200">Avatar Aktif</div>
                                <div class="text-2xl font-extrabold mt-1">${user ? user.avatar : '👤'}</div>
                            </div>
                        </div>

                        <h3 class="font-bold text-slate-800 text-sm mb-2">Rekod Permainan Terakhir</h3>
                        <div class="flex-1 overflow-y-auto space-y-2 pr-1">
                            ${history.length === 0 ? `
                                <div class="text-center py-8 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-slate-400 text-sm">
                                    Belum ada rekod permainan lagi. Jom mula bermain!
                                </div>
                            ` : history.slice().reverse().map(h => `
                                <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                                    <div>
                                        <div class="font-bold text-sm text-indigo-900 capitalize">${h.category} (${h.level})</div>
                                        <div class="text-xs text-slate-400">Tarikh: ${h.date} • Betul: ${h.correct}/20</div>
                                    </div>
                                    <div class="text-right">
                                        <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold">${h.score} Markah</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            // 17. LEADERBOARD SCREEN
            renderLeaderboardScreen() {
                const sortedUsers = [...gameState.users].sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0));

                return `
                    <div class="max-w-xl mx-auto w-full flex flex-col h-full py-2">
                        <div class="flex items-center justify-between mb-4">
                            <div>
                                <h2 class="text-xl font-extrabold text-indigo-900">🏆 Leaderboard Pemain</h2>
                                <p class="text-xs text-slate-500">Kedudukan markah tertinggi di Edu Kidz Tahun 3</p>
                            </div>
                            <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-house mr-1"></i> Utama
                            </button>
                        </div>

                        <div class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                            ${sortedUsers.map((u, idx) => `
                                <div class="bg-white p-4 rounded-2xl shadow-sm border ${idx === 0 ? 'border-amber-400 bg-amber-50/40' : 'border-slate-100'} flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-8 h-8 rounded-full ${idx === 0 ? 'bg-amber-400 text-white font-extrabold' : idx === 1 ? 'bg-slate-300 text-white font-extrabold' : idx === 2 ? 'bg-amber-700 text-white font-extrabold' : 'bg-slate-100 text-slate-600'} flex items-center justify-center text-xs shadow">
                                            ${idx + 1}
                                        </div>
                                        <span class="text-2xl">${u.avatar || '👦🏻'}</span>
                                        <div>
                                            <div class="font-bold text-sm text-slate-800">${u.name}</div>
                                            <div class="text-xs text-slate-400">@${u.username} • ${u.gamesPlayed || 0} permainan</div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-xs font-extrabold">${u.totalScore || 0} Markah</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            },

            // SETTINGS SCREEN
            renderSettingsScreen() {
                return `
                    <div class="max-w-xl mx-auto w-full my-auto space-y-6 py-2">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xl font-extrabold text-indigo-900">Tetapan & Bantuan</h2>
                            <button onclick="app.navigate('home')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold transition">
                                <i class="fa-solid fa-house mr-1"></i> Utama
                            </button>
                        </div>

                        <div class="bg-white p-6 rounded-3xl shadow-lg border border-slate-100 space-y-4 text-sm text-slate-600 leading-relaxed">
                            <h3 class="font-bold text-indigo-900 text-base"><i class="fa-solid fa-circle-info mr-2 text-indigo-600"></i> Mengenai Math Kids Wang</h3>
                            <p>Game interaktif ini direka khas untuk murid Tahun 3 Kurikulum Standard Sekolah Rendah (KSSR) Malaysia bagi topik <strong>Wang</strong>.</p>
                            <ul class="list-disc pl-5 space-y-1">
                                <li><strong>360 Soalan Bank</strong> merangkumi 6 kategori utama.</li>
                                <li>Sokongan akaun berbilang pemain dan rekod kemajuan peribadi.</li>
                                <li>Visual Ringgit Malaysia rasmi mengikut panduan Bank Negara Malaysia.</li>
                            </ul>
                            <div class="pt-4 border-t flex justify-between items-center">
                                <span class="text-xs text-slate-400">Versi 1.0.0 (Edu Kidz Malaysia)</span>
                                <button onclick="app.resetData()" class="text-rose-600 hover:underline text-xs font-bold">Reset Data Tempatan</button>
                            </div>
                        </div>
                    </div>
                `;
            },

            resetData() {
                localStorage.removeItem('math_kids_users');
                gameState.users = [];
                gameState.currentUser = null;
                this.showModal('Reset Berjaya', 'Semua data akaun telah dikosongkan.', 'success', () => {
                    location.reload();
                });
            },

            // Modal System (No browser alert)
            showModal(title, message, type = 'info', callback = null) {
                const modal = document.getElementById('custom-modal');
                const titleEl = document.getElementById('modal-title');
                const msgEl = document.getElementById('modal-message');
                const iconEl = document.getElementById('modal-icon');
                const actionsEl = document.getElementById('modal-actions');

                titleEl.textContent = title;
                msgEl.textContent = message;

                if (type === 'success') {
                    iconEl.className = 'fa-solid fa-circle-check text-emerald-600';
                } else if (type === 'error') {
                    iconEl.className = 'fa-solid fa-circle-exclamation text-rose-600';
                } else if (type === 'warning') {
                    iconEl.className = 'fa-solid fa-triangle-exclamation text-amber-500';
                } else {
                    iconEl.className = 'fa-solid fa-circle-info text-blue-600';
                }

                actionsEl.innerHTML = `
                    <button id="modal-ok-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2.5 rounded-xl shadow transition text-sm">
                        OK
                    </button>
                `;

                modal.classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('modal-content').classList.remove('scale-95', 'opacity-0');
                    document.getElementById('modal-content').classList.add('scale-100', 'opacity-100');
                }, 10);

                const okBtn = document.getElementById('modal-ok-btn');
                okBtn.onclick = () => {
                    this.closeModal();
                    if (callback) callback();
                };
            },

            closeModal() {
                const modal = document.getElementById('custom-modal');
                document.getElementById('modal-content').classList.remove('scale-100', 'opacity-100');
                document.getElementById('modal-content').classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 200);
            },

            confirmExit() {
                if (gameState.timerInterval) clearInterval(gameState.timerInterval);
                this.showModal('Pengesahan', 'Adakah anda pasti mahu kembali ke Menu Utama? Progress semasa akan ditamatkan.', 'warning', () => {
                    this.navigate('home');
                });
            }
        };

        // Window onload startup
        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>
