    <script>
        // Web Audio API untuk kesan bunyi ceria tanpa fail luar
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playCorrect() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }
            playWrong() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            playClick() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

                return { question: q, imageType: imgT, imageDetails: imgD, options: opts, correctAnswer: ans };

                                <div class="text-sm font-fredoka">1 MINIT</div>
                            </button>
                            <button onclick="app.mulakanPermainanAktif(0)" class="p-4 bg-purple-50 hover:bg-purple-100 border-2 border-purple-300 rounded-2xl text-center font-bold text-purple-800 transition shadow-sm">
                                <div class="text-2xl mb-1">♾️</div>
                                <div class="text-sm font-fredoka">TIADA HAD</div>
                            </button>
                        </div>
                    </div>
                `;
            }

            mulakanPermainanAktif(masaPilihan) {
                sound.playClick();
                this.selectedTimeLimit = masaPilihan;
                this.activeQuestions = bankSoalan.getSoalanByTopikTahap(this.selectedTopic, this.selectedDifficulty);
                this.currentIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.unansweredCount = 0;
                this.userAnswersRecord = [];
                this.currentView = 'permainan';
                this.render();
            }

            // --- PERMAINAN UTAMA ---
            mulakanTimerSoalan() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                if (this.selectedTimeLimit <= 0) return;

                this.timeLeft = this.selectedTimeLimit;
                const timerBar = document.getElementById('timer-bar');
                const timerText = document.getElementById('timer-text');

                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    if (timerText) timerText.innerText = this.timeLeft;
                    if (timerBar) {
                        let pct = (this.timeLeft / this.selectedTimeLimit) * 100;
                        timerBar.style.width = pct + '%';
                    }

                    if (this.timeLeft <= 0) {
                        clearInterval(this.timerInterval);
                        this.semakJawapan(null, true); // Masa tamat
                    }
                }, 1000);
            }

            renderPermainanHTML() {
                if (this.currentIndex >= this.activeQuestions.length) {
                    this.tamatPermainan();
                    return '';
                }

                const q = this.activeQuestions[this.currentIndex];
                let gambarHTML = '';

                if (q.imageType === 'analog') {
                    let jamDeg = (q.imageDetails.jam % 12) * 30 + (q.imageDetails.minit * 0.5);
                    let minDeg = q.imageDetails.minit * 6;
                    gambarHTML = `
                        <div class="my-4 flex justify-center">
                            <div class="w-36 h-36 bg-amber-100 rounded-full border-4 border-amber-400 relative flex items-center justify-center shadow-inner">
                                <div class="absolute text-xs font-bold top-2">12</div>
                                <div class="absolute text-xs font-bold right-3">3</div>
                                <div class="absolute text-xs font-bold bottom-2">6</div>
                                <div class="absolute text-xs font-bold left-3">9</div>
                                <!-- Jarum Jam -->
                                <div class="absolute w-1.5 h-10 bg-slate-800 rounded-full origin-bottom bottom-1/2 left-[calc(50%-3px)] transform rotate-[${jamDeg}deg]"></div>
                                <!-- Jarum Minit -->
                                <div class="absolute w-1 h-14 bg-rose-500 rounded-full origin-bottom bottom-1/2 left-[calc(50%-2px)] transform rotate-[${minDeg}deg]"></div>
                                <div class="w-3 h-3 bg-amber-600 rounded-full z-10"></div>
                            </div>
                        </div>
                    `;
                } else if (q.imageType === 'kalendar') {
                    gambarHTML = `
                        <div class="my-4 flex justify-center">
                            <div class="bg-white border-2 border-amber-300 rounded-2xl p-4 shadow-sm text-center w-48">
                                <div class="bg-rose-500 text-white font-bold text-xs py-1 rounded-t-xl">KALENDAR EDU KIDZ</div>
                                <div class="py-3 font-fredoka font-bold text-xl text-amber-800">${q.imageDetails.text}</div>
                                <div class="text-[10px] text-slate-400">Tahun 1 KPM</div>
                            </div>
                        </div>
                    `;
                } else if (q.imageType === 'aktiviti') {
                    gambarHTML = `
                        <div class="my-4 flex justify-center">
                            <div class="px-4 py-2 bg-sky-100 text-sky-800 font-bold rounded-2xl border border-sky-200 text-sm">
                                🎒 Aktiviti: ${q.imageDetails.aktiviti}
                            </div>
                        </div>
                    `;
                } else if (q.imageType === 'wang_jam') {
                    gambarHTML = `
                        <div class="my-4 flex justify-center space-x-2">
                            <div class="px-3 py-1.5 bg-emerald-100 text-emerald-800 font-bold rounded-xl border border-emerald-200 text-xs">💵 ${q.imageDetails.wang}</div>
                            <div class="px-3 py-1.5 bg-amber-100 text-amber-800 font-bold rounded-xl border border-amber-200 text-xs">⏱️ Masa Tempoh</div>
                        </div>
                    `;
                }

                let timerDisplayHTML = this.selectedTimeLimit > 0 ? `
                    <div class="flex justify-between items-center mb-4 bg-amber-50 px-4 py-2 rounded-xl border border-amber-200">
                        <span class="text-xs font-bold text-amber-800">Masa: <span id="timer-text">${this.timeLeft}</span>s</span>
                        <div class="w-32 bg-slate-200 h-2.5 rounded-full overflow-hidden">
                            <div id="timer-bar" class="bg-amber-500 h-full transition-all duration-1000" style="width: 100%"></div>
                        </div>
                    </div>
                ` : '';

                return `
                    <div>
                        <!-- Header Soalan -->
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-bold bg-amber-100 text-amber-800 px-3 py-1 rounded-full">Soalan ${this.currentIndex + 1} / 20</span>
                            <span class="text-xs font-bold bg-rose-100 text-rose-800 px-3 py-1 rounded-full">⭐ Markah: ${this.score} / 100</span>
                        </div>

                        ${timerDisplayHTML}

                        <!-- Soalan & Gambar -->
                        <div class="mb-6 text-center">
                            <p class="font-fredoka text-lg font-bold text-slate-800 mb-2">${q.question}</p>
                            ${gambarHTML}
                        </div>

                        <!-- Pilihan Jawapan -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4" id="options-grid">
                            ${q.options.map((opt, idx) => `
                                <button onclick="app.semakJawapan('${opt.replace(/'/g, "\\'")}')" class="p-4 bg-white hover:bg-amber-50 border-2 border-amber-200 rounded-2xl font-bold text-slate-700 text-sm shadow-sm transition transform active:scale-95 text-center flex items-center justify-center">
                                    <span class="w-7 h-7 bg-amber-100 text-amber-800 rounded-full inline-flex items-center justify-center mr-3 text-xs">${String.fromCharCode(65 + idx)}</span>
                                    <span>${opt}</span>
                                </button>
                            `).join('')}
                        </div>

                        <div id="feedback-box" class="hidden text-center p-4 rounded-2xl font-bold text-sm mt-4"></div>
                    </div>
                `;
            }

            semakJawapan(pilihanMurid, isTimeout = false) {
                if (this.timerInterval) clearInterval(this.timerInterval);
                const q = this.activeQuestions[this.currentIndex];
                const feedbackBox = document.getElementById('feedback-box');
                const optionsGrid = document.getElementById('options-grid');

                // Nyahdayakan butang pilihan selepas menjawab
                if (optionsGrid) {
                    const buttons = optionsGrid.getElementsByTagName('button');
                    for (let btn of buttons) btn.disabled = true;
                }

                let isCorrect = false;
                if (!isTimeout && pilihanMurid === q.correctAnswer) {
                    isCorrect = true;
                    this.score += 5;
                    this.correctCount++;
                    sound.playCorrect();
                    feedbackBox.className = "text-center p-4 rounded-2xl font-bold text-sm mt-4 bg-emerald-100 text-emerald-800 border-2 border-emerald-300 animate-bounce-slow";
                    feedbackBox.innerHTML = `🎉 Syabas! Jawapan kamu betul! (+5 markah)`;
                } else {
                    this.wrongCount++;
                    if (isTimeout) this.unansweredCount++;
                    sound.playWrong();
                    feedbackBox.className = "text-center p-4 rounded-2xl font-bold text-sm mt-4 bg-rose-100 text-rose-800 border-2 border-rose-300";
                    feedbackBox.innerHTML = isTimeout ? `⏰ Masa sudah tamat! <br>✅ Jawapan yang betul ialah: <b>${q.correctAnswer}</b>` : `❌ Cuba lagi! <br>✅ Jawapan yang betul ialah: <b>${q.correctAnswer}</b>`;
                }

                feedbackBox.classList.remove('hidden');
                this.userAnswersRecord.push({ soal: q.question, dipilih: pilihanMurid, betul: q.correctAnswer, status: isCorrect });

                // Teruskan ke soalan seterusnya selepas 2 saat
                setTimeout(() => {
                    this.currentIndex++;
                    this.render();
                }, 2000);
            }

            tamatPermainan() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                
                // Kemas kini data pengguna
                this.currentUser.totalSoalanDijawab += 20;
                this.currentUser.totalBetul += this.correctCount;
                this.currentUser.totalSalah += this.wrongCount;
                this.currentUser.totalMarkah += this.score;
                if (this.score > this.currentUser.skorTertinggi) {
                    this.currentUser.skorTertinggi = this.score;
                }

                // Tandakan topik selesai jika skor >= 70
                if (this.score >= 70 && !this.currentUser.topikSelesai.includes(this.selectedTopic)) {
                    this.currentUser.topikSelesai.push(this.selectedTopic);
                }

                // Kemas kini dalam senarai utama users & simpan localStorage
                const idx = this.users.findIndex(x => x.username === this.currentUser.username);
                if (idx !== -1) {
                    this.users[idx] = this.currentUser;
                    this.simpanDatabase();
                }

                this.currentView = 'keputusan';
                this.render();
            }

            // --- KEPUTUSAN PERMAINAN ---
            renderKeputusanHTML() {
                let mesejPrestasi = "";
                if (this.score >= 90) mesejPrestasi = '🏆 "Hebat! Kamu memang Juara Masa!"';
                else if (this.score >= 70) mesejPrestasi = '🌟 "Bagus! Teruskan berlatih!"';
                else if (this.score >= 50) mesejPrestasi = '👍 "Bagus! Cuba lagi untuk skor lebih tinggi!"';
                else mesejPrestasi = '💪 "Jangan putus asa! Mari cuba lagi!"';

                let ketepatan = (this.correctCount / 20) * 100;

                return `
                    <div class="text-center max-w-md mx-auto">
                        <div class="text-5xl mb-2 animate-bounce-slow">🎉</div>
                        <h2 class="font-fredoka text-3xl font-bold text-amber-600 mb-1">PERMAINAN TAMAT!</h2>
                        <p class="text-slate-600 text-sm mb-4 font-medium">${mesejPrestasi}</p>

                        <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 text-left space-y-2 text-sm shadow-sm">
                            <div class="flex justify-between"><span>Nama:</span><span class="font-bold">${this.currentUser.nama}</span></div>
                            <div class="flex justify-between"><span>Topik:</span><span class="font-bold">Topik ${this.selectedTopic} (${this.selectedDifficulty})</span></div>
                            <div class="flex justify-between border-t border-amber-200 pt-2 text-base font-bold text-amber-800">
                                <span>Markah:</span><span>${this.score} / 100 ⭐</span>
                            </div>
                            <div class="flex justify-between text-xs text-slate-500"><span>Betul: ${this.correctCount}</span><span>Salah: ${this.wrongCount}</span><span>Ketepatan: ${ketepatan}%</span></div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="app.mulakanPermainanAktif(${this.selectedTimeLimit})" class="p-3 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white font-bold rounded-xl shadow-md text-sm transition">
                                🔄 MAIN LAGI
                            </button>
                            <button onclick="app.navigasiKeMenu()" class="p-3 bg-gradient-to-r from-sky-400 to-sky-500 hover:from-sky-500 hover:to-sky-600 text-white font-bold rounded-xl shadow-md text-sm transition">
                                🏠 MENU UTAMA
                            </button>
                            <button onclick="app.bukaProgress()" class="p-3 bg-gradient-to-r from-purple-400 to-purple-500 hover:from-purple-500 hover:to-purple-600 text-white font-bold rounded-xl shadow-md text-sm transition">
                                📊 PROGRESS
                            </button>
                            <button onclick="app.bukaLeaderboard()" class="p-3 bg-gradient-to-r from-emerald-400 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-white font-bold rounded-xl shadow-md text-sm transition">
                                🏆 LEADERBOARD
                            </button>
                        </div>
                    </div>
                `;
            }

            // --- PROGRESS SAYA ---
            renderProgressHTML() {
                const c = this.currentUser;
                return `
                    <div class="max-w-md mx-auto">
                        <button onclick="app.navigasiKeMenu()" class="mb-4 text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-xl transition inline-flex items-center space-x-1">
                            <span>← Kembali ke Menu</span>
                        </button>
                        <h2 class="font-fredoka text-2xl font-bold text-slate-800 mb-1 text-center">📊 PROGRESS SAYA</h2>
                        <p class="text-slate-500 text-sm mb-6 text-center">Rekod pencapaian pembelajaran ${c.nama}:</p>

                        <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 mb-6 space-y-3 text-sm shadow-sm">
                            <div class="flex justify-between"><span>Jumlah Soalan Dijawab:</span><span class="font-bold">${c.totalSoalanDijawab}</span></div>
                            <div class="flex justify-between"><span>Jawapan Betul:</span><span class="font-bold text-emerald-600">${c.totalBetul}</span></div>
                            <div class="flex justify-between"><span>Jawapan Salah:</span><span class="font-bold text-rose-600">${c.totalSalah}</span></div>
                            <div class="flex justify-between"><span>Jumlah Markah Terkumpul:</span><span class="font-bold text-amber-700">${c.totalMarkah} ⭐</span></div>
                            <div class="flex justify-between border-t border-amber-200 pt-2"><span>Skor Tertinggi:</span><span class="font-bold text-purple-700">${c.skorTertinggi} / 100</span></div>
                        </div>

                        <div class="mb-6">
                            <h3 class="font-fredoka font-bold text-sm text-slate-700 mb-2">🏅 Lencana Pencapaian</h3>
                            <div class="flex flex-wrap gap-2">
                                <span class="px-3 py-1.5 bg-amber-100 text-amber-800 rounded-xl text-xs font-bold border border-amber-300">⏰ Jam Hebat</span>
                                <span class="px-3 py-1.5 bg-sky-100 text-sky-800 rounded-xl text-xs font-bold border border-sky-300">📅 Pakar Kalendar</span>
                                <span class="px-3 py-1.5 bg-purple-100 text-purple-800 rounded-xl text-xs font-bold border border-purple-300">🏆 Master Masa</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            bukaProgress() {
                sound.playClick();
                this.currentView = 'progress';
                this.render();
            }

            // --- LEADERBOARD ---
            renderLeaderboardHTML() {
                // Susun senarai pengguna mengikut skor tertinggi
                let sortedUsers = [...this.users].sort((a, b) => b.skorTertinggi - a.skorTertinggi);

                return `
                    <div class="max-w-md mx-auto">
                        <button onclick="app.navigasiKeMenu()" class="mb-4 text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-xl transition inline-flex items-center space-x-1">
                            <span>← Kembali ke Menu</span>
                        </button>
                        <h2 class="font-fredoka text-2xl font-bold text-slate-800 mb-1 text-center">🏆 LEADERBOARD EDU KIDZ</h2>
                        <p class="text-slate-500 text-sm mb-6 text-center">Senarai pemain terhebat & markah tertinggi:</p>

                        <div class="space-y-3 mb-6">
                            ${sortedUsers.length === 0 ? '<p class="text-center text-xs text-slate-400">Belum ada rekod pemain lagi.</p>' : ''}
                            ${sortedUsers.map((usr, idx) => `
                                <div class="p-3.5 bg-white border-2 border-amber-200 rounded-2xl flex items-center justify-between shadow-sm">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-8 h-8 rounded-full bg-amber-100 font-bold text-amber-800 flex items-center justify-center text-sm">
                                            ${idx === 0 ? '🥇' : (idx === 1 ? '🥈' : (idx === 2 ? '🥉' : idx + 1))}
                                        </div>
                                        <div>
                                            <div class="font-bold text-sm text-slate-800">${usr.nama}</div>
                                            <div class="text-[10px] text-slate-400">@${usr.username}</div>
                                        </div>
                                    </div>
                                    <div class="font-fredoka font-bold text-amber-600 text-base">
                                        ${usr.skorTertinggi} <span class="text-xs font-normal text-slate-500">markah</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            bukaLeaderboard() {
                sound.playClick();
                this.currentView = 'leaderboard';
                this.render();
            }

            // --- TETAPAN ---
            renderTetapanHTML() {
                return `
                    <div class="text-center max-w-md mx-auto">
                        <button onclick="app.navigasiKeMenu()" class="mb-4 text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-xl transition inline-flex items-center space-x-1">
                            <span>← Kembali ke Menu</span>
                        </button>
                        <h2 class="font-fredoka text-2xl font-bold text-slate-800 mb-1">⚙️ TETAPAN APLIKASI</h2>
                        <p class="text-slate-500 text-sm mb-6">Ubah tetapan audio & kesan bunyi:</p>

                        <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-6 text-left space-y-4 shadow-sm">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm text-slate-700">Kesan Bunyi (Audio)</span>
                                <button onclick="app.toggleSound()" id="sound-toggle-btn" class="px-4 py-2 bg-amber-400 hover:bg-amber-500 text-white font-bold rounded-xl text-xs transition">
                                    ${sound.enabled ? '🔊 PASANG (ON)' : '🔇 TUTUP (OFF)'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            bukaTetapan() {
                sound.playClick();
                this.currentView = 'tetapan';
                this.render();
            }

            toggleSound() {
                sound.enabled = !sound.enabled;
                sound.playClick();
                const btn = document.getElementById('sound-toggle-btn');
                if (btn) {
                    btn.innerText = sound.enabled ? '🔊 PASANG (ON)' : '🔇 TUTUP (OFF)';
                }
            }
        }

        // Mulakan aplikasi apabila halaman dimuatkan
        let app;
        window.onload = function() {
            app = new EduKidzApp();
        };
    </script>
</body>
</html>
