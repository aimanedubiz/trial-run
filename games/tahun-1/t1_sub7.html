    <!-- Audio Synthesizer helper using Web Audio API for sound effects without external files -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (localStorage.getItem('edu_sound') === 'off') return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(120, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }
    </script>

    <script>
        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem('edu_users') || '{}');
            } catch (e) {
                return {};
            }
        }

        function saveUsers(users) {
            localStorage.setItem('edu_users', JSON.stringify(users));
        }

        function getCurrentUser() {
            try {
                return JSON.parse(localStorage.getItem('edu_current_user') || 'null');
            } catch (e) {
                return null;
            }
        }

        function setCurrentUser(user) {
            localStorage.setItem('edu_current_user', JSON.stringify(user));
            currentUser = user;
            updateHeaderUserInfo();
        }

        function updateHeaderUserInfo() {
            const info = document.getElementById('header-user-info');
            const nameSpan = document.getElementById('header-username');
            if (currentUser) {
                info.classList.remove('hidden');
                info.classList.add('flex');
                nameSpan.innerText = currentUser.name;
            } else {
                info.classList.add('hidden');
                info.classList.remove('flex');
            }
        }

        // Navigation Router
        function navigateTo(screenId, param = null) {
            playSound('click');
            if (currentGameState.timerInterval) {
                clearInterval(currentGameState.timerInterval);
                currentGameState.timerInterval = null;
            }

            const main = document.getElementById('main-content');
            main.innerHTML = '';

            switch(screenId) {
                case 'home':
                    renderHomeScreen(main);
                    break;
                case 'register':
                    renderRegisterScreen(main);
                    break;
                case 'login':
                    renderLoginScreen(main);
                    break;
                case 'topics':
                    renderTopicsScreen(main);
                    break;
                case 'timer':
                    renderTimerScreen(main, param);
                    break;
                case 'levels':
                    renderLevelsScreen(main);
                    break;
                case 'game':
                    renderGameScreen(main);
                    break;
                case 'result':
                    renderResultScreen(main);
                    break;
                case 'progress':
                    renderProgressScreen(main);
                    break;

                    break;

                    break;

    <script>
        function startSession(levelId) {
            const rawQuestions = questionBank[selectedTopicId][levelId];
            const shuffled = shuffleArray(rawQuestions);
            const questions = shuffled.slice(0, 20);

            currentGameState = {
                topic: selectedTopicId,
                level: levelId,
                timerMode: selectedTimerMode,
                questions: questions,
                currentIndex: 0,
                score: 0,
                correctCount: 0,
                wrongCount: 0,
                startTime: Date.now(),
                elapsedSeconds: 0,
                timerInterval: null,
                selectedAnswer: null,
                answeredCurrent: false
            };

            navigateTo('game');
        }

        function renderGameScreen(container) {
            const state = currentGameState;
            const q = state.questions[state.currentIndex];
            const topicObj = TOPICS.find(t => t.id === state.topic);

            if (!state.timerInterval) {
                state.timerInterval = setInterval(() => {
                    state.elapsedSeconds++;
                    const timerEl = document.getElementById('game-timer-display');
                    if (timerEl) {
                        const mins = Math.floor(state.elapsedSeconds / 60).toString().padStart(2, '0');
                        const secs = (state.elapsedSeconds % 60).toString().padStart(2, '0');
                        timerEl.innerText = `${mins}:${secs}`;
                    }

                    if (state.timerMode === '30' && state.elapsedSeconds >= 30) {
                        handleTimeOut();
                    } else if (state.timerMode === '60' && state.elapsedSeconds >= 60) {
                        handleTimeOut();
                    }
                }, 1000);
            }

            container.innerHTML = `
                <div class="w-full max-w-2xl mx-auto flex flex-col justify-between">
                    <div class="bg-indigo-50 p-3 rounded-2xl flex justify-between items-center text-xs sm:text-sm font-bold text-indigo-900 mb-4 border border-indigo-100 shadow-inner">
                        <div>
                            <span class="text-orange-500">⭐ EDU KIDZ</span> | ${topicObj.name}
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="bg-white px-2.5 py-1 rounded-lg shadow-sm">Soalan ${state.currentIndex + 1} / 20</span>
                            <span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg shadow-sm">Markah: ${state.score}</span>
                            <span id="game-timer-display" class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg shadow-sm">00:00</span>
                        </div>
                    </div>

                    <div class="bg-white border-2 border-indigo-100 rounded-3xl p-6 shadow-md text-center relative mb-4">
                        <div class="absolute top-3 right-3 text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700">
                            Aras: ${q.cognitive}
                        </div>

                        ${q.image ? `<div class="text-6xl sm:text-7xl mb-3 bouncing">${q.image}</div>` : ''}
                        
                        <h3 class="text-base sm:text-lg font-bold text-slate-800 mb-4">
                            ${q.question}
                        </h3>

                        <div id="answer-area" class="mt-4">
                            ${renderAnswerInput(q)}
                        </div>
                    </div>

                    <div id="feedback-area" class="hidden text-center p-3 rounded-2xl mb-2 font-bold text-sm"></div>
                    
                    <div id="next-btn-container" class="text-center hidden">
                        <button onclick="nextQuestion()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-3 px-8 rounded-2xl shadow-lg transition text-base">
                            ➡️ TERUSKAN
                        </button>
                    </div>
                </div>
            `;
        }

        function renderAnswerInput(q) {
            if (q.type === 'objektif') {
                let html = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">';
                q.options.forEach((opt, idx) => {
                    html += `
                        <button onclick="checkAnswer('${escapeHtml(opt)}', '${escapeHtml(q.answer)}')" class="pulse-btn bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-200 text-indigo-900 font-semibold p-3.5 rounded-xl text-sm sm:text-base text-left flex items-center space-x-3">
                            <span class="w-7 h-7 rounded-full bg-indigo-200 flex items-center justify-center text-xs font-bold">${String.fromCharCode(65 + idx)}</span>
                            <span>${opt}</span>
                        </button>
                    `;
                });
                html += '</div>';
                return html;
            } else if (q.type === 'isitempatkosong' || q.type === 'dragdrop') {
                return `
                    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                        <input type="text" id="user-input-answer" class="w-full sm:w-64 px-4 py-3 rounded-xl border-2 border-indigo-300 text-center font-bold text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Taip jawapan anda...">
                        <button onclick="submitTextAnswer('${escapeHtml(q.answer)}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition text-sm">
                            HANTAR ✅
                        </button>
                    </div>
                `;
            } else if (q.type === 'padanan') {
                let html = '<div class="space-y-2 text-left bg-slate-50 p-4 rounded-2xl">';
                q.pairs.forEach((pair, idx) => {
                    html += `
                        <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                            <span class="font-bold text-slate-700">${pair.item}</span>
                            <span class="text-slate-400">➔</span>
                            <select id="pair-select-${idx}" class="border border-indigo-300 rounded-lg p-1.5 text-sm font-semibold text-indigo-900 bg-indigo-50">
                                <option value="">Pilih jawapan...</option>
                                <option value="Sfera">Sfera</option>
                                <option value="Silinder">Silinder</option>
                                <option value="Kubus">Kubus</option>
                                <option value="Kuboid">Kuboid</option>
                                <option value="Segi Empat Sama">Segi Empat Sama</option>
                                <option value="Segi Tiga">Segi Tiga</option>
                                <option value="Bulatan">Bulatan</option>
                            </select>
                        </div>
                    `;
                });
                html += `
                    <button onclick="submitPairsAnswer('${escapeHtml(JSON.stringify(q.pairs))}')" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
                        SEMAK PADANAN ✅
                    </button>
                </div>`;
                return html;
            }
            return '';
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        }

        function checkAnswer(userAns, correctAns) {
            if (currentGameState.answeredCurrent) return;
            currentGameState.answeredCurrent = true;

            const isCorrect = userAns.trim().toLowerCase() === correctAns.trim().toLowerCase();
            processAnswerResult(isCorrect, correctAns);
        }

        function submitTextAnswer(correctAns) {
            if (currentGameState.answeredCurrent) return;
            const input = document.getElementById('user-input-answer');
            if (!input || !input.value.trim()) return;
            currentGameState.answeredCurrent = true;

            const userAns = input.value.trim();
            const isCorrect = userAns.toLowerCase() === correctAns.toLowerCase();
            processAnswerResult(isCorrect, correctAns);
        }

        function submitPairsAnswer(pairsStr) {
            if (currentGameState.answeredCurrent) return;
            currentGameState.answeredCurrent = true;
            const pairs = JSON.parse(pairsStr.replace(/&apos;/g, "'").replace(/&quot;/g, '"'));
            
            let allCorrect = true;
            pairs.forEach((pair, idx) => {
                const sel = document.getElementById(`pair-select-${idx}`);
                if (!sel || sel.value.trim().toLowerCase() !== pair.match.toLowerCase()) {
                    allCorrect = false;
                }
            });

            processAnswerResult(allCorrect, pairs.map(p => `${p.item} = ${p.match}`).join(', '));
        }

        function processAnswerResult(isCorrect, correctAns) {
            const feedbackEl = document.getElementById('feedback-area');
            const nextBtnContainer = document.getElementById('next-btn-container');

            feedbackEl.classList.remove('hidden');

            if (isCorrect) {
                playSound('correct');
                currentGameState.score += 5;
                currentGameState.correctCount++;
                feedbackEl.className = "bg-emerald-100 text-emerald-800 p-4 rounded-2xl mb-2 font-bold text-center border border-emerald-200 shadow-sm";
                feedbackEl.innerHTML = `🎉 TAHNIAH! JAWAPAN BETUL! ⭐ (+5 MARKAH)`;
            } else {
                playSound('wrong');
                currentGameState.wrongCount++;
                feedbackEl.className = "bg-rose-100 text-rose-800 p-4 rounded-2xl mb-2 font-bold text-center border border-rose-200 shadow-sm";
                feedbackEl.innerHTML = `BELUM TEPAT 😊<br><span class="text-xs font-normal text-slate-700 mt-1 block">Jawapan yang betul ialah: <strong>${correctAns}</strong></span>`;
            }

            nextBtnContainer.classList.remove('hidden');
        }

        function handleTimeOut() {
            if (currentGameState.answeredCurrent) return;
            currentGameState.answeredCurrent = true;
            currentGameState.wrongCount++;

            const feedbackEl = document.getElementById('feedback-area');
            const nextBtnContainer = document.getElementById('next-btn-container');

            feedbackEl.classList.remove('hidden');
            feedbackEl.className = "bg-amber-100 text-amber-800 p-4 rounded-2xl mb-2 font-bold text-center border border-amber-200 shadow-sm";
            feedbackEl.innerHTML = `⏱️ MASA TAMAT! Dianggap belum tepat.`;
            nextBtnContainer.classList.remove('hidden');
        }

        function nextQuestion() {
            currentGameState.currentIndex++;
            currentGameState.answeredCurrent = false;

            if (currentGameState.currentIndex >= currentGameState.questions.length) {
                finishGameSession();
            } else {
                renderGameScreen(document.getElementById('main-content'));
            }
        }

        function finishGameSession() {
            if (currentGameState.timerInterval) {
                clearInterval(currentGameState.timerInterval);
                currentGameState.timerInterval = null;
            }

            if (currentUser) {
                currentUser.totalGames = (currentUser.totalGames || 0) + 1;
                currentUser.totalAnswered = (currentUser.totalAnswered || 0) + 20;
                currentUser.totalCorrect = (currentUser.totalCorrect || 0) + currentGameState.correctCount;
                currentUser.totalWrong = (currentUser.totalWrong || 0) + currentGameState.wrongCount;
                currentUser.totalScore = (currentUser.totalScore || 0) + currentGameState.score;
                
                if (currentGameState.score > (currentUser.highScore || 0)) {
                    currentUser.highScore = currentGameState.score;
                }

                if (!currentUser.topicProgress) currentUser.topicProgress = {};
                currentUser.topicProgress[currentGameState.topic] = Math.min(100, (currentUser.topicProgress[currentGameState.topic] || 0) + 20);

                let users = getUsers();
                users[currentUser.username] = currentUser;
                saveUsers(users);
                setCurrentUser(currentUser);
            }

            navigateTo('result');
        }
    </script>

    <script>
        function renderResultScreen(container) {
            const state = currentGameState;
            const pct = Math.round((state.correctCount / 20) * 100);
            const mins = Math.floor(state.elapsedSeconds / 60).toString().padStart(2, '0');
            const secs = (state.elapsedSeconds % 60).toString().padStart(2, '0');

            let motivation = "";
            if (state.score >= 90) motivation = "HEBAT! Anda memang Juara Bentuk! 🏆";
            else if (state.score >= 70) motivation = "SANGAT BAGUS! Teruskan berlatih! ⭐";
            else if (state.score >= 50) motivation = "USAHA YANG BAIK! Cuba lagi untuk skor lebih tinggi! 💪";
            else motivation = "JANGAN PUTUS ASA! Mari cuba sekali lagi! 😊";

            container.innerHTML = `
                <div class="w-full max-w-lg mx-auto text-center space-y-4">
                    <span class="text-6xl">🎉</span>
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-indigo-900">KEPUTUSAN PERMAINAN</h2>
                    <p class="text-xs font-semibold text-indigo-600 bg-indigo-50 py-2 px-4 rounded-xl border border-indigo-100">${motivation}</p>

                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 p-6 rounded-3xl border-2 border-indigo-100 shadow-inner grid grid-cols-2 gap-4 text-left">
                        <div class="bg-white p-3 rounded-2xl shadow-sm">
                            <span class="text-xs text-slate-400 font-bold block">⭐ MARKAH</span>
                            <span class="text-xl sm:text-2xl font-extrabold text-indigo-900">${state.score} / 100</span>
                        </div>
                        <div class="bg-white p-3 rounded-2xl shadow-sm">
                            <span class="text-xs text-slate-400 font-bold block">⏱️ MASA</span>
                            <span class="text-xl sm:text-2xl font-extrabold text-indigo-900">${mins}:${secs}</span>
                        </div>
                        <div class="bg-white p-3 rounded-2xl shadow-sm">
                            <span class="text-xs text-slate-400 font-bold block">✅ BETUL</span>
                            <span class="text-xl sm:text-2xl font-extrabold text-emerald-600">${state.correctCount} / 20</span>
                        </div>
                        <div class="bg-white p-3 rounded-2xl shadow-sm">
                            <span class="text-xs text-slate-400 font-bold block">📊 KETEPATAN</span>
                            <span class="text-xl sm:text-2xl font-extrabold text-blue-600">${pct}%</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-2">
                        <button onclick="navigateTo('levels')" class="pulse-btn bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-3 rounded-xl text-xs shadow-md">🔄 MAIN LAGI</button>
                        <button onclick="navigateTo('topics')" class="pulse-btn bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-3 rounded-xl text-xs shadow-md">📚 PILIH TOPIK</button>
                        <button onclick="navigateTo('leaderboard')" class="pulse-btn bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-3 rounded-xl text-xs shadow-md">🏆 LEADERBOARD</button>
                        <button onclick="navigateTo('progress')" class="pulse-btn bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-3 rounded-xl text-xs shadow-md">📊 PROGRESS</button>
                        <button onclick="navigateTo('home')" class="col-span-2 pulse-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-3 rounded-xl text-xs shadow-md">🏠 MENU UTAMA</button>
                    </div>
                </div>
            `;
        }

        function renderProgressScreen(container) {
            const user = getCurrentUser() || { name: 'Pelajar', totalGames: 0, totalAnswered: 0, totalCorrect: 0, totalWrong: 0, totalScore: 0, highScore: 0, topicProgress: {} };
            
            let html = `
                <div class="w-full max-w-2xl mx-auto">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-2xl font-extrabold text-indigo-900">📊 PROGRESS SAYA</h2>
                            <p class="text-xs text-slate-500">Nama: <span class="font-bold text-indigo-600">${user.name}</span></p>
                        </div>
                        <button onclick="navigateTo('home')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold">🏠 Menu Utama</button>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
                        <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-100 text-center">
                            <span class="text-xs text-slate-500 font-bold block">Jumlah Permainan</span>
                            <span class="text-lg font-extrabold text-indigo-900">${user.totalGames || 0}</span>
                        </div>
                        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100 text-center">
                            <span class="text-xs text-slate-500 font-bold block">Skor Tertinggi</span>
                            <span class="text-lg font-extrabold text-emerald-700">${user.highScore || 0}</span>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-2xl border border-blue-100 text-center">
                            <span class="text-xs text-slate-500 font-bold block">Jawapan Betul</span>
                            <span class="text-lg font-extrabold text-blue-700">${user.totalCorrect || 0}</span>
                        </div>
                        <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100 text-center">
                            <span class="text-xs text-slate-500 font-bold block">Jawapan Salah</span>
                            <span class="text-lg font-extrabold text-rose-700">${user.totalWrong || 0}</span>
                        </div>
                    </div>

                    <div class="bg-white border-2 border-indigo-100 p-4 rounded-3xl space-y-3 shadow-sm">
                        <h3 class="font-bold text-indigo-900 text-sm mb-2">Pencapaian Topik Bentuk</h3>
            `;

            TOPICS.forEach(t => {
                const prog = (user.topicProgress && user.topicProgress[t.id]) || 0;
                html += `
                    <div>
                        <div class="flex justify-between text-xs font-bold text-slate-700 mb-1">
                            <span>${t.icon} ${t.name}</span>
                            <span>${prog}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full rounded-full transition-all duration-500" style="width: ${prog}%"></div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function renderLeaderboardScreen(container) {
            const users = getUsers();
            const sortedUsers = Object.values(users).sort((a, b) => (b.highScore || 0) - (a.highScore || 0));

            let html = `
                <div class="w-full max-w-2xl mx-auto">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h2 class="text-2xl font-extrabold text-indigo-900">🏆 LEADERBOARD EDU KIDZ</h2>
                            <p class="text-xs text-slate-500">Kedudukan markah tertinggi pemain</p>
                        </div>
                        <button onclick="navigateTo('home')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold">🏠 Menu Utama</button>
                    </div>

                    <div class="bg-white border-2 border-indigo-100 rounded-3xl overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-indigo-50 text-indigo-900 text-xs font-extrabold uppercase">
                                    <th class="p-3 text-center w-16">Kedudukan</th>
                                    <th class="p-3">Nama Pemain</th>
                                    <th class="p-3 text-center">Jumlah Permainan</th>
                                    <th class="p-3 text-right">Skor Tertinggi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
            `;

            if (sortedUsers.length === 0) {
                html += `<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada rekod pemain. Jom mula bermain!</td></tr>`;
            } else {
                sortedUsers.forEach((u, idx) => {
                    let medal = `#${idx + 1}`;
                    if (idx === 0) medal = '🥇';
                    else if (idx === 1) medal = '🥈';
                    else if (idx === 2) medal = '🥉';

                    html += `
                        <tr class="hover:bg-indigo-50/50 transition">
                            <td class="p-3 text-center font-bold text-slate-700">${medal}</td>
                            <td class="p-3 font-bold text-indigo-900">${u.name}</td>
                            <td class="p-3 text-center text-slate-600">${u.totalGames || 0}</td>
                            <td class="p-3 text-right font-extrabold text-amber-600">⭐ ${u.highScore || 0}</td>
                        </tr>
                    `;
                });
            }

            html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function renderSettingsScreen(container) {
            const currentSound = localStorage.getItem('edu_sound') || 'on';
            container.innerHTML = `
                <div class="w-full max-w-md mx-auto text-center space-y-4">
                    <span class="text-5xl">⚙️</span>
                    <h2 class="text-2xl font-extrabold text-indigo-900">TETAPAN PERMAINAN</h2>
                    <p class="text-xs text-slate-500">Sesuaikan pilihan bunyi dan akaun anda</p>

                    <div class="bg-indigo-50 p-6 rounded-3xl border border-indigo-100 space-y-4 text-left">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-700 text-sm">🔊 Kesan Bunyi (Audio)</span>
                            <button onclick="toggleSoundSetting()" id="sound-toggle-btn" class="px-4 py-2 rounded-xl text-xs font-bold ${currentSound === 'on' ? 'bg-emerald-500 text-white' : 'bg-slate-300 text-slate-700'}">
                                ${currentSound === 'on' ? 'PASANG (ON)' : 'TUTUP (OFF)'}
                            </button>
                        </div>
                    </div>

                    <button onclick="navigateTo('home')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
                        💾 SIMPAN & KEMBALI
                    </button>
                </div>
            `;
        }

        function toggleSoundSetting() {
            const currentSound = localStorage.getItem('edu_sound') || 'on';
            const newSound = currentSound === 'on' ? 'off' : 'on';
            localStorage.setItem('edu_sound', newSound);
            renderSettingsScreen(document.getElementById('main-content'));
        }
    </script>

</body>
</html>
