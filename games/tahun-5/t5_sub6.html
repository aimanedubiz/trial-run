    <!-- Audio Synth Manager (Web Audio API) -->
    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playCorrect() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3); // C6
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }

            playWrong() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now); // A3
                osc.frequency.exponentialRampToValueAtTime(130.81, now + 0.3); // C3
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            }

            playClick() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.05);
            }
        }

        const sound = new SoundEngine();
    </script>

    <!-- SVG & Visual Graphics Renderer Engine -->
    <script>
        const GraphicsRenderer = {
            // Render Regular Polygons
            renderPolygon(sides, size = 120) {
                const cx = 100, cy = 100, r = size / 2;
                let points = [];
                for (let i = 0; i < sides; i++) {
                    const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                    const x = cx + r * Math.cos(angle);
                    const y = cy + r * Math.sin(angle);
                    points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
                }
                return `
                <svg viewBox="0 0 200 200" class="w-48 h-48 mx-auto drop-shadow-md">
                    <polygon points="${points.join(' ')}" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>
                    ${points.map((p, idx) => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="4" fill="#0369a1"/>`).join('')}
                </svg>`;
            },

            // Render Angle Protractor / Interior Angle Diagram
            renderAngle(angleVal, showProtractor = false) {
                const rad = (180 - angleVal) * Math.PI / 180;
                const x2 = 150 + 100 * Math.cos(-rad);
                const y2 = 150 + 100 * Math.sin(-rad);
                return `
                <svg viewBox="0 0 300 200" class="w-60 h-40 mx-auto drop-shadow-md">
                    ${showProtractor ? `
                        <path d="M 50 150 A 100 100 0 0 1 250 150 Z" fill="#fef08a" opacity="0.6" stroke="#ca8a04" stroke-dasharray="3 3"/>
                        <line x1="150" y1="150" x2="150" y2="50" stroke="#ca8a04" stroke-width="1"/>
                    ` : ''}
                    <line x1="50" y1="150" x2="250" y2="150" stroke="#1e293b" stroke-width="4"/>
                    <line x1="150" y1="150" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1e293b" stroke-width="4"/>
                    <path d="M 180 150 A 30 30 0 0 0 ${150 + 30 * Math.cos(-rad)} ${150 + 30 * Math.sin(-rad)}" fill="none" stroke="#e11d48" stroke-width="3"/>
                    <text x="160" y="135" fill="#e11d48" font-weight="bold" font-size="16">${angleVal}°</text>
                </svg>`;
            },

            // Render 2D Composite Shape for Perimeter & Area
            renderComposite2D(w1, h1, w2, h2, labelW1, labelH1, labelW2, labelH2) {
                return `
                <svg viewBox="0 0 320 220" class="w-64 h-48 mx-auto drop-shadow-md">
                    <!-- Rect A -->
                    <rect x="40" y="30" width="120" height="150" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
                    <text x="95" y="110" fill="#1e40af" font-weight="bold" font-size="18">A</text>
                    
                    <!-- Rect B (Attached) -->
                    <rect x="160" y="80" width="100" height="100" fill="#bbf7d0" stroke="#15803d" stroke-width="3"/>
                    <text x="205" y="135" fill="#166534" font-weight="bold" font-size="18">B</text>

                    <!-- Dimension Labels -->
                    <!-- Top Rect A -->
                    <text x="95" y="22" fill="#1e293b" font-weight="bold" font-size="14" text-anchor="middle">${labelW1}</text>
                    <!-- Left Rect A -->
                    <text x="25" y="110" fill="#1e293b" font-weight="bold" font-size="14" text-anchor="middle">${labelH1}</text>
                    <!-- Right Rect B -->
                    <text x="275" y="135" fill="#1e293b" font-weight="bold" font-size="14" text-anchor="middle">${labelH2}</text>
                    <!-- Bottom Total/Right Rect B -->
                    <text x="210" y="198" fill="#1e293b" font-weight="bold" font-size="14" text-anchor="middle">${labelW2}</text>
                </svg>`;
            },

            // Render 3D Cuboid Blocks for Volume
            render3DCuboid(length, width, height, isComposite = false) {
                return `
                <svg viewBox="0 0 300 220" class="w-64 h-48 mx-auto drop-shadow-lg">
                    <g transform="translate(40,20)">
                        <!-- Front Face -->
                        <rect x="20" y="60" width="140" height="90" fill="#cbd5e1" stroke="#334155" stroke-width="3"/>
                        <!-- Top Face -->
                        <polygon points="20,60 70,20 210,20 160,60" fill="#94a3b8" stroke="#334155" stroke-width="3"/>
                        <!-- Right Face -->
                        <polygon points="160,60 210,20 210,110 160,150" fill="#64748b" stroke="#334155" stroke-width="3"/>

                        ${isComposite ? `
                            <!-- Secondary Cuboid attached -->
                            <rect x="160" y="90" width="80" height="60" fill="#a7f3d0" stroke="#047857" stroke-width="3"/>
                            <polygon points="160,90 190,60 270,60 240,90" fill="#6ee7b7" stroke="#047857" stroke-width="3"/>
                            <polygon points="240,90 270,60 270,120 240,150" fill="#34d399" stroke="#047857" stroke-width="3"/>
                        ` : ''}

                        <!-- Labels -->
                        <text x="90" y="170" fill="#0f172a" font-weight="bold" font-size="14" text-anchor="middle">Panjang = ${length}</text>
                        <text x="220" y="140" fill="#0f172a" font-weight="bold" font-size="14">Lebar = ${width}</text>
                        <text x="0" y="110" fill="#0f172a" font-weight="bold" font-size="14">Tinggi = ${height}</text>
                    </g>
                </svg>`;
            }
        };
    </script>

    <!-- Questions Bank & Data Repository (360 Items Procedural Engine) -->
    <script>
        class QuestionDatabase {
            constructor() {
                this.subtopics = [
                    { id: 'poligon', name: 'Poligon Sekata', code: 'POL' },
                    { id: 'sudut', name: 'Ukur Sudut Pedalaman', code: 'SUD' },
                    { id: 'perimeter', name: 'Perimeter Bentuk Gabungan', code: 'PER' },
                    { id: 'luas', name: 'Luas Bentuk Gabungan', code: 'LUA' },
                    { id: 'isipadu', name: 'Isipadu Bentuk Gabungan', code: 'ISI' },
                    { id: 'masalah', name: 'Penyelesaian Masalah Ruang', code: 'MAS' }
                ];
                this.levels = ['Senang', 'Sederhana', 'Susah'];
                this.data = this.generateAllQuestions();
            }

            generateAllQuestions() {
                const db = {};
                this.subtopics.forEach(sub => {
                    db[sub.id] = {
                        Senang: [],
                        Sederhana: [],
                        Susah: []
                    };
                    
                    this.levels.forEach(lvl => {
                        for (let i = 1; i <= 20; i++) {
                            const q = this.buildQuestion(sub, lvl, i);
                            db[sub.id][lvl].push(q);
                        }
                    });
                });
                return db;
            }

            buildQuestion(sub, level, index) {
                const numStr = String(index).padStart(3, '0');
                const lvlCode = level.substring(0,3).toUpperCase();
                const id = `RU_T5_${sub.code}_${lvlCode}_${numStr}`;

                let qObj = {
                    id: id,
                    tahun: 5,
                    mata_pelajaran: "Matematik",
                    bidang: "Ruang",
                    subtopik: sub.name,
                    tahap: level,
                    aras_kognitif: level === 'Senang' ? 'Mengingat' : (level === 'Sederhana' ? 'Memahami' : 'Mengaplikasi'),
                    jenis: index % 4 === 1 ? 'Objektif' : (index % 4 === 2 ? 'Padanan' : (index % 4 === 3 ? 'DragDrop' : 'IsiKosong')),
                    markah: 5
                };

                // Subtopic A: Poligon Sekata
                if (sub.id === 'poligon') {
                    const polygonTypes = [
                        { name: 'Segi tiga sama sisi', sides: 3, angle: 60 },
                        { name: 'Segi empat sama', sides: 4, angle: 90 },
                        { name: 'Pentagon sekata', sides: 5, angle: 108 },
                        { name: 'Heksagon sekata', sides: 6, angle: 120 },
                        { name: 'Heptagon sekata', sides: 7, angle: 128.5 },
                        { name: 'Oktagon sekata', sides: 8, angle: 135 }
                    ];
                    const poly = polygonTypes[(index - 1) % polygonTypes.length];
                    
                    if (level === 'Senang') {
                        qObj.soalan = `Berapakah bilangan sisi sekata bagi sebuah ${poly.name}?`;
                        qObj.pilihan = [`${poly.sides} sisi`, `${poly.sides + 1} sisi`, `${poly.sides - 1 || 2} sisi`, `${poly.sides + 2} sisi`].sort(() => Math.random() - 0.5);
                        qObj.jawapan = `${poly.sides} sisi`;
                        qObj.diagramType = 'polygon';
                        qObj.diagramSides = poly.sides;
                        qObj.penerangan = `${poly.name} mempunyai ${poly.sides} sisi yang sama panjang dan ${poly.sides} bucu.`;
                    } else if (level === 'Sederhana') {
                        qObj.soalan = `Apakah nama poligon sekata yang mempunyai ${poly.sides} bucu dan ${poly.sides} sisi sama panjang?`;
                        qObj.pilihan = ['Heksagon sekata', 'Pentagon sekata', 'Oktagon sekata', 'Segi tiga sama sisi'].filter(x => x !== poly.name);
                        qObj.pilihan.push(poly.name);
                        qObj.pilihan.sort(() => Math.random() - 0.5);
                        qObj.jawapan = poly.name;
                        qObj.diagramType = 'polygon';
                        qObj.diagramSides = poly.sides;
                        qObj.penerangan = `Poligon dengan ${poly.sides} bucu dan sisi yang sama ialah ${poly.name}.`;
                    } else {
                        qObj.soalan = `Sebuah ${poly.name} mempunyai perimeter ${(poly.sides * (index + 2))} cm. Berapakah panjang satu sisinya?`;
                        const sideLen = index + 2;
                        qObj.pilihan = [`${sideLen} cm`, `${sideLen + 2} cm`, `${sideLen - 1} cm`, `${sideLen * 2} cm`].sort(() => Math.random() - 0.5);
                        qObj.jawapan = `${sideLen} cm`;
                        qObj.diagramType = 'polygon';
                        qObj.diagramSides = poly.sides;
                        qObj.penerangan = `Panjang satu sisi = Perimeter ÷ Bilangan Sisi = ${(poly.sides * (index + 2))} ÷ ${poly.sides} = ${sideLen} cm.`;
                    }
                }
                // Subtopic B: Ukur Sudut Pedalaman
                else if (sub.id === 'sudut') {
                    const angles = [60, 90, 108, 120, 135];
                    const angleVal = angles[(index - 1) % angles.length];

                    if (level === 'Senang') {
                        qObj.soalan = `Apakah nilai sudut pedalaman yang ditunjukkan pada rajah di bawah?`;
                        qObj.pilihan = [`${angleVal}°`, `${angleVal + 10}°`, `${angleVal - 15}°`, `${angleVal + 20}°`].sort(() => Math.random() - 0.5);
                        qObj.jawapan = `${angleVal}°`;
                        qObj.diagramType = 'angle';
                        qObj.diagramAngle = angleVal;
                        qObj.penerangan = `Nilai sudut pedalaman yang diukur menggunakan jangka sudut ialah ${angleVal}°.`;
                    } else if (level === 'Sederhana') {
                        const sumOfTriangle = 180;
                        const known1 = 50 + (index % 30);
                        const known2 = 60;
                        const missing = sumOfTriangle - (known1 + known2);
                        qObj.soalan = `Jumlah sudut dalam sebuah segi tiga ialah 180°. Jika dua sudut ialah ${known1}° dan ${known2}°, berapakah nilai sudut yang ketiga?`;
                        qObj.pilihan = [`${missing}°`, `${missing + 10}°`, `${missing - 5}°`, `${missing + 15}°`].sort(() => Math.random() - 0.5);
                        qObj.jawapan = `${missing}°`;
                        qObj.diagramType = 'angle';
                        qObj.diagramAngle = missing;
                        qObj.penerangan = `Sudut ketiga = 180° - (${known1}° + ${known2}°) = 180° - ${known1 + known2}° = ${missing}°.`;
                    } else {
                        qObj.soalan = `Sebuah segi empat tepat dibahagi dua secara pepenjuru membentuk dua segi tiga bersudut tegak (90°). Jika salah satu sudut tajam ialah ${30 + (index % 20)}°, berapakah sudut tajam yang satu lagi?`;
                        const missing = 90 - (30 + (index % 20));
                        qObj.pilihan = [`${missing}°`, `${missing + 10}°`, `${missing - 10}°`, `${missing + 15}°`].sort(() => Math.random() - 0.5);
                        qObj.jawapan = `${missing}°`;
                        qObj.diagramType = 'angle';
                        qObj.diagramAngle = missing;
                        qObj.penerangan = `Dalam segi tiga tegak, jumlah dua sudut tajam = 90°. Sudut satu lagi = 90° - ${30 + (index % 20)}° = ${missing}°.`;
                    }
                }
                // Subtopic C: Perimeter Bentuk Gabungan
                else if (sub.id === 'perimeter') {
                    const sideA = 4 + index;
                    const sideB = 6 + index;
                    const sideC = 5 + index;
                    const totalPerim = (sideA * 2) + (sideB * 2) + sideC;

                    qObj.soalan = `Cari perimeter luar bagi bentuk gabungan segi empat tepat dan segi tiga sama kaki bersisi ${sideA} cm, ${sideB} cm, dan ${sideC} cm seperti rajah.`;
                    qObj.pilihan = [`${totalPerim} cm`, `${totalPerim + 4} cm`, `${totalPerim - 3} cm`, `${totalPerim + 6} cm`].sort(() => Math.random() - 0.5);
                    qObj.jawapan = `${totalPerim} cm`;
                    qObj.diagramType = 'composite2d';
                    qObj.diagramParams = [sideA, sideB, sideC, sideA, `${sideA} cm`, `${sideB} cm`, `${sideC} cm`, `${sideA} cm`];
                    qObj.penerangan = `Perimeter hanya mengira sempadan bahagian LUAR sahaja. Jumlah = ${totalPerim} cm.`;
                }
                // Subtopic D: Luas Bentuk Gabungan
                else if (sub.id === 'luas') {
                    const w1 = 3 + index, h1 = 5 + index;
                    const w2 = 4 + index, h2 = 4 + index;
                    const areaA = w1 * h1;
                    const areaB = w2 * h2;
                    const totalArea = areaA + areaB;

                    qObj.soalan = `Bentuk gabungan ini terdiri daripada Segi Empat Tepat A (${w1} cm × ${h1} cm) dan Segi Empat Sama B (${w2} cm × ${h2} cm). Berapakah jumlah luas keseluruhan?`;
                    qObj.pilihan = [`${totalArea} cm²`, `${totalArea + 10} cm²`, `${totalArea - 5} cm²`, `${totalArea + 8} cm²`].sort(() => Math.random() - 0.5);
                    qObj.jawapan = `${totalArea} cm²`;
                    qObj.diagramType = 'composite2d';
                    qObj.diagramParams = [w1, h1, w2, h2, `${w1} cm`, `${h1} cm`, `${w2} cm`, `${h2} cm`];
                    qObj.penerangan = `Luas A = ${w1} × ${h1} = ${areaA} cm². Luas B = ${w2} × ${h2} = ${areaB} cm². Jumlah Luas = ${areaA} + ${areaB} = ${totalArea} cm².`;
                }
                // Subtopic E: Isipadu Bentuk Gabungan
                else if (sub.id === 'isipadu') {
                    const l = 2 + (index % 5);
                    const w = 3 + (index % 4);
                    const h = 4 + (index % 4);
                    const vol1 = l * w * h;
                    const vol2 = 10 + (index * 2);
                    const totalVol = vol1 + vol2;

                    qObj.soalan = `Bongkah A mempunyai isipadu ${vol1} cm³ dan Bongkah B mempunyai isipadu ${vol2} cm³. Berapakah jumlah isipadu gabungan kedua-dua bongkah tersebut?`;
                    qObj.pilihan = [`${totalVol} cm³`, `${totalVol + 12} cm³`, `${totalVol - 8} cm³`, `${totalVol + 15} cm³`].sort(() => Math.random() - 0.5);
                    qObj.jawapan = `${totalVol} cm³`;
                    qObj.diagramType = 'cuboid3d';
                    qObj.diagramParams = [l, w, h, true];
                    qObj.penerangan = `Jumlah Isipadu = Isipadu A + Isipadu B = ${vol1} + ${vol2} = ${totalVol} cm³.`;
                }
                // Subtopic F: Penyelesaian Masalah Ruang
                else {
                    const costPerMeter = 12;
                    const length = 5 + index;
                    const width = 3 + index;
                    const perimeter = 2 * (length + width);
                    const totalCost = perimeter * costPerMeter;

                    qObj.soalan = `En. Ahmad ingin memasang pagar di sekeliling taman bunga berbentuk segi empat tepat bersaiz ${length} m × ${width} m. Jika kos pagar ialah RM${costPerMeter} semeter, berapakah jumlah kos yang perlu dibayar?`;
                    qObj.pilihan = [`RM ${totalCost}`, `RM ${totalCost + 24}`, `RM ${totalCost - 12}`, `RM ${totalCost + 36}`].sort(() => Math.random() - 0.5);
                    qObj.jawapan = `RM ${totalCost}`;
                    qObj.diagramType = 'composite2d';
                    qObj.diagramParams = [length, width, length, width, `${length} m`, `${width} m`, `${length} m`, `${width} m`];
                    qObj.penerangan = `Perimeter = 2 × (${length} + ${width}) = ${perimeter} m. Jumlah Kos = ${perimeter} m × RM${costPerMeter} = RM ${totalCost}.`;
                }

                // Pairs for Matching / DragDrop / Fill
                qObj.pairs = [
                    { q: qObj.soalan, a: qObj.jawapan },
                    { q: "Formula Perimeter", a: "Jumlah Sisi Luar" },
                    { q: "Formula Luas Segi Empat", a: "Panjang × Lebar" },
                    { q: "Unit Isipadu Standard", a: "cm³ atau m³" }
                ];

                return qObj;
            }

            getQuestions(subtopicId, level) {
                return this.data[subtopicId][level] || [];
            }
        }

        const questionBank = new QuestionDatabase();
    </script>

    <!-- App State and Logic Management Engine -->
    <script>
        class MathApp {
            constructor() {
                this.currentUser = null;
                this.currentView = 'login';
                this.selectedSubtopic = 'poligon';
                this.selectedLevel = 'Senang';
                this.selectedGameMode = 'Objektif';
                this.selectedTimerMode = 60; // 30, 60, or 0 (No limit)
                
                // Game session state
                this.sessionQuestions = [];
                this.currentIndex = 0;
                this.score = 0;
                this.answersHistory = [];
                this.timerInterval = null;
                this.timeLeft = 60;

                this.initLocalData();
            }

            initLocalData() {
                if (!localStorage.getItem('math_kids_users')) {
                    localStorage.setItem('math_kids_users', JSON.stringify([]));
                }
                if (!localStorage.getItem('math_kids_scores')) {
                    localStorage.setItem('math_kids_scores', JSON.stringify([]));
                }
            }

            getUsers() {
                return JSON.parse(localStorage.getItem('math_kids_users') || '[]');
            }

            saveUser(user) {
                const users = this.getUsers();
                users.push(user);
                localStorage.setItem('math_kids_users', JSON.stringify(users));
            }

            getScores() {
                return JSON.parse(localStorage.getItem('math_kids_scores') || '[]');
            }

            saveScoreRecord(record) {
                const scores = this.getScores();
                scores.push(record);
                localStorage.setItem('math_kids_scores', JSON.stringify(scores));
            }

            register(username, displayname, password) {
                const users = this.getUsers();
                if (users.some(u => u.username === username)) {
                    return { success: false, msg: "Nama pengguna sudah wujud!" };
                }
                const newUser = { username, displayname, password, createdAt: new Date().toISOString() };
                this.saveUser(newUser);
                this.currentUser = newUser;
                return { success: true };
            }

            login(username, password) {
                const users = this.getUsers();
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    this.currentUser = user;
                    return { success: true };
                }
                return { success: false, msg: "Nama pengguna atau kata laluan tidak sah!" };
            }

            logout() {
                this.currentUser = null;
                this.navTo('login');
            }

            navTo(view) {
                this.currentView = view;
                this.renderHeader();
                this.render();
                sound.playClick();
            }

            renderHeader() {
                const container = document.getElementById('header-user-info');
                if (this.currentUser) {
                    container.innerHTML = `
                        <div class="flex items-center gap-2 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full">
                            <i data-lucide="user" class="w-4 h-4 text-blue-600"></i>
                            <span class="font-bold text-xs md:text-sm text-blue-800">${this.currentUser.displayname}</span>
                        </div>
                        <button onclick="app.logout()" class="p-1.5 hover:bg-slate-100 rounded-full text-slate-500 hover:text-red-500 transition" title="Log Keluar">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </button>
                    `;
                } else {
                    container.innerHTML = '';
                }
                lucide.createIcons();
            }

            startSession() {
                const questions = questionBank.getQuestions(this.selectedSubtopic, this.selectedLevel);
                // Shuffle copy
                this.sessionQuestions = [...questions].sort(() => Math.random() - 0.5).slice(0, 20);
                this.currentIndex = 0;
                this.score = 0;
                this.answersHistory = [];
                this.navTo('game');
                this.startQuestionTimer();
            }

            startQuestionTimer() {
                clearInterval(this.timerInterval);
                if (this.selectedTimerMode === 0) return; // No limit
                
                this.timeLeft = this.selectedTimerMode;
                const timerElem = document.getElementById('game-timer-display');
                if (timerElem) timerElem.innerText = `${this.timeLeft}s`;

                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    const timerElem = document.getElementById('game-timer-display');
                    if (timerElem) timerElem.innerText = `${this.timeLeft}s`;

                    if (this.timeLeft <= 0) {
                        clearInterval(this.timerInterval);
                        this.handleAnswerSubmit(null, true); // Auto submit timeout
                    }
                }, 1000);
            }

            handleAnswerSubmit(userAnswer, isTimeout = false) {
                clearInterval(this.timerInterval);
                const currentQ = this.sessionQuestions[this.currentIndex];
                const isCorrect = !isTimeout && userAnswer === currentQ.jawapan;

                if (isCorrect) {
                    this.score += 5;
                    sound.playCorrect();
                    confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
                } else {
                    sound.playWrong();
                }

                this.answersHistory.push({
                    question: currentQ,
                    userAnswer: userAnswer || "Masa Tamat",
                    isCorrect: isCorrect
                });

                // Show Feedback Modal
                this.showFeedbackModal(isCorrect, currentQ, userAnswer);
            }

            showFeedbackModal(isCorrect, q, userAnswer) {
                const modal = document.createElement('div');
                modal.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4";
                modal.innerHTML = `
                    <div class="bg-white rounded-3xl p-6 max-w-lg w-full text-center shadow-2xl border-4 ${isCorrect ? 'border-green-400' : 'border-red-400'} animate-bounce-in">
                        <div class="w-16 h-16 ${isCorrect ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'} rounded-full flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="${isCorrect ? 'check-circle-2' : 'x-circle'}" class="w-10 h-10"></i>
                        </div>
                        <h2 class="font-game text-2xl font-bold ${isCorrect ? 'text-green-600' : 'text-red-600'} mb-1">
                            ${isCorrect ? 'Tahniah! Jawapan Anda Betul!' : 'Belum tepat. Mari kita belajar!'}
                        </h2>
                        <p class="text-sm text-slate-500 mb-4">+${isCorrect ? '5' : '0'} Markah Ditambah</p>

                        <div class="bg-slate-50 p-4 rounded-2xl text-left border border-slate-200 mb-4 text-xs md:text-sm">
                            <p class="font-bold text-slate-700 mb-1">Jawapan Betul: <span class="text-green-600 font-extrabold">${q.jawapan}</span></p>
                            <p class="text-slate-600 mt-2 font-medium"><strong class="text-slate-800">Penerangan:</strong> ${q.penerangan}</p>
                        </div>

                        <button onclick="app.nextQuestion(); this.closest('.fixed').remove();" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-game font-bold rounded-xl shadow-lg hover:brightness-110 btn-bounce">
                            ${this.currentIndex < this.sessionQuestions.length - 1 ? 'Soalan Seterusnya' : 'Lihat Keputusan Akhir'}
                        </button>
                    </div>
                `;
                document.body.appendChild(modal);
                lucide.createIcons();
            }

            nextQuestion() {
                if (this.currentIndex < this.sessionQuestions.length - 1) {
                    this.currentIndex++;
                    this.render();
                    this.startQuestionTimer();
                } else {
                    this.finishSession();
                }
            }

            finishSession() {
                clearInterval(this.timerInterval);
                const scoreRecord = {

                    username: this.currentUser.username,
                    displayname: this.currentUser.displayname,

                    totalQuestions: this.sessionQuestions.length,
                    correctAnswers: this.answersHistory.filter(a => a.isCorrect).length,
                    accuracy: Math.round((this.answersHistory.filter(a => a.isCorrect).length / this.sessionQuestions.length) * 100),
                    date: new Date().toLocaleDateString('ms-MY')
                };
                this.saveScoreRecord(scoreRecord);
                this.navTo('result');

                    container.innerHTML = `
                        <div class="glass-card p-8 rounded-3xl max-w-xl w-full text-center border border-white/50 my-6">
                            <div class="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <i data-lucide="award" class="w-12 h-12"></i>
                            </div>
                            <h2 class="font-game text-3xl font-extrabold text-slate-800 mb-1">Permainan Tamat!</h2>
                            <p class="text-xs text-slate-500 mb-6">Tahniah kerana menyelesaikan kuiz Matematik Tahun 5: Ruang</p>

                            <div class="grid grid-cols-2 gap-4 mb-6">
                                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                    <p class="text-xs font-bold text-blue-600">Jumlah Markah</p>
                                    <p class="font-game text-3xl font-extrabold text-blue-800 mt-1">${this.score} / 100</p>
                                </div>
                                <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                                    <p class="text-xs font-bold text-green-600">Ketepatan</p>
                                    <p class="font-game text-3xl font-extrabold text-green-800 mt-1">${accuracy}%</p>
                                </div>
                            </div>

                            <div class="flex gap-3">
                                <button onclick="app.startSession()" class="flex-1 py-3 bg-blue-600 text-white font-game font-bold rounded-xl shadow-md hover:bg-blue-700 btn-bounce">
                                    Main Semula
                                </button>
                                <button onclick="app.navTo('menu')" class="flex-1 py-3 bg-slate-100 text-slate-700 font-game font-bold rounded-xl border border-slate-200 hover:bg-slate-200 btn-bounce">
                                    Menu Utama
                                </button>
                            </div>
                        </div>
                    `;
                }

                // View: Learning Records
                else if (this.currentView === 'records') {
                    const userScores = this.getScores().filter(s => s.username === this.currentUser?.username);
                    container.innerHTML = `
                        <div class="glass-card p-6 md:p-8 rounded-3xl max-w-3xl w-full border border-white/50 my-4">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="font-game text-2xl font-bold text-slate-800">Rekod Pembelajaran Saya</h2>
                                <button onclick="app.navTo('menu')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">
                                    &larr; Kembali
                                </button>
                            </div>

                            ${userScores.length === 0 ? `
                                <p class="text-slate-500 text-sm py-8 text-center">Tiada rekod permainan ditemui. Sila main kuiz dahulu!</p>
                            ` : `
                                <div class="space-y-3 max-h-96 overflow-y-auto pr-1">
                                    ${userScores.map(s => `
                                        <div class="bg-white p-4 rounded-2xl border border-slate-200 flex justify-between items-center">
                                            <div>
                                                <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">${s.subtopic} (${s.level})</span>
                                                <p class="text-xs text-slate-400 mt-1">${s.date}</p>
                                            </div>
                                            <div class="text-right">
                                                <p class="font-game font-bold text-lg text-slate-800">${s.score} Markah</p>
                                                <p class="text-xs text-green-600 font-bold">${s.accuracy}% Ketepatan</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            `}
                        </div>
                    `;
                }

                // View: Leaderboard
                else if (this.currentView === 'leaderboard') {
                    const allScores = [...this.getScores()].sort((a, b) => b.score - a.score).slice(0, 10);
                    container.innerHTML = `
                        <div class="glass-card p-6 md:p-8 rounded-3xl max-w-2xl w-full border border-white/50 my-4">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="font-game text-2xl font-bold text-slate-800">Leaderboard Pemain</h2>
                                <button onclick="app.navTo('menu')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">
                                    &larr; Kembali
                                </button>
                            </div>

                            <div class="space-y-2">
                                ${allScores.map((s, idx) => `
                                    <div class="p-3.5 rounded-2xl flex items-center justify-between border ${idx === 0 ? 'bg-amber-50 border-amber-300' : 'bg-white border-slate-200'}">
                                        <div class="flex items-center gap-3">
                                            <span class="w-8 h-8 rounded-full font-game font-bold text-xs flex items-center justify-center ${idx === 0 ? 'bg-amber-400 text-white' : 'bg-slate-100 text-slate-600'}">
                                                ${idx + 1}
                                            </span>
                                            <div>
                                                <h4 class="font-bold text-sm text-slate-800">${s.displayname}</h4>
                                                <p class="text-xs text-slate-400">${s.subtopic}</p>
                                            </div>
                                        </div>
                                        <span class="font-game font-extrabold text-blue-600 text-base">${s.score} pts</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                // View: Guide
                else if (this.currentView === 'guide') {
                    container.innerHTML = `
                        <div class="glass-card p-6 md:p-8 rounded-3xl max-w-2xl w-full border border-white/50 my-4 text-left">
                            <div class="flex justify-between items-center mb-6">
                                <h2 class="font-game text-2xl font-bold text-slate-800">Panduan Permainan</h2>
                                <button onclick="app.navTo('menu')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl">
                                    &larr; Kembali
                                </button>
                            </div>

                            <div class="space-y-4 text-sm text-slate-600">
                                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                                    <h3 class="font-bold text-blue-800 mb-1">1. Format Permainan</h3>
                                    <p>Setiap sesi mengandungi 20 soalan matematik interaktif. Setiap soalan yang betul memberi 5 markah (Jumlah 100 markah).</p>
                                </div>
                                <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100">
                                    <h3 class="font-bold text-amber-800 mb-1">2. Pilihan Pemasa</h3>
                                    <p>Anda boleh memilih pemasa 30 saat, 1 minit, atau tiada had masa mengikut tahap keselesaan anda.</p>
                                </div>
                                <div class="bg-green-50 p-4 rounded-2xl border border-green-100">
                                    <h3 class="font-bold text-green-800 mb-1">3. Penerangan Jawapan</h3>
                                    <p>Setiap soalan yang dijawab akan diberikan penjelasan serta-merta untuk membantu pengukuhan konsep Matematik Tahun 5.</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                lucide.createIcons();
            }

            handleLogin() {
                const u = document.getElementById('login-username').value;
                const p = document.getElementById('login-password').value;
                const res = this.login(u, p);
                if (res.success) {
                    this.navTo('menu');
                } else {
                    const err = document.getElementById('login-error');
                    err.innerText = res.msg;
                    err.classList.remove('hidden');
                }
            }

            handleRegister() {
                const u = document.getElementById('reg-username').value;
                const d = document.getElementById('reg-displayname').value;
                const p = document.getElementById('reg-password').value;
                const c = document.getElementById('reg-confirm').value;

                if (p !== c) {
                    const err = document.getElementById('reg-error');
                    err.innerText = "Kata laluan tidak sepadan!";
                    err.classList.remove('hidden');
                    return;
                }

                const res = this.register(u, d, p);
                if (res.success) {
                    this.navTo('menu');
                } else {
                    const err = document.getElementById('reg-error');
                    err.innerText = res.msg;
                    err.classList.remove('hidden');
                }
            }
        }

        const app = new MathApp();
        window.onload = () => {
            app.renderHeader();
            app.render();
        };
    </script>
</body>
</html>
