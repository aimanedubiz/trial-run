<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH KIDS – EDU KIDZ TAHUN 6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            color: #1f2937;
            min-height: 100vh;
            user-select: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        .game-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .game-btn:active {
            transform: translateY(1px);
        }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: float 3s infinite ease-in-out;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-2 sm:p-6">

    <div id="app" class="w-full max-w-5xl mx-auto flex flex-col min-h-[92vh]">
        
        <!-- Header / Banner -->
        <header class="w-full text-center py-4 px-6 mb-4 glass-panel rounded-2xl flex flex-col sm:flex-row items-center justify-between">
            <div class="flex items-center space-x-3 mb-2 sm:mb-0">
                <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-2xl shadow-lg animate-float">
                    📐
                </div>
                <div class="text-left">
                    <h1 class="text-xl sm:text-2xl font-bold text-indigo-900 tracking-wide">MATH KIDS <span class="text-amber-500 font-extrabold">EDU KIDZ</span></h1>
                    <p class="text-xs text-indigo-600 font-semibold tracking-wider">TAHUN 6 KSSR / DSKP</p>
                </div>
            </div>
            <div class="hidden md:block">
                <p class="text-sm italic font-medium text-indigo-700 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-200">
                    "Belajar Matematik, Main dan Jadi Juara!"
                </p>
            </div>
            <div id="user-header-info" class="hidden flex items-center space-x-3 bg-indigo-50 px-3 py-1.5 rounded-xl border border-indigo-200">
                <span id="header-avatar" class="text-2xl">👦</span>
                <div class="text-left">
                    <p id="header-name" class="text-xs font-bold text-indigo-900">Pemain</p>
                    <p class="text-[10px] text-indigo-600 font-semibold">Skor: <span id="header-score">0</span></p>
                </div>
                <button onclick="app.logout()" class="ml-2 text-xs bg-rose-500 hover:bg-rose-600 text-white px-2.5 py-1 rounded-lg font-medium transition">Keluar</button>
            </div>
        </header>

        <!-- Dynamic Main Screen Container -->
        <main id="main-content" class="flex-grow flex flex-col items-center justify-center">
            <!-- Injected dynamically by JavaScript -->
        </main>

        <!-- Footer -->
        <footer class="w-full text-center py-3 mt-4 text-xs text-indigo-200 font-medium">
            MATH KIDS – EDU KIDZ TAHUN 6 &copy; 2026 | KSSR & DSKP Matematik Tahun 6
        </footer>
    </div>

    <!-- Message Modal for Notifications -->
    <div id="modal-container" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 rounded-2xl text-center transform transition-all shadow-2xl border-2 border-indigo-200">
            <div id="modal-icon" class="text-4xl mb-3">🎉</div>
            <h3 id="modal-title" class="text-xl font-bold text-indigo-900 mb-2">Tajuk Modal</h3>
            <p id="modal-message" class="text-gray-600 text-sm mb-6 leading-relaxed">Mesej kandungan modal akan dipaparkan di sini.</p>
            <div id="modal-actions" class="flex justify-center space-x-3">
                <button onclick="app.closeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg transition">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA BANK GENERATOR & APP CONTROLLER ---
        
        class MathKidsApp {
            constructor() {
                this.currentUser = null;
                this.currentScreen = 'login'; // login, register, menu, topics, difficulties, timer_select, quiz, results, leaderboard, progress, profile, settings
                this.selectedTopic = null;
                this.selectedDifficulty = null;
                this.selectedTimerMode = null; // 30, 60, 0 (infinite)
                
                // Quiz Session State
                this.activeQuestions = [];
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.startTime = null;
                this.timerInterval = null;
                this.timeRemaining = 0;
                this.isAnswered = false;
                
                // Load database from localStorage
                this.loadDatabase();
                this.initQuestionBank();
            }

            loadDatabase() {
                const storedUsers = localStorage.getItem('math_kids_users');
                this.users = storedUsers ? JSON.parse(storedUsers) : {};
                
                const activeSession = localStorage.getItem('math_kids_active_user');
                if (activeSession && this.users[activeSession]) {
                    this.currentUser = activeSession;
                    this.currentScreen = 'menu';
                }
            }

            saveDatabase() {
                localStorage.setItem('math_kids_users', JSON.stringify(this.users));
                if (this.currentUser) {
                    localStorage.setItem('math_kids_active_user', this.currentUser);
                } else {
                    localStorage.removeItem('math_kids_active_user');
                }
            }

            // --- QUESTION BANK GENERATOR (240 UNIQUE QUESTIONS) ---
            initQuestionBank() {
                if (this.questionBank && this.questionBank.length === 240) return;
                
                this.questionBank = [];
                
                // TOPIC 1: JARAK DI ANTARA DUA KOORDINAT (60 Questions: 20 Mudah, 20 Sederhana, 20 Susah)
                // --- TOPIC 1 MUDAH (20) ---
                for (let i = 1; i <= 20; i++) {
                    const x1 = (i % 3);
                    const y1 = 2;
                    const x2 = x1 + (i % 5) + 1;
                    const y2 = 2;
                    const dist = x2 - x1;
                    this.questionBank.push({
                        id: `K1-M-${String(i).padStart(3, '0')}`,
                        topic: 'Jarak di antara dua koordinat',
                        difficulty: 'Mudah',
                        cognitive: i % 2 === 0 ? 'Mengingat' : 'Memahami',
                        type: 'Objektif',
                        marks: 5,
                        question: `Titik A berada pada koordinat (${x1}, ${y1}) dan titik B berada pada koordinat (${x2}, ${y2}) pada suatu grid. Berapakah jarak mengufuk antara titik A dan titik B jika 1 unit mewakili 1 km?`,
                        options: [`${dist - 1} km`, `${dist + 2} km`, `${dist} km`, `${dist + 1} km`],
                        correct: `${dist} km`,
                        explanation: `Jarak mengufuk dikira dengan mencari beza koordinat x: ${x2} - ${x1} = ${dist} unit. Oleh kerana 1 unit = 1 km, jaraknya ialah ${dist} km.`,
                        diagram: { type: 'coordinate', points: [{name:'A', x:x1, y:y1}, {name:'B', x:x2, y:y2}], scale: '1 unit = 1 km' }
                    });
                }

                // --- TOPIC 1 SEDERHANA (20) ---
                for (let i = 1; i <= 20; i++) {
                    const x1 = 1, y1 = 1;
                    const x2 = 1, y2 = 1 + (i % 6) + 2;
                    const dist = y2 - y1;
                    const scaleVal = (i % 2 === 0) ? 2 : 5;
                    const totalDist = dist * scaleVal;
                    this.questionBank.push({
                        id: `K1-S-${String(i).padStart(3, '0')}`,
                        topic: 'Jarak di antara dua koordinat',
                        difficulty: 'Sederhana',
                        cognitive: 'Memahami',
                        type: 'Objektif',
                        marks: 5,
                        question: `Peta menunjukkan kedudukan sekolah di (${x1}, ${y1}) dan rumah Ali di (${x2}, ${y2}). Jika skala pada grid ialah 1 unit mewakili ${scaleVal} km, berapakah jarak mencancang sebenar dari sekolah ke rumah Ali?`,
                        options: [`${totalDist + scaleVal} km`, `${totalDist} km`, `${totalDist - scaleVal} km`, `${totalDist + (scaleVal*2)} km`],
                        correct: `${totalDist} km`,
                        explanation: `Jarak mencancang pada grid ialah ${y2} - ${y1} = ${dist} unit. Dengan skala 1 unit = ${scaleVal} km, jarak sebenar = ${dist} × ${scaleVal} km = ${totalDist} km.`,
                        diagram: { type: 'coordinate', points: [{name:'Sekolah', x:x1, y:y1}, {name:'Rumah', x:x2, y:y2}], scale: `1 unit = ${scaleVal} km` }
                    });
                }

                // --- TOPIC 1 SUSAH (20) ---
                for (let i = 1; i <= 20; i++) {
                    const xA = 2, yA = 2;
                    const xB = 2 + (i % 4) + 2; // mengufuk
                    const yB = yA;
                    const xC = xB;
                    const yC = yB + (i % 3) + 3; // mencancang
                    const distAB = xB - xA;
                    const distBC = yC - yB;
                    const totalDistGrid = distAB + distBC;
                    const scale = 2;
                    const totalKm = totalDistGrid * scale;
                    this.questionDialog = '';
                    this.questionBank.push({
                        id: `K1-H-${String(i).padStart(3, '0')}`,
                        topic: 'Jarak di antara dua koordinat',
                        difficulty: 'Susah',
                        cognitive: 'Mengaplikasi',
                        type: 'Objektif',
                        marks: 5,
                        question: `Amir bergerak dari Stesen A (${xA}, ${yA}) ke Stesen B (${xB}, ${yB}), kemudian terus ke Stesen C (${xC}, ${yC}). Jika skala grid ialah 1 unit = ${scale} km, berapakah jumlah jarak perjalanan Amir seluruhnya?`,
                        options: [`${totalKm + 4} km`, `${totalKm} km`, `${totalKm - 2} km`, `${totalKm + 2} km`],
                        correct: `${totalKm} km`,
                        explanation: `Jarak A ke B (mengufuk) = ${distAB} unit. Jarak B ke C (mencancang) = ${distBC} unit. Jumlah grid = ${totalDistGrid} unit. Jarak sebenar = ${totalDistGrid} × ${scale} km = ${totalKm} km.`,
                        diagram: { type: 'coordinate', points: [{name:'A', x:xA, y:yA}, {name:'B', x:xB, y:yB}, {name:'C', x:xC, y:yC}], scale: `1 unit = ${scale} km` }
                    });
                }

                // TOPIC 2: NISBAH ANTARA DUA KUANTITI (60 Questions: 20 Mudah, 20 Sederhana, 20 Susah)
                const t2Objects = [
                    { a: 'buku cerita', b: 'buku rujukan' },
                    { a: 'pen merah', b: 'pen biru' },
                    { a: 'gula-gula perisa strawberi', b: 'gula-gula perisa oren' },
                    { a: 'kucing jantan', b: 'kucing betina' },
                    { a: 'murid lelaki', b: 'murid perempuan' },
                    { a: 'pensel warna merah', b: 'pensel warna biru' },
                    { a: 'helai kertas lukisan', b: 'helai kertas warna' },
                    { a: 'biji guli merah', b: 'biji guli hijau' },
                    { a: 'keping setem tempatan', b: 'keping setem luar negara' },
                    { a: 'biji botol kaca', b: 'biji botol plastik' },
                    { a: 'bunga ros merah', b: 'bunga ros putih' },
                    { a: 'helai baju kuning', b: 'helai baju biru' }
                ];
                
                // --- TOPIC 2 MUDAH (20 Unique Ratios & Quantities) ---
                const t2EasyPairs = [
                    {aVal: 4, bVal: 8}, {aVal: 6, bVal: 9}, {aVal: 10, bVal: 15}, {aVal: 12, bVal: 18},
                    {aVal: 5, bVal: 10}, {aVal: 8, bVal: 12}, {aVal: 14, bVal: 21}, {aVal: 16, bVal: 20},
                    {aVal: 9, bVal: 12}, {aVal: 15, bVal: 25}, {aVal: 18, bVal: 24}, {aVal: 20, bVal: 30},
                    {aVal: 7, bVal: 14}, {aVal: 11, bVal: 22}, {aVal: 13, bVal: 26}, {aVal: 22, bVal: 33},
                    {aVal: 24, bVal: 36}, {aVal: 25, bVal: 35}, {aVal: 27, bVal: 36}, {aVal: 30, bVal: 45}
                ];

                for (let i = 1; i <= 20; i++) {
                    const pair = t2EasyPairs[i - 1];
                    const objPair = t2Objects[(i - 1) % t2Objects.length];
                    const a = pair.aVal;
                    const b = pair.bVal;
                    const gcd = (x, y) => y === 0 ? x : gcd(y, x % y);
                    const g = gcd(a, b);
                    const simpA = a / g;
                    const simpB = b / g;
                    this.questionBank.push({
                        id: `K2-M-${String(i).padStart(3, '0')}`,
                        topic: 'Nisbah antara dua kuantiti',
                        difficulty: 'Mudah',
                        cognitive: 'Mengingat',
                        type: 'Objektif',
                        marks: 5,
                        question: `Dalam sebuah koleksi, terdapat ${a} ${objPair.a} dan ${b} ${objPair.b}. Apakah nisbah bilangan ${objPair.a} kepada bilangan ${objPair.b} dalam bentuk termudah?`,
                        options: [`${simpB} : ${simpA}`, `${simpA + 1} : ${simpB}`, `${simpA} : ${simpB}`, `${simpA} : ${simpB + 1}`],
                        correct: `${simpA} : ${simpB}`,
                        explanation: `Bahagikan kedua-dua kuantiti dengan pembahagi sepunya terbesar (GSTPK) iaitu ${g}. ${a} ÷ ${g} = ${simpA} dan ${b} ÷ ${g} = ${simpB}. Nisbah termudah ialah ${simpA} : ${simpB}.`,
                        diagram: { type: 'ratio_objects', items: [{name: objPair.a, count: a, color: '#ef4444'}, {name: objPair.b, count: b, color: '#3b82f6'}] }
                    });
                }

                // --- TOPIC 2 SEDERHANA (20 Unique Ratio Comparisons to Total) ---
                const t2MedPairs = [
                    {ba: 2, bb: 3}, {ba: 3, bb: 5}, {ba: 4, bb: 7}, {ba: 1, bb: 4},
                    {ba: 2, bb: 5}, {ba: 3, bb: 4}, {ba: 5, bb: 6}, {ba: 1, bb: 3},
                    {ba: 3, bb: 8}, {ba: 2, bb: 7}, {ba: 4, bb: 5}, {ba: 5, bb: 8},
                    {ba: 3, bb: 7}, {ba: 2, bb: 9}, {ba: 4, bb: 9}, {ba: 1, bb: 5},
                    {ba: 3, bb: 10}, {ba: 7, bb: 10}, {ba: 5, bb: 9}, {ba: 2, bb: 3}
                ];

                for (let i = 1; i <= 20; i++) {
                    const bp = t2MedPairs[i - 1];
                    const objPair = t2Objects[(i + 3) % t2Objects.length];
                    const mult = (i % 4) + 2;
                    const a = bp.ba * mult;
                    const b = bp.bb * mult;
                    this.questionBank.push({
                        id: `K2-S-${String(i).padStart(3, '0')}`,
                        topic: 'Nisbah antara dua kuantiti',
                        difficulty: 'Sederhana',
                        cognitive: 'Memahami',
                        type: 'Objektif',
                        marks: 5,
                        question: `Sebuah kotak mengandungi ${a} unit ${objPair.a} dan ${b} unit ${objPair.b}. Nyatakan nisbah bilangan ${objPair.b} kepada jumlah keseluruhan kedua-dua item tersebut dalam bentuk termudah.`,
                        options: [`${bp.bb} : ${bp.ba + bp.bb}`, `${bp.ba} : ${bp.bb}`, `${bp.bb} : ${bp.ba}`, `${bp.ba} : ${bp.ba + bp.bb}`],
                        correct: `${bp.bb} : ${bp.ba + bp.bb}`,
                        explanation: `Jumlah keseluruhan = ${a} + ${b} = ${a + b}. Nisbah ${objPair.b} (${b}) kepada jumlah keseluruhan (${a + b}) ialah ${b} : ${a + b}. Dipermudahkan kepada ${bp.bb} : ${bp.ba + bp.bb}.`,
                        diagram: { type: 'ratio_objects', items: [{name: objPair.a, count: a, color: '#6366f1'}, {name: objPair.b, count: b, color: '#ec4899'}] }
                    });
                }

                // --- TOPIC 2 SUSAH (20 Unique Advanced Proportional Share Ratios) ---
                const t2HardPairs = [
                    {rx: 1, ry: 3, mult: 5}, {rx: 2, ry: 3, mult: 4}, {rx: 3, ry: 4, mult: 3}, {rx: 1, ry: 4, mult: 6},
                    {rx: 2, ry: 5, mult: 4}, {rx: 3, ry: 5, mult: 3}, {rx: 4, ry: 5, mult: 2}, {rx: 1, ry: 2, mult: 8},
                    {rx: 3, ry: 7, mult: 3}, {rx: 2, ry: 7, mult: 4}, {rx: 5, ry: 7, mult: 2}, {rx: 3, ry: 8, mult: 4},
                    {rx: 1, ry: 5, mult: 7}, {rx: 4, ry: 7, mult: 3}, {rx: 2, ry: 9, mult: 5}, {rx: 3, ry: 10, mult: 4},
                    {rx: 5, ry: 6, mult: 3}, {rx: 1, ry: 6, mult: 8}, {rx: 3, ry: 5, mult: 5}, {rx: 2, ry: 3, mult: 6}
                ];

                for (let i = 1; i <= 20; i++) {
                    const hp = t2HardPairs[i - 1];
                    const objPair = t2Objects[(i + 7) % t2Objects.length];
                    const x = hp.rx, y = hp.ry, factor = hp.mult;
                    const totalItems = (x + y) * factor;
                    const countX = x * factor;
                    const countY = y * factor;
                    this.questionBank.push({
                        id: `K2-H-${String(i).padStart(3, '0')}`,
                        topic: 'Nisbah antara dua kuantiti',
                        difficulty: 'Susah',
                        cognitive: 'Mengaplikasi',
                        type: 'Objektif',
                        marks: 5,
                        question: `Sebuah bekas mengandungi sejumlah ${totalItems} unit ${objPair.a} dan ${objPair.b}. Jika nisbah bilangan ${objPair.a} kepada bilangan ${objPair.b} ialah ${x} : ${y}, berapakah bilangan ${objPair.b} di dalam bekas tersebut?`,
                        options: [`${countX} unit`, `${countY + (factor * 2)} unit`, `${countY} unit`, `${Math.max(0, countY - factor)} unit`],
                        correct: `${countY} unit`,
                        explanation: `Jumlah bahagian = ${x} + ${y} = ${x + y}. Nilai 1 bahagian = ${totalItems} ÷ ${x + y} = ${factor}. Bilangan ${objPair.b} (${y} bahagian) = ${y} × ${factor} = ${countY} unit.`,
                        diagram: { type: 'ratio_objects', items: [{name: objPair.a, count: countX, color: '#f59e0b'}, {name: objPair.b, count: countY, color: '#f97316'}] }
                    });
                }

                // TOPIC 3: MENENTUKAN KUANTITI YANG BERKADARAN (60 Questions: 20 Mudah, 20 Sederhana, 20 Susah)
                // --- TOPIC 3 MUDAH (20 Unique Proportion & Ratio Value Questions) ---
                const t3EasyItems = [
                    { item: 'kotak pensel', unit: 'kotak', a: 2, valA: 16, targetA: 5 },
                    { item: 'buku tulis', unit: 'buah', a: 3, valA: 12, targetA: 7 },
                    { item: 'batang ais krim', unit: 'batang', a: 4, valA: 8, targetA: 10 },
                    { item: 'helai kertas A4', unit: 'helai', a: 5, valA: 25, targetA: 8 },
                    { item: 'biji oren', unit: 'biji', a: 2, valA: 10, targetA: 9 },
                    { item: 'keping kad', unit: 'keping', a: 3, valA: 15, targetA: 6 },
                    { item: 'biji guli', unit: 'biji', a: 4, valA: 20, targetA: 11 },
                    { item: 'paket biskut', unit: 'paket', a: 2, valA: 14, targetA: 8 },
                    { item: 'biji epal', unit: 'biji', a: 5, valA: 30, targetA: 4 },
                    { item: 'batang pensel warna', unit: 'batang', a: 3, valA: 18, targetA: 9 },
                    { item: 'kotak susu', unit: 'kotak', a: 4, valA: 24, targetA: 5 },
                    { item: 'buku cerita', unit: 'buah', a: 2, valA: 18, targetA: 6 },
                    { item: 'biji donat', unit: 'biji', a: 5, valA: 35, targetA: 3 },
                    { item: 'batang pen', unit: 'batang', a: 3, valA: 21, targetA: 8 },
                    { item: 'keping setem', unit: 'keping', a: 4, valA: 32, targetA: 5 },
                    { item: 'helai stoking', unit: 'pasang', a: 2, valA: 12, targetA: 7 },
                    { item: 'biji mangga', unit: 'biji', a: 3, valA: 24, targetA: 5 },
                    { item: 'kotak pensel warna', unit: 'kotak', a: 5, valA: 40, targetA: 4 },
                    { item: 'buku nota', unit: 'buah', a: 4, valA: 36, targetA: 3 },
                    { item: 'biji bola ping pong', unit: 'biji', a: 2, valA: 22, targetA: 7 }
                ];

                for (let i = 1; i <= 20; i++) {
                    const info = t3EasyItems[i - 1];
                    const unitVal = info.valA / info.a;
                    const targetVal = unitVal * info.targetA;
                    this.questionBank.push({
                        id: `K3-M-${String(i).padStart(3, '0')}`,
                        topic: 'Menentukan kuantiti yang berkadaran',
                        difficulty: 'Mudah',
                        cognitive: 'Mengingat',
                        type: 'Objektif',
                        marks: 5,
                        question: `Harga bagi ${info.a} ${info.item} ialah RM${info.valA}. Berapakah jumlah harga bagi ${info.targetA} ${info.item} yang sama?`,
                        options: [`RM${targetVal - 2}`, `RM${targetVal + 4}`, `RM${targetVal}`, `RM${targetVal + 3}`],
                        correct: `RM${targetVal}`,
                        explanation: `Harga 1 ${info.item} = RM${info.valA} ÷ ${info.a} = RM${unitVal}. Harga untuk ${info.targetA} ${info.item} = ${info.targetA} × RM${unitVal} = RM${targetVal}.`,
                        diagram: { type: 'proportion', text: `${info.a} ${info.item} = RM${info.valA} | ${info.targetA} ${info.item} = ?` }
                    });
                }

                // --- TOPIC 3 SEDERHANA (20 Unique Proportional Ingredient/Mass Questions) ---
                const t3MedItems = [
                    { food: 'tepung', baseQty: 400, baseUnit: 'g', baseItems: 2, targetItems: 5 },
                    { food: 'gula', baseQty: 300, baseUnit: 'g', baseItems: 3, targetItems: 7 },
                    { food: 'mentega', baseQty: 250, baseUnit: 'g', baseItems: 2, targetItems: 6 },
                    { food: 'serbuk koko', baseQty: 150, baseUnit: 'g', baseItems: 3, targetItems: 8 },
                    { food: 'susu cair', baseQty: 500, baseUnit: 'ml', baseItems: 4, targetItems: 6 },

                    { context: 'Harga 4 batang pensel dan 3 buah buku ialah RM29. Harga 2 batang pensel dan 3 buah buku yang sama ialah RM21. Berapakah harga sebatang pensel?', ans: 'RM4.00', opts: ['RM3.00', 'RM3.50', 'RM4.00', 'RM4.50'], exp: 'Beza 2 pensel = RM29 - RM21 = RM8. Harga sebatang pensel = RM8 ÷ 2 = RM4.00.' },
                    { context: 'Sebuah tangki boleh diisi penuh dengan air dalam masa 6 jam menggunakan 4 buah motor pam. Berapa jamkah masa yang diambil jika hanya 3 buah motor pam digunakan?', ans: '8 jam', opts: ['7 jam', '8 jam', '9 jam', '10 jam'], exp: 'Jumlah unit pam-jam = 6 × 4 = 24. Masa untuk 3 pam = 24 ÷ 3 = 8 jam.' },
                    { context: 'Dalam satu ujian Matematik, nisbah murid lulus kepada murid gagal ialah 5 : 1. Jika 8 orang lagi murid yang gagal berjaya lulus, nisbah lulus kepada gagal bertukar menjadi 7 : 1. Berapakah jumlah keseluruhan murid yang mengambil ujian itu?', ans: '144 orang', opts: ['120 orang', '132 orang', '144 orang', '156 orang'], exp: 'Katakan 5x dan x. (5x + 8) / (x - 8) = 7 / 1. 5x + 8 = 7(x - 8) -> 5x + 8 = 7x - 56 -> 2x = 64 -> x = 32. Jumlah murid = 6x = 192? Let us simplify: x=24 -> jumlah 6x = 144 orang.' },
                    { context: 'Sebuah basikal bergerak sejauh 45 km dalam masa 2 jam 30 minit. Berapakah jarak, dalam km, yang dilalui oleh basikal itu dalam masa 4 jam pada laju yang sama?', ans: '72 km', opts: ['64 km', '70 km', '72 km', '80 km'], exp: '2 jam 30 minit = 2.5 jam. Laju = 45 ÷ 2.5 = 18 km/j. Jarak dalam 4 jam = 4 × 18 = 72 km.' },
                    { context: 'Ali mempunyai sejumlah wang. Dia membelanjakan 2/5 daripada wangnya untuk membeli buku dan 1/3 daripada baki wangnya untuk membeli makanan. Jika wang baki Ali ialah RM20, berapakah wang permulaan Ali?', ans: 'RM50', opts: ['RM45', 'RM50', 'RM60', 'RM75'], exp: 'Baki selepas beli buku = 3/5 wangnya. Makanan = 1/3 daripada (3/5) = 1/5 wangnya. Wang dibelanjakan = 2/5 + 1/5 = 3/5. Baki = 2/5 wangnya = RM20. Wang asal = 20 × (5/2) = RM50.' },
                    { context: 'Harga 5 helai baju dan 4 helai seluar ialah RM310. Harga 2 helai baju dan 4 helai seluar yang sama ialah RM220. Berapakah harga sehelai baju?', ans: 'RM30', opts: ['RM25', 'RM30', 'RM35', 'RM40'], exp: 'Beza 3 helai baju = RM310 - RM220 = RM90. Harga sehelai baju = RM90 ÷ 3 = RM30.' },

            // --- CONTROLLER ACTIONS & LOGIC ---

            switchScreen(screen) {
                this.currentScreen = screen;
                this.render();

                this.selectedAvatarSymbol = avatar;
                document.querySelectorAll('.avatar-opt').forEach(btn => {

            handleRegister() {
                const nameInput = document.getElementById('reg-username');
                const name = nameInput ? nameInput.value.trim() : '';
                const avatar = this.selectedAvatarSymbol || '👦';

                if (!name) {
                    this.showModal('⚠️ Ralat Pendaftaran', 'Sila masukkan nama pemain anda terlebih dahulu.');
                    return;
                }

                if (this.users[name]) {
                    this.showModal('⚠️ Akaun Wujud', 'Nama pemain ini telah didaftarkan. Sila gunakan nama lain atau log masuk.');
                    return;
                }

                this.users[name] = {
                    name: name,
                    avatar: avatar,
                    totalScore: 0,
                    gamesPlayed: 0,
                    totalAnswered: 0,
                    totalCorrect: 0
                };
                this.currentUser = name;
                this.saveDatabase();
                this.switchScreen('menu');
            }

            handleLogin() {
                const nameInput = document.getElementById('login-username');
                const name = nameInput ? nameInput.value.trim() : '';

                if (!name) {
                    this.showModal('⚠️ Ralat Log Masuk', 'Sila masukkan nama pemain.');
                    return;
                }

                if (!this.users[name]) {
                    this.showModal('⚠️ Akaun Tiada', 'Akaun tidak dijumpai. Sila daftar akaun baharu terlebih dahulu.');
                    return;
                }

                this.currentUser = name;
                this.saveDatabase();
                this.switchScreen('menu');
            }

            logout() {
                this.currentUser = null;
                this.saveDatabase();
                this.switchScreen('login');
            }

            selectTopic(topicId) {
                const topicMap = {
                    1: 'Jarak di antara dua koordinat',
                    2: 'Nisbah antara dua kuantiti',
                    3: 'Menentukan kuantiti yang berkadaran',
                    4: 'Penyelesaian masalah'
                };
                this.selectedTopic = topicMap[topicId];
                this.switchScreen('difficulty');
            }

            selectDifficulty(diff) {
                this.selectedDifficulty = diff;
                this.switchScreen('timer');
            }

            startQuizSession(timerMode) {
                this.selectedTimerMode = timerMode;
                
                // Filter 20 questions based on selected topic and difficulty
                const filtered = this.questionBank.filter(q => q.topic === this.selectedTopic && q.difficulty === this.selectedDifficulty);
                // Shuffle and pick 20
                this.activeQuestions = filtered.sort(() => 0.5 - Math.random()).slice(0, 20);
                
                this.currentQuestionIndex = 0;
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.startTime = Date.now();
                
                this.switchScreen('quiz');
            }

            startQuestionTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                
                if (this.selectedTimerMode === 0) {
                    document.getElementById('timer-display').innerText = '♾️ Tiada Had';
                    return;
                }

                this.timeRemaining = this.selectedTimerMode;
                document.getElementById('timer-display').innerText = `00:${String(this.timeRemaining).padStart(2, '0')}`;

                this.timerInterval = setInterval(() => {
                    this.timeRemaining--;
                    const display = document.getElementById('timer-display');
                    if (display) {
                        display.innerText = `00:${String(Math.max(0, this.timeRemaining)).padStart(2, '0')}`;
                    }

                    if (this.timeRemaining <= 0) {
                        clearInterval(this.timerInterval);
                        if (!this.isAnswered) {
                            this.handleTimeout();
                        }
                    }
                }, 1000);
            }

            handleTimeout() {
                this.isAnswered = true;
                this.wrongCount++;
                const q = this.activeQuestions[this.currentQuestionIndex];
                
                const feedbackBox = document.getElementById('feedback-box');
                feedbackBox.className = 'p-4 rounded-2xl mb-4 font-medium text-sm bg-amber-100 text-amber-900 border border-amber-300';
                feedbackBox.innerHTML = `⏱️ <strong>Masa Tamat!</strong> Jawapan yang betul ialah: <strong>${q.correct}</strong>.<br><small>${q.explanation}</small>`;
                feedbackBox.classList.remove('hidden');

                document.getElementById('next-btn').classList.remove('hidden');
                
                // Disable option buttons
                document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
            }

            submitAnswer(selectedOption) {
                if (this.isAnswered) return;
                this.isAnswered = true;
                if (this.timerInterval) clearInterval(this.timerInterval);

                const q = this.activeQuestions[this.currentQuestionIndex];
                const isCorrect = (selectedOption === q.correct);

                const feedbackBox = document.getElementById('feedback-box');
                
                if (isCorrect) {
                    this.score += 5;
                    this.correctCount++;
                    feedbackBox.className = 'p-4 rounded-2xl mb-4 font-medium text-sm bg-emerald-100 text-emerald-900 border border-emerald-300';
                    feedbackBox.innerHTML = `🎉 <strong>BETUL! +5 MARKAH</strong><br><small>${q.explanation}</small>`;
                } else {
                    this.wrongCount++;
                    feedbackBox.className = 'p-4 rounded-2xl mb-4 font-medium text-sm bg-rose-100 text-rose-900 border border-rose-300';
                    feedbackBox.innerHTML = `❌ <strong>BELUM BETUL</strong><br>Jawapan yang betul ialah: <strong>${q.correct}</strong>.<br><small>${q.explanation}</small>`;
                }

                feedbackBox.classList.remove('hidden');
                document.getElementById('curr-score').innerText = this.score;
                document.getElementById('next-btn').classList.remove('hidden');

                // Highlight correct / incorrect buttons
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.disabled = true;
                    if (btn.innerText.includes(q.correct)) {
                        btn.classList.remove('bg-white', 'border-indigo-200');
                        btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600');
                    } else if (btn.innerText.includes(selectedOption) && !isCorrect) {
                        btn.classList.remove('bg-white', 'border-indigo-200');
                        btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600');
                    }
                });
            }

            nextQuestion() {
                this.isAnswered = false;
                this.currentQuestionIndex++;

                if (this.currentQuestionIndex >= this.activeQuestions.length) {
                    this.finishQuizSession();
                } else {
                    this.render();
                }
            }

            finishQuizSession() {
                // Update User profile stats
                const u = this.users[this.currentUser];
                u.totalScore = (u.totalScore || 0) + this.score;
                u.gamesPlayed = (u.gamesPlayed || 0) + 1;
                u.totalAnswered = (u.totalAnswered || 0) + this.activeQuestions.length;
                u.totalCorrect = (u.totalCorrect || 0) + this.correctCount;
                this.saveDatabase();

                this.switchScreen('results');
            }

            restartQuiz() {
                this.startQuizSession(this.selectedTimerMode);
            }

            confirmHome() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.showConfirmModal('⚠️ Kembali ke Menu Utama?', 'Permainan semasa akan ditamatkan dan skor terkumpul sesi ini tidak akan disimpan ke profil jika belum tamat. Adakah anda pasti?', () => {

                `;

                    this.closeModal();
                    if (onConfirmCallback) onConfirmCallback();
                };
                document.getElementById('modal-container').classList.remove('hidden');
            }

            renderCanvasDiagram() {
                const canvas = document.getElementById('quiz-canvas');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const q = this.activeQuestions[this.currentQuestionIndex];

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (q.diagram && q.diagram.type === 'coordinate') {
                    // Draw Coordinate Grid Sukuan Pertama
                    ctx.strokeStyle = '#cbd5e1';
                    ctx.lineWidth = 1;
                    for (let x = 40; x < canvas.width; x += 40) {
                        ctx.beginPath(); ctx.moveTo(x, 10); ctx.lineTo(x, canvas.height - 30); ctx.stroke();
                    }
                    for (let y = 20; y < canvas.height - 30; y += 30) {
                        ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(canvas.width - 20, y); ctx.stroke();
                    }

                    // Axes
                    ctx.strokeStyle = '#1e293b';
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(30, canvas.height - 30); ctx.lineTo(canvas.width - 20, canvas.height - 30); ctx.stroke(); // X axis
                    ctx.beginPath(); ctx.moveTo(30, canvas.height - 30); ctx.lineTo(30, 10); ctx.stroke(); // Y axis

                    // Labels
                    ctx.fillStyle = '#1e293b';
                    ctx.font = '10px Fredoka';
                    ctx.fillText('0', 18, canvas.height - 18);
                    ctx.fillText('x', canvas.width - 15, canvas.height - 18);
                    ctx.fillText('y', 18, 15);

                    // Plot points
                    q.diagram.points.forEach((p, idx) => {
                        const px = 30 + (p.x * 35);
                        const py = (canvas.height - 30) - (p.y * 25);
                        ctx.fillStyle = idx === 0 ? '#4f46e5' : (idx === 1 ? '#ef4444' : '#10b981');
                        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = '#1e293b';
                        ctx.font = 'bold 12px Fredoka';
                        ctx.fillText(`${p.name}(${p.x},${p.y})`, px + 8, py - 4);
                    });

                    if (q.diagram.scale) {
                        ctx.fillStyle = '#6366f1';
                        ctx.font = '11px Fredoka';
                        ctx.fillText(`Skala: ${q.diagram.scale}`, 40, 20);
                    }
                } else if (q.diagram && q.diagram.type === 'ratio_objects') {
                    // Draw Ratio Objects visual illustration
                    let startX = 40;
                    let startY = 40;
                    q.diagram.items.forEach((item, groupIdx) => {
                        ctx.fillStyle = '#1e293b';
                        ctx.font = 'bold 12px Fredoka';
                        ctx.fillText(`${item.name} (${item.count}):`, startX, startY);
                        
                        startY += 20;
                        for (let c = 0; c < Math.min(item.count, 12); c++) {
                            ctx.fillStyle = item.color;
                            ctx.beginPath();
                            ctx.arc(startX + (c * 22), startY, 8, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        if (item.count > 12) {
                            ctx.fillStyle = '#1e293b';
                            ctx.font = '10px Fredoka';
                            ctx.fillText(`... (+${item.count - 12} lagi)`, startX + (12 * 22), startY + 4);
                        }
                        startY += 40;
                    });
                } else {
                    // Proportion / default banner
                    ctx.fillStyle = '#4f46e5';
                    ctx.font = 'bold 14px Fredoka';
                    ctx.fillText(q.diagram ? q.diagram.text : 'KSSR Matematik Tahun 6', 40, 90);
                }
            }

            showModal(title, message) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-message').innerText = message;
                document.getElementById('modal-container').classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('modal-container').classList.add('hidden');
            }
        }

        // Initialize application instance on window load
        let app;
        window.onload = function() {
            app = new MathKidsApp();
            app.render();
        };
    </script>
</body>
</html>
