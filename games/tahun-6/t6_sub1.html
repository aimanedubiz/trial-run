    <!-- Custom Modal for Notifications / Messages -->

    <script>
        const TOPICS_LIST = [
            { id: 1, title: "KENALI NOMBOR", icon: "🔢", desc: "Nombor hingga 10 000 000, nilai tempat, digit & cerakin", subtopics: ["A. Nombor dalam unit juta", "B. Tuliskan nombor dalam angka", "C. Tuliskan nombor dalam perkataan", "D. Teroka nombor", "E. Cerakinkan nombor", "F. Nilai tempat digit bergaris", "G. Nilai digit digit bergaris"] },
            { id: 2, title: "POLA NOMBOR", icon: "📈", desc: "Mengenal pasti, melengkapkan & menentukan pola menaik/menurun", subtopics: ["Mengenal pasti pola", "Melengkapkan pola", "Menentukan nombor seterusnya", "Menentukan nombor yang hilang", "Pola menaik & menurun berasaskan operasi"] },
            { id: 3, title: "PECAHAN JUTA & PERPULUHAN JUTA", icon: "📊", desc: "Hubungan juta dengan pecahan & perpuluhan serta perbandingan nilai", subtopics: ["Pecahan juta", "Perpuluhan juta", "Hubungan juta dengan pecahan/perpuluhan", "Menulis pecahan & perpuluhan juta", "Membandingkan nilai juta"] },
            { id: 4, title: "PENUKARAN NOMBOR", icon: "🔄", desc: "Penukaran antara angka, perkataan, bentuk cerakin, pecahan & perpuluhan", subtopics: ["Angka kepada perkataan", "Perkataan kepada angka", "Cerakin kepada nombor", "Pecahan juta kepada nombor", "Perpuluhan juta kepada nombor"] },
            { id: 5, title: "OPERASI ASAS", icon: "➕", desc: "Tambah, tolak, darab & bahagi nombor bulat besar dengan teliti", subtopics: ["Tambah nombor besar", "Tolak nombor besar", "Darab nombor besar", "Bahagi nombor besar", "Pengiraan menegak & mental"] },
            { id: 6, title: "OPERASI BERGABUNG", icon: "🧮", desc: "Gabungan tambah, tolak, darab & bahagi mengikut tertib operasi", subtopics: ["Tambah dan tolak", "Darab dan bahagi", "Tambah dan darab", "Gabungan tiga atau lebih operasi"] },
            { id: 7, title: "OPERASI MELIBATKAN ANU", icon: "❓", desc: "Mencari nilai anu (□, △, ○, x) dalam ayat matematik", subtopics: ["Tambah melibatkan anu", "Tolak melibatkan anu", "Darab melibatkan anu", "Bahagi melibatkan anu", "Operasi bergabung melibatkan anu"] },
            { id: 8, title: "NOMBOR PERDANA & GUBAHAN", icon: "⭐", desc: "Mengenal nombor perdana, nombor gubahan & faktor", subtopics: ["Mengenal nombor perdana", "Mengenal nombor gubahan", "Membezakan nombor perdana & gubahan", "Mengenal pasti faktor"] },
            { id: 9, title: "PENYELESAIAN MASALAH", icon: "💡", desc: "Situasi kehidupan sebenar melibatkan murid, jarak, barang & wang", subtopics: ["A. Masalah melibatkan bilangan murid", "B. Masalah jarak perjalanan", "C. Masalah pengeluaran & taburan barang", "D. Masalah kewangan & sumbangan sekolah"] }
        ];

        function generateCompleteQuestionBank() {
            const bank = {};
            const levels = ['Senang', 'Sederhana', 'Susah'];
            const cognitiveLevels = {
                'Senang': ['Mengingat', 'Memahami'],
                'Sederhana': ['Mengingat', 'Memahami', 'Mengaplikasi'],
                'Susah': ['Memahami', 'Mengaplikasi']
            };
            const gameTypes = ['Objektif', 'Padanan', 'Drag & Drop', 'Isi Tempat Kosong'];

            TOPICS_LIST.forEach((topic, tIdx) => {
                bank[topic.id] = {};
                levels.forEach(level => {
                    bank[topic.id][level] = [];
                    for (let q = 1; q <= 20; q++) {
                        const cogArr = cognitiveLevels[level];
                        const cog = cogArr[(q + tIdx) % cogArr.length];
                        const gType = gameTypes[(q + tIdx) % gameTypes.length];
                        
                        let qData = createDynamicQuestion(topic.id, level, q, cog, gType);
                        bank[topic.id][level].push(qData);
                    }
                });
            });
            return bank;
        }

        function createDynamicQuestion(topicId, level, qNum, cog, gType) {
            const id = `T${topicId}_${level.toUpperCase()}_Q${qNum}`;
            let subtopic = TOPICS_LIST[topicId - 1].subtopics[(qNum - 1) % TOPICS_LIST[topicId - 1].subtopics.length];
            
            let seed1 = (qNum * 17 + topicId * 31) % 900 + 100;
            let seed2 = (qNum * 23 + topicId * 13) % 800 + 150;
            
            let qText = "";
            let options = [];
            let answer = "";
            let diagram = "kad_nombor_juta";
            let explanation = "";

            switch(topicId) {
                case 1: // KENALI NOMBOR
                    if (qNum % 3 === 0) {
                        qText = `Tentukan nilai digit bagi digit yang bergaris dalam nombor 4,${seed1}5${seed2},120:`;
                        options = [`${seed1} 000`, `${seed1}0 000`, `${seed1}00 000`, `${seed1},000,000`];
                        answer = `${seed1}00 000`;
                        diagram = "carta_nilai_tempat";
                        explanation = `Digit ${seed1.toString()[0]} terletak pada rumah ratus ribu. Oleh itu, nilai digitnya ialah ${seed1}00 000.`;
                    } else if (qNum % 3 === 1) {
                        qText = `Pilih nombor yang betul bagi perkataan: "Tiga juta dua ratus ribu empat puluh sembilan".`;
                        options = ["3 200 049", "3 200 490", "3 020 049", "3 249 000"];
                        answer = "3 200 049";
                        diagram = "kad_nombor_juta";
                        explanation = `Tiga juta = 3 000 000, dua ratus ribu = 200 000, empat puluh sembilan = 49. Jumlahnya 3 200 049.`;
                    } else {
                        qText = `Apakah bentuk cerakinkan mengikut nilai digit bagi nombor 5,${seed1},682?`;
                        options = [
                            `5 000 000 + ${seed1} 000 + 600 + 80 + 2`,
                            `5 000 000 + ${seed1}00 + 60 + 8 + 2`,
                            `5 000 000 + ${seed1} 000 + 60 + 82`,
                            `500 000 + ${seed1} 000 + 600 + 80 + 2`
                        ];
                        answer = `5 000 000 + ${seed1} 000 + 600 + 80 + 2`;
                        diagram = "carta_cerakinkan_nombor";
                        explanation = `Cerakin mengikut nilai digit menguraikan setiap digit mengikut nilai tempatnya dengan tepat.`;
                    }
                    break;
                case 2: // POLA NOMBOR
                    let startNum = 1205000 + qNum * 10000;
                    let step = 25000 + qNum * 1000;
                    qText = `Kenal pasti nombor yang hilang dalam pola menaik berikut: ${startNum.toLocaleString()}, ${(startNum + step).toLocaleString()}, [ ? ], ${(startNum + step * 3).toLocaleString()}`;
                    let wrong1 = (startNum + step * 2 + 5000).toLocaleString();
                    let wrong2 = (startNum + step * 2 - 2000).toLocaleString();
                    let wrong3 = (startNum + step * 2 + 10000).toLocaleString();
                    let correctAns = (startNum + step * 2).toLocaleString();
                    options = [correctAns, wrong1, wrong2, wrong3].sort();
                    answer = correctAns;
                    diagram = "carta_pola";
                    explanation = `Pola ini adalah tertib menaik sebanyak ${step.toLocaleString()} pada setiap sebutan berikutnya.`;
                    break;
                case 3: // PECAHAN JUTA & PERPULUHAN JUTA
                    if (qNum % 2 === 0) {
                        let fracNumer = (qNum % 3) + 1;
                        let val = 1000000 + (fracNumer / 4) * 1000000;
                        qText = `Tukar 1 ${fracNumer}/4 juta kepada nombor bulat:`;
                        options = [`${val.toLocaleString()}`, `${(val + 100000).toLocaleString()}`, `${(val - 50000).toLocaleString()}`, `${(val + 250000).toLocaleString()}`];
                        answer = `${val.toLocaleString()}`;
                        diagram = "grid_pecahan";
                        explanation = `1 ${fracNumer}/4 juta bermaksud 1 000 000 + (${fracNumer}/4 × 1 000 000). Hasilnya ialah ${val.toLocaleString()}.`;
                    } else {
                        let decPart = (qNum * 15) % 90 + 10;
                        let pVal = 3000000 + decPart * 10000;
                        qText = `Nyatakan 3.${decPart} juta dalam nombor bulat:`;
                        options = [`${pVal.toLocaleString()}`, `${(pVal + 10000).toLocaleString()}`, `${(pVal - 20000).toLocaleString()}`, `${(pVal + 200000).toLocaleString()}`];
                        answer = `${pVal.toLocaleString()}`;
                        diagram = "grid_perpuluhan";
                        explanation = `3.${decPart} juta dikira dengan mendarabkan 3.${decPart} dengan 1 000 000.`;
                    }
                    break;
                case 4: // PENUKARAN NOMBOR
                    const conversionType = qNum % 5;
                    if (conversionType === 0) {
                        let numVal = 2000000 + seed1 * 100;
                        qText = `Tuliskan nombor ${numVal.toLocaleString()} dalam perkataan yang tepat:`;
                        options = [
                            `Dua juta ${seed1} ratus`,
                            `Dua juta ${seed1} ribu`,
                            `Dua juta ${seed1} puluh ribu`,
                            `Dua juta dan ${seed1}`
                        ];
                        answer = `Dua juta ${seed1} ratus`;
                        diagram = "kad_nombor_juta";
                        explanation = `Nombor ${numVal.toLocaleString()} dibaca sebagai Dua juta ${seed1} ratus.`;
                    } else if (conversionType === 1) {
                        let targetNum = 4000000 + seed2 * 1000;
                        qText = `Pilih angka yang betul bagi: "Empat juta ${seed2} ribu".`;
                        options = [
                            targetNum.toLocaleString(),
                            (targetNum + 100000).toLocaleString(),
                            (targetNum - 50000).toLocaleString(),
                            (4000000 + seed2 * 100).toLocaleString()
                        ].sort();
                        answer = targetNum.toLocaleString();
                        diagram = "kad_nombor_juta";
                        explanation = `"Empat juta ${seed2} ribu" ditulis dalam bentuk angka sebagai ${targetNum.toLocaleString()}.`;
                    } else if (conversionType === 2) {
                        let cNum = 5000000 + seed1 * 1000 + 400 + 80 + 3;
                        qText = `Apakah nombor bagi bentuk cerakin berikut?\n5 000 000 + ${(seed1*1000).toLocaleString()} + 400 + 80 + 3`;
                        options = [
                            cNum.toLocaleString(),
                            (cNum + 1000).toLocaleString(),
                            (5000000 + seed1*100 + 483).toLocaleString(),
                            (cNum - 400).toLocaleString()
                        ].sort();
                        answer = cNum.toLocaleString();
                        diagram = "carta_cerakinkan_nombor";
                        explanation = `Gabungkan nilai tempat setiap pengangka cerakin untuk membentuk nombor penuh ${cNum.toLocaleString()}.`;
                    } else if (conversionType === 3) {
                        let numer = (qNum % 2 === 0) ? 1 : 3;
                        let denom = 4;
                        let fracResult = (numer / denom) * 1000000;
                        qText = `Tukar ${numer}/${denom} juta kepada nombor bulat:`;
                        options = [
                            fracResult.toLocaleString(),
                            (fracResult + 250000).toLocaleString(),
                            (fracResult - 125000).toLocaleString(),
                            (fracResult * 2).toLocaleString()
                        ].sort();
                        answer = fracResult.toLocaleString();
                        diagram = "grid_pecahan";
                        explanation = `${numer}/${denom} juta dikira sebagai ${numer}/${denom} × 1 000 000 = ${fracResult.toLocaleString()}.`;
                    } else {
                        let decVal = (qNum * 25) % 900 + 100;
                        let decResult = decVal * 1000;
                        qText = `Tukar 0.${decVal} juta kepada nombor bulat:`;
                        options = [
                            decResult.toLocaleString(),
                            (decResult + 100000).toLocaleString(),
                            (decResult / 10).toLocaleString(),
                            (decResult + 50000).toLocaleString()
                        ].sort();
                        answer = decResult.toLocaleString();
                        diagram = "grid_perpuluhan";
                        explanation = `0.${decVal} juta diperoleh dengan mendarab 0.${decVal} dengan 1 000 000, iaitu ${decResult.toLocaleString()}.`;
                    }
                    break;
                case 5: // OPERASI ASAS
                    const opType = qNum % 4;
                    if (opType === 0) {
                        let numA = 1245000 + qNum * 12345;
                        let numB = 356000 + qNum * 5432;
                        let res = numA + numB;
                        qText = `Hitung hasil tambah berikut secara menegak dan tepat: ${numA.toLocaleString()} + ${numB.toLocaleString()} = ?`;
                        options = [
                            res.toLocaleString(),
                            (res + 1000).toLocaleString(),
                            (res - 2500).toLocaleString(),
                            (res + 10000).toLocaleString()
                        ].sort(() => Math.random() - 0.5);
                        answer = res.toLocaleString();
                        diagram = "kad_operasi";
                        explanation = `Susun nombor secara menegak mengikut nilai tempat dari sa hingga juta. Jumlah hasil tambah ialah ${res.toLocaleString()}.`;
                    } else if (opType === 1) {
                        let numA = 5890400 + qNum * 15200;
                        let numB = 2134000 + qNum * 3100;
                        let res = numA - numB;
                        qText = `Cari hasil tolak bagi nombor besar berikut: ${numA.toLocaleString()} - ${numB.toLocaleString()} = ?`;
                        options = [
                            res.toLocaleString(),
                            (res + 5000).toLocaleString(),
                            (res - 1000).toLocaleString(),
                            (res + 20000).toLocaleString()
                        ].sort(() => Math.random() - 0.5);
                        answer = res.toLocaleString();
                        diagram = "kad_operasi";
                        explanation = `Lakukan penolakan dengan meminjam dari rumah nilai tempat sebelah jika perlu. Hasil tolak ialah ${res.toLocaleString()}.`;
                    } else if (opType === 2) {
                        let numA = 145000 + qNum * 1200;
                        let numB = 12 + (qNum % 8);
                        let res = numA * numB;
                        qText = `Hitung hasil darab nombor bulat dengan nombor 2 digit: ${numA.toLocaleString()} × ${numB} = ?`;
                        options = [
                            res.toLocaleString(),
                            (res + numA).toLocaleString(),
                            (res - numA).toLocaleString(),
                            (res + 50000).toLocaleString()
                        ].sort(() => Math.random() - 0.5);
                        answer = res.toLocaleString();
                        diagram = "kad_operasi";
                        explanation = `Darabkan ${numA.toLocaleString()} dengan ${numB} menggunakan kaedah lazim dengan teliti. Hasil darab ialah ${res.toLocaleString()}.`;
                    } else {
                        let divisor = 15 + (qNum % 10);
                        let quotient = 234000 + qNum * 1100;
                        let dividend = quotient * divisor;
                        qText = `Selesaikan operasi bahagi nombor besar berikut: ${dividend.toLocaleString()} ÷ ${divisor} = ?`;
                        options = [
                            quotient.toLocaleString(),
                            (quotient + 1000).toLocaleString(),
                            (quotient - 500).toLocaleString(),
                            (quotient + 5000).toLocaleString()
                        ].sort(() => Math.random() - 0.5);
                        answer = quotient.toLocaleString();
                        diagram = "kad_operasi";
                        explanation = `Bahagikan ${dividend.toLocaleString()} dengan ${divisor} menggunakan kaedah bahagi panjang. Hasilnya ialah ${quotient.toLocaleString()}.`;
                    }
                    break;
                case 6: // OPERASI BERGABUNG
                    qText = `Selesaikan ayat matematik berikut mengikut tertib operasi: 4 500 000 + ${seed1} 000 × 2 = ?`;
                    let resOp = 4500000 + seed1 * 2000;
                    options = [resOp.toLocaleString(), (4500000 + seed1 * 1000 * 2).toLocaleString(), (4550000 + seed1 * 2000).toLocaleString(), (4400000 + seed1 * 2000).toLocaleString()].sort();
                    answer = resOp.toLocaleString();
                    diagram = "kad_operasi";
                    explanation = `Mengikut tertib operasi (BODMAS/KODMAS), darab didahulukan sebelum tambah.`;
                    break;
                case 7: // OPERASI MELIBATKAN ANU (Refined: 100% Unique Questions Across All Levels & QNumbers)
                    const varsList = ['x', 'y', 'z', 'p', 'q', 'm'];
                    const chosenVar = varsList[(qNum + topicId) % varsList.length];
                    
                    if (level === 'Senang') {
                        // Senang: Persamaan asas melibatkan tambah dan tolak (1 hingga 20 unik)
                        let baseVal = 1000000 + (qNum * 125400);
                        let targetVal = baseVal + 2500000 + (qNum * 50000);
                        
                        if (qNum % 2 === 0) {
                            qText = `Cari nilai bagi anu ${chosenVar} dalam persamaan tambah berikut:\n${chosenVar} + ${baseVal.toLocaleString()} = ${targetVal.toLocaleString()}`;
                            let correctVal = targetVal - baseVal;
                            answer = correctVal.toLocaleString();
                            options = [
                                correctVal.toLocaleString(),
                                (correctVal + 150000).toLocaleString(),
                                (targetVal + 300000).toLocaleString(),
                                (baseVal - 50000).toLocaleString()
                            ].sort();
                            explanation = `Untuk mencari ${chosenVar}, tolakkan ${targetVal.toLocaleString()} dengan ${baseVal.toLocaleString()}, menghasilkan ${correctVal.toLocaleString()}.`;
                        } else {
                            qText = `Selesaikan persamaan tolak berikut untuk mencari nilai ${chosenVar}:\n${targetVal.toLocaleString()} - ${chosenVar} = ${baseVal.toLocaleString()}`;
                            let correctVal = targetVal - baseVal;
                            answer = correctVal.toLocaleString();
                            options = [
                                correctVal.toLocaleString(),
                                (correctVal + 200000).toLocaleString(),
                                targetVal.toLocaleString(),
                                (correctVal - 100000).toLocaleString()
                            ].sort();
                            explanation = `Nilai ${chosenVar} diperoleh dengan menolak ${baseVal.toLocaleString()} daripada ${targetVal.toLocaleString()}, iaitu ${correctVal.toLocaleString()}.`;
                        }
                    } else if (level === 'Sederhana') {
                        // Sederhana: Persamaan melibatkan darab dan bahagi nombor besar
                        if (qNum % 2 === 0) {
                            let multiplier = 2 + (qNum % 6); // 2 hingga 7
                            let singleVal = 800000 + (qNum * 75000);
                            let productVal = multiplier * singleVal;

                        } else {
                            let divisorVal = 3 + (qNum % 5); // 3 hingga 7
                            let baseQuotient = 1200000 + (qNum * 95000);
                            let dividendVal = baseQuotient * divisorVal;

                        }
                    } else {

                            { q: "Apakah nombor perdana terkecil yang bernilai lebih besar daripada 10?", opts: ["11", "13", "15", "17"], ans: "11", exp: "Nombor perdana selepas 10 ialah 11." }
                        ];

                    } else if (subType8 === 1) {

                        ].sort();

            state.activeQuestions = [...topicPool].sort(() => Math.random() - 0.5).slice(0, 20);
            state.currentQuestionIndex = 0;

            state.correctCount = 0;
            state.wrongCount = 0;

        let currentTimer = null;

        function initGameLogic() {
            loadCurrentQuestion();
        }

        function loadCurrentQuestion() {
            if (state.currentQuestionIndex >= state.activeQuestions.length) {
                finishGameSession();
                return;
            }

            state.answeredCurrent = false;
            const q = state.activeQuestions[state.currentQuestionIndex];
            if (!q) return;

            const qNumEl = document.getElementById('hud-q-num');
            const scoreEl = document.getElementById('hud-score');
            const cogEl = document.getElementById('q-cognitive');
            const subEl = document.getElementById('q-subtopic');
            const textEl = document.getElementById('q-text');

            if (qNumEl) qNumEl.innerText = `${state.currentQuestionIndex + 1} / 20`;
            if (scoreEl) scoreEl.innerText = state.score;
            if (cogEl) cogEl.innerText = `Aras: ${q.aras_kognitif}`;
            if (subEl) subEl.innerText = q.subtopik;
            if (textEl) textEl.innerText = q.soalan;

            const icons = {
                "carta_nilai_tempat": "🔢",
                "kad_nombor_juta": "🏷️",
                "carta_cerakinkan_nombor": "📑",
                "carta_pola": "📈",
                "grid_pecahan": "🟧",
                "grid_perpuluhan": "🟦",
                "kad_operasi": "➕",
                "kotak_anu": "❓",
                "carta_faktor": "⭐",
                "situasi_kehidupan_sebenar": "🏫"
            };
            const diagIcon = document.getElementById('diagram-icon');
            const diagTitle = document.getElementById('diagram-title');
            if (diagIcon) diagIcon.innerText = icons[q.gambarajah] || "📊";
            if (diagTitle) diagTitle.innerText = `Rajah KPM: ${q.gambarajah.replaceAll('_', ' ').toUpperCase()}`;

            const container = document.getElementById('options-container');
            if (container) {
                container.innerHTML = "";

                if (q.jenis === 'Isi Tempat Kosong') {
                    container.innerHTML = `
                        <div class="sm:col-span-2 space-y-3">
                            <input type="text" id="fill-blank-input" placeholder="Taip jawapan anda di sini..." class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-slate-800 text-center text-lg focus:outline-none focus:border-blue-600">
                            <button onclick="submitFillBlank('${q.jawapan}')" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-extrabold rounded-xl shadow-lg transition">
                                Semak Jawapan ➔
                            </button>
                        </div>
                    `;
                } else {
                    q.pilihan.forEach((opt, idx) => {
                        const btn = document.createElement('button');
                        btn.className = "p-4 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-2xl font-bold text-slate-800 text-left transition flex items-center justify-between group";
                        btn.innerHTML = `<span>${opt}</span> <span class="w-6 h-6 rounded-full bg-slate-200 group-hover:bg-blue-600 group-hover:text-white flex items-center justify-center text-xs transition">${String.fromCharCode(65 + idx)}</span>`;
                        btn.onclick = () => checkAnswer(opt, q.jawapan, q.penerangan);
                        container.appendChild(btn);
                    });
                }
            }

            const feedbackBox = document.getElementById('feedback-box');
            const nextBtn = document.getElementById('next-btn');
            if (feedbackBox) feedbackBox.classList.add('hidden');
            if (nextBtn) nextBtn.classList.add('hidden');

            const timerContainer = document.getElementById('timer-container');
            const hudTimer = document.getElementById('hud-timer');
            if (state.selectedTimeMode > 0) {
                if (timerContainer) timerContainer.classList.remove('hidden');
                state.timeLeft = state.selectedTimeMode;
                if (hudTimer) hudTimer.innerText = state.timeLeft;
                if (currentTimer) clearInterval(currentTimer);
                currentTimer = setInterval(() => {
                    state.timeLeft--;
                    if (hudTimer) hudTimer.innerText = state.timeLeft;
                    if (state.timeLeft <= 0) {
                        clearInterval(currentTimer);
                        if (!state.answeredCurrent) {
                            handleTimeOut(q.jawapan, q.penerangan);
                        }
                    }
                }, 1000);
            } else {
                if (timerContainer) timerContainer.classList.add('hidden');
            }
        }

        function checkAnswer(selected, correct, explanation) {
            if (state.answeredCurrent) return;
            state.answeredCurrent = true;
            if (currentTimer) clearInterval(currentTimer);

            const isCorrect = (selected.toString().trim() === correct.toString().trim());
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');
            const nextBtn = document.getElementById('next-btn');
            const scoreEl = document.getElementById('hud-score');

            if (feedbackBox) feedbackBox.classList.remove('hidden');

            if (isCorrect) {
                state.correctCount++;
                state.score += 5;
                if (feedbackBox) feedbackBox.className = "p-4 rounded-2xl border bg-emerald-50 border-emerald-200 text-emerald-900";
                if (feedbackTitle) feedbackTitle.innerHTML = "🎉 TAHNIAH! JAWAPAN BETUL! (+5 MARKAH)";
                if (feedbackDesc) feedbackDesc.innerHTML = `${explanation}`;
                try {
                    confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
                } catch(e) {}
            } else {
                state.wrongCount++;
                if (feedbackBox) feedbackBox.className = "p-4 rounded-2xl border bg-rose-50 border-rose-200 text-rose-900";
                if (feedbackTitle) feedbackTitle.innerHTML = "❌ CUBA LAGI! JAWAPAN SALAH";
                if (feedbackDesc) feedbackDesc.innerHTML = `✅ <strong>Jawapan yang betul:</strong> ${correct}<br><br>${explanation}`;
            }

            if (scoreEl) scoreEl.innerText = state.score;
            if (nextBtn) nextBtn.classList.remove('hidden');
        }

        function submitFillBlank(correct) {
            const input = document.getElementById('fill-blank-input');
            if (!input) return;
            checkAnswer(input.value, correct, "Pastikan pengiraan dibuat dengan teliti mengikut langkah KPM.");
        }

        function handleTimeOut(correct, explanation) {
            if (state.answeredCurrent) return;
            state.answeredCurrent = true;
            state.wrongCount++;

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackDesc = document.getElementById('feedback-desc');
            const nextBtn = document.getElementById('next-btn');

            if (feedbackBox) {
                feedbackBox.classList.remove('hidden');
                feedbackBox.className = "p-4 rounded-2xl border bg-amber-50 border-amber-200 text-amber-900";
            }
            if (feedbackTitle) feedbackTitle.innerHTML = "⏱ MASA TAMAT! (Dikira Salah)";
            if (feedbackDesc) feedbackDesc.innerHTML = `✅ <strong>Jawapan yang betul:</strong> ${correct}<br><br>${explanation}`;
            if (nextBtn) nextBtn.classList.remove('hidden');
        }

        function nextQuestion() {
            state.currentQuestionIndex++;
            loadCurrentQuestion();
        }

        function finishGameSession() {
            if (currentTimer) clearInterval(currentTimer);
            if (state.currentUser) {
                state.currentUser.progress.totalAnswered += 20;
                state.currentUser.progress.totalCorrect += state.correctCount;
                state.currentUser.progress.totalScore += state.score;
                state.currentUser.progress.levelsCompleted += 1;
                saveUsers();
            }
            router.navigate('summary');
        }

                                            ${state.currentUser && u.username === state.currentUser.username ? '<span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full font-bold">Anda</span>' : ''}
                                        </div>
                                        <div class="text-xs text-slate-500 mt-0.5">Tahap selesai: ${u.progress.levelsCompleted} | Betul: ${u.progress.totalCorrect}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-xl font-extrabold text-amber-600">${u.progress.totalScore}</div>
                                    <div class="text-xs text-slate-400 font-semibold">Markah</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>`;
        }

        function renderSettingsView() {
            if (!state.currentUser) return '';
            return `
            <div class="flex-1 max-w-2xl mx-auto w-full space-y-6">
                <div class="bg-white p-6 rounded-3xl game-card-shadow border border-slate-100 flex items-center justify-between">
                    <div>
                        <span class="bg-slate-100 text-slate-700 text-xs font-bold px-3 py-1 rounded-full uppercase">Tetapan Sistem</span>
                        <h2 class="text-2xl font-extrabold text-slate-900 mt-1">Pengurusan Akaun & Tetapan</h2>
                    </div>
                    <button onclick="router.navigate('home')" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm">← Utama</button>
                </div>

                <div class="bg-white p-8 rounded-3xl game-card-shadow border border-slate-100 space-y-6">
                    <div>
                        <h3 class="font-bold text-slate-800 mb-3">👤 Akaun Aktif Semasa</h3>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border border-slate-100">
                            <div class="flex items-center space-x-3">
                                <span class="text-3xl">${state.currentUser.avatar}</span>
                                <div>
                                    <div class="font-extrabold text-slate-900">${state.currentUser.username}</div>
                                    <div class="text-xs text-slate-500">ID Sesi Pelajar Aktif</div>
                                </div>
                            </div>
                            <button onclick="authSystem.logout()" class="px-4 py-2 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-sm transition">
                                Tukar Akaun
                            </button>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-6">
                        <h3 class="font-bold text-slate-800 mb-3">📱 Kawalan Pandangan & Skrin</h3>
                        <div class="flex gap-3">
                            <button onclick="toggleOrientationView()" class="flex-1 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl text-sm transition">
                                🔄 Tukar Mod Skrin Desktop / Tablet
                            </button>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-6">
                        <h3 class="font-bold text-slate-800 mb-3">🗑 Set Semula Data Progress</h3>
                        <button onclick="authSystem.resetData()" class="w-full py-3 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-xl text-sm transition">
                            Padam Rekod Progress Pelajar Ini
                        </button>
                    </div>
                </div>
            </div>`;
        }

        const authSystem = {
            loginSelected() {
                const select = document.getElementById('login-user-select');
                if (!select) return;
                const uname = select.value;
                const found = state.usersList.usersList ? state.usersList.find(u => u.username === uname) : state.usersList.find(u => u.username === uname);
                if (found) {
                    state.currentUser = found;
                    router.navigate('home');
                }
            },
            registerNew() {
                const input = document.getElementById('new-username');
                if (!input) return;
                const uname = input.value.trim();
                if (!uname) {
                    showModal("Ralat Pendaftaran", "Sila masukkan nama pengguna yang sah.", "⚠️");
                    return;
                }
                if (state.usersList.some(u => u.username.toLowerCase() === uname.toLowerCase())) {
                    showModal("Nama Sudah Wujud", "Sila pilih nama pengguna yang lain.", "⚠️");
                    return;
                }
                const avatars = ["👦", "👧", "🦊", "🦁", "🐼", "🐯", "🐰"];
                const newU = {
                    username: uname,
                    avatar: avatars[Math.floor(Math.random() * avatars.length)],
                    progress: { topicsCompleted: 0, totalAnswered: 0, totalCorrect: 0, totalScore: 0, levelsCompleted: 0, topicRecords: {} }
                };
                state.usersList.push(newU);
                state.currentUser = newU;
                saveUsers();
                router.navigate('home');
            },
            logout() {
                router.navigate('login');
            },
            resetData() {
                if (state.currentUser) {
                    state.currentUser.progress = { topicsCompleted: 0, totalAnswered: 0, totalCorrect: 0, totalScore: 0, levelsCompleted: 0, topicRecords: {} };
                    saveUsers();
                    router.navigate('home');
                    showModal("Berjaya", "Data progress telah ditetapkan semula.", "🔄");
                }
            }
        };

        function toggleOrientationView() {
            const appEl = document.getElementById('app');
            if (appEl) {
                if (appEl.classList.contains('max-w-2xl')) {
                    appEl.classList.remove('max-w-2xl');
                    appEl.classList.add('max-w-7xl');
                    showModal("Mod Desktop Interaktif", "Paparan skrin telah diubah kepada mod lebar penuh desktop.", "💻");
                } else {
                    appEl.classList.remove('max-w-7xl');
                    appEl.classList.add('max-w-2xl');
                    showModal("Mod Peranti / Tablet", "Paparan skrin telah diubah kepada mod fokus peranti.", "📱");
                }
            }
        }

        window.onload = function() {
            initAppStorage();
            if (state.currentUser) {
                router.navigate('home');
            } else {
                router.navigate('login');
            }
        };
    </script>
</body>
</html>
