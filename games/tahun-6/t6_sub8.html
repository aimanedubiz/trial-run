            startGameSession(timeLimit) {
                APP_STATE.gameSettings.timeLimit = timeLimit;
                const { topic, difficulty } = APP_STATE.gameSettings;
                
                // Get questions from bank and pick random 20
                const bank = QUESTION_BANK[topic][difficulty];
                // Shuffle array
                const shuffled = [...bank].sort(() => 0.5 - Math.random());
                APP_STATE.session = {
                    questions: shuffled.slice(0, 20),
                    currentIndex: 0,
                    score: 0,
                    correctCount: 0,
                    wrongCount: 0,
                    startTime: Date.now(),
                    timerInterval: null,
                    timeLeft: timeLimit,
                    userAnswers: []
                };

                this.renderGameScreen();
            },

                    return;

                const q = session.questions[session.currentIndex];
                const container = document.getElementById('app-container');
                
                // Progress percentage

                container.innerHTML = `

                                </span>
                                ${APP_STATE.gameSettings.timeLimit > 0 ? `

                                        <i class="fa-solid fa-clock"></i> <span id="time-left-val">${session.timeLeft}</span>s
                                    </span>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-900 h-2 rounded-full mb-6 overflow-hidden border border-slate-700">
                            <div class="bg-gradient-to-r from-indigo-500 to-pink-500 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                        </div>

                        <!-- Question Card -->
                        <div class="bg-slate-900/90 border border-slate-700 rounded-3xl p-6 sm:p-8 shadow-xl mb-6">
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-[11px] font-extrabold uppercase text-indigo-400 bg-indigo-950 px-3 py-1 rounded-lg border border-indigo-800">
                                    ${q.topic} • ${q.sub}
                                </span>
                                <span class="text-[11px] font-bold text-emerald-400 uppercase">5 Markah</span>
                            </div>
                            
                            <h3 class="text-lg sm:text-xl font-bold text-white mb-6 leading-relaxed">
                                ${q.question}
                            </h3>

                            <!-- Chart / Probability Graphic Visual (Canvas or SVG) -->
                            ${this.renderVisualAsset(q)}

                            <!-- Options -->
                            <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-6">
                                ${q.options.map((opt, idx) => `
                                    <button onclick="app.submitAnswer('${opt.replace(/'/g, "\\'")}')" class="option-btn p-4 bg-slate-800 hover:bg-indigo-600/30 border border-slate-700 hover:border-indigo-500 rounded-2xl text-left font-semibold text-white transition flex items-center justify-between group shadow-md">
                                        <span class="text-sm">${opt}</span>
                                        <span class="w-6 h-6 rounded-full bg-slate-700 group-hover:bg-indigo-600 flex items-center justify-center text-xs text-slate-300 group-hover:text-white font-bold transition">
                                            ${String.fromCharCode(65 + idx)}
                                        </span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Navigation Bar inside game -->
                        <div class="flex justify-between items-center">
                            <button onclick="app.showTopicSelect()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-semibold transition text-slate-300 flex items-center gap-2">

                        </div>
                    </div>
                `;

                // Start timer if enabled
                if (APP_STATE.gameSettings.timeLimit > 0) {
                    this.startTimer();
                }
            },

            renderVisualAsset(q) {
                if (q.chartData && q.chartData.type === 'prob') {
                    // Probability visual icon
                    let iconHtml = '<i class="fa-solid fa-dice text-4xl text-indigo-400 mb-2"></i>';
                    if (q.sub.includes('Syiling')) iconHtml = '<i class="fa-solid fa-coins text-4xl text-yellow-400 mb-2"></i>';
                    if (q.sub.includes('Bola')) iconHtml = '<i class="fa-solid fa-bowling-ball text-4xl text-pink-400 mb-2"></i>';
                    if (q.sub.includes('Dadu')) iconHtml = '<i class="fa-solid fa-dice-six text-4xl text-emerald-400 mb-2"></i>';

                    return `
                        <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 mb-6 flex flex-col items-center justify-center text-center">
                            ${iconHtml}
                            <p class="text-xs text-indigo-200 font-semibold uppercase tracking-wider">Situasi Kebolehjadian Kehidupan Harian</p>
                        </div>
                    `;
                } else if (q.chartData && q.chartData.angles) {
                    // Render SVG Pie Chart
                    const angles = q.chartData.angles;
                    const labels = q.chartData.labels;
                    const colors = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6'];
                    
                    let cumulativeAngle = 0;
                    let svgSectors = '';

                    angles.forEach((ang, idx) => {
                        const startAngle = cumulativeAngle;
                        const endAngle = cumulativeAngle + ang;
                        cumulativeAngle = endAngle;

                        // SVG arc calculation for 150x150 circle (radius 60, center 75,75)
                        const x1 = 75 + 60 * Math.cos((startAngle - 90) * Math.PI / 180);
                        const y1 = 75 + 60 * Math.sin((startAngle - 90) * Math.PI / 180);
                        const x2 = 75 + 60 * Math.cos((endAngle - 90) * Math.PI / 180);
                        const y2 = 75 + 60 * Math.sin((endAngle - 90) * Math.PI / 180);
                        const largeArc = ang > 180 ? 1 : 0;

                        if (ang === 360) {
                            svgSectors += `<circle cx="75" cy="75" r="60" fill="${colors[idx % colors.length]}" />`;
                        } else {
                            const pathData = `M 75 75 L ${x1} ${y1} A 60 60 0 ${largeArc} 1 ${x2} ${y2} Z`;
                            svgSectors += `<path d="${pathData}" fill="${colors[idx % colors.length]}" stroke="#1e293b" stroke-width="2" />`;
                        }
                    });

                    return `
                        <div class="bg-slate-950/60 border border-slate-800 rounded-2xl p-4 mb-6 flex flex-col sm:flex-row items-center justify-center gap-6">
                            <div class="w-36 h-36 relative">
                                <svg viewBox="0 0 150 150" class="w-full h-full drop-shadow-lg">
                                    ${svgSectors}
                                    <circle cx="75" cy="75" r="15" fill="#0f172a" />
                                </svg>
                            </div>
                            <div class="flex flex-col gap-1.5 text-left">
                                <p class="text-xs font-bold text-slate-300 uppercase mb-1"><i class="fa-solid fa-chart-pie text-indigo-400"></i> Legenda Carta Pai:</p>
                                ${labels.map((lbl, idx) => `
                                    <div class="flex items-center gap-2 text-xs text-slate-300">
                                        <span class="w-3 h-3 rounded-full inline-block" style="background-color: ${colors[idx % colors.length]}"></span>
                                        <span class="font-medium">${lbl}: <strong class="text-white">${angles[idx]}°</strong></span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                return '';
            },

            startTimer() {
                if (APP_STATE.session.timerInterval) clearInterval(APP_STATE.session.timerInterval);
                APP_STATE.session.timerInterval = setInterval(() => {
                    APP_STATE.session.timeLeft--;
                    const valEl = document.getElementById('time-left-val');
                    if (valEl) valEl.innerText = APP_STATE.session.timeLeft;

                    if (APP_STATE.session.timeLeft <= 0) {
                        clearInterval(APP_STATE.session.timerInterval);
                        this.handleTimeOut();
                    }
                }, 1000);
            },

            handleTimeOut() {
                const session = APP_STATE.session;
                const q = session.questions[session.currentIndex];
                session.wrongCount++;
                session.userAnswers.push({ question: q.question, selected: "Masa Tamat", correct: q.answer, isCorrect: false });

                this.showFeedbackModal(false, "Masa Tamat!", q.answer, q.explanation, () => {
                    this.closeModal();
                    session.currentIndex++;
                    session.timeLeft = APP_STATE.gameSettings.timeLimit;
                    this.renderGameScreen();
                });
            },

            submitAnswer(selectedOpt) {
                if (APP_STATE.session.timerInterval) clearInterval(APP_STATE.session.timerInterval);

                const session = APP_STATE.session;
                const q = session.questions[session.currentIndex];
                const isCorrect = (selectedOpt === q.answer);

                if (isCorrect) {
                    session.score += 5;
                    session.correctCount++;
                    try { confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } }); } catch(e){}
                } else {
                    session.wrongCount++;
                }

                session.userAnswers.push({ question: q.question, selected: selectedOpt, correct: q.answer, isCorrect });

                this.showFeedbackModal(isCorrect, isCorrect ? "BETUL!" : "CUBA LAGI!", q.answer, q.explanation, () => {
                    this.closeModal();
                    session.currentIndex++;
                    session.timeLeft = APP_STATE.gameSettings.timeLimit;
                    this.renderGameScreen();
                });
            },

            showFeedbackModal(isCorrect, title, correctAns, explanation, callback) {
                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');

                content.innerHTML = `
                    <div class="text-center">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 ${isCorrect ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-400 border border-rose-500/40'}">
                            <i class="fa-solid ${isCorrect ? 'fa-check text-3xl' : 'fa-xmark text-3xl'}"></i>
                        </div>
                        <h4 class="text-2xl font-black ${isCorrect ? 'text-emerald-400' : 'text-rose-400'} mb-2">${title}</h4>
                        ${!isCorrect ? `
                            <div class="bg-slate-900 border border-slate-700 rounded-xl p-4 text-left my-4 text-xs space-y-2">
                                <p class="text-slate-400">Jawapan Betul: <strong class="text-emerald-400">${correctAns}</strong></p>
                            </div>
                        ` : ''}
                        <p class="text-xs text-slate-300 leading-relaxed mb-6 bg-slate-900/60 p-3 rounded-xl border border-slate-800 text-left">
                            <strong>Penerangan:</strong> ${explanation}
                        </p>
                        <button id="feedback-next-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition shadow-lg text-white">
                            Seterusnya <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                `;

                modal.classList.remove('hidden');
                document.getElementById('feedback-next-btn').onclick = callback;
            },

            endGameSession() {
                const session = APP_STATE.session;
                const timeTakenSec = Math.floor((Date.now() - session.startTime) / 1000);
                const accuracy = Math.round((session.correctCount / session.questions.length) * 100);

                // Update user stats
                if (APP_STATE.currentUser) {
                    APP_STATE.currentUser.totalScore = (APP_STATE.currentUser.totalScore || 0) + session.score;
                    APP_STATE.currentUser.totalAnswered = (APP_STATE.currentUser.totalAnswered || 0) + session.questions.length;
                    APP_STATE.currentUser.totalCorrect = (APP_STATE.currentUser.totalCorrect || 0) + session.correctCount;
                    APP_STATE.currentUser.totalWrong = (APP_STATE.currentUser.totalWrong || 0) + session.wrongCount;

                    if (!APP_STATE.currentUser.history) APP_STATE.currentUser.history = [];
                    APP_STATE.currentUser.history.push({
                        date: new Date().toLocaleDateString('ms-MY'),
                        topic: APP_STATE.gameSettings.topic,
                        difficulty: APP_STATE.gameSettings.difficulty,
                        score: session.score,
                        correct: session.correctCount,
                        accuracy,
                        timeTaken: timeTakenSec
                    });

                    // Update in global users list
                    const idx = APP_STATE.users.findIndex(u => u.id === APP_STATE.currentUser.id);
                    if (idx !== -1) {
                        APP_STATE.users[idx] = APP_STATE.currentUser;
                    }
                    this.saveUsers();
                }

                try { confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } }); } catch(e){}

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto py-6 text-center">
                        <div class="inline-block p-4 bg-gradient-to-tr from-yellow-500/20 to-pink-500/20 rounded-3xl mb-4 border border-yellow-500/30">
                            <i class="fa-solid fa-trophy text-5xl text-yellow-400"></i>
                        </div>
                        <h3 class="text-3xl font-black text-white mb-2">SESI SELESAI, ${APP_STATE.currentUser ? APP_STATE.currentUser.name.toUpperCase() : 'MURID'}! 🎉</h3>
                        <p class="text-sm text-indigo-300 mb-6">Tahniah kerana berjaya menyelesaikan cabaran Matematik Tahun 6 KSSR.</p>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                            <div class="bg-slate-900 border border-slate-700 p-4 rounded-2xl">
                                <p class="text-xs text-slate-400 uppercase font-semibold">Markah Akhir</p>
                                <p class="text-2xl font-black text-pink-400 mt-1">${session.score} / 100</p>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 p-4 rounded-2xl">
                                <p class="text-xs text-slate-400 uppercase font-semibold">Betul</p>
                                <p class="text-2xl font-black text-emerald-400 mt-1">${session.correctCount} / 20</p>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 p-4 rounded-2xl">
                                <p class="text-xs text-slate-400 uppercase font-semibold">Ketepatan</p>
                                <p class="text-2xl font-black text-indigo-400 mt-1">${accuracy}%</p>
                            </div>
                            <div class="bg-slate-900 border border-slate-700 p-4 rounded-2xl">
                                <p class="text-xs text-slate-400 uppercase font-semibold">Masa</p>
                                <p class="text-2xl font-black text-amber-400 mt-1">${timeTakenSec}s</p>
                            </div>
                        </div>

                        <div class="flex flex-wrap justify-center gap-4">
                            <button onclick="app.startPlay()" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition shadow-lg text-sm flex items-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> Main Lagi
                            </button>
                            <button onclick="app.showTopicSelect()" class="px-6 py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold transition shadow-lg text-sm flex items-center gap-2">
                                <i class="fa-solid fa-book"></i> Pilih Topik Lain
                            </button>
                            <button onclick="app.showProgress()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold transition shadow-lg text-sm flex items-center gap-2">
                                <i class="fa-solid fa-chart-line"></i> Lihat Progress
                            </button>
                            <button onclick="app.showLeaderboard()" class="px-6 py-3 bg-amber-600 hover:bg-amber-500 rounded-xl font-bold transition shadow-lg text-sm flex items-center gap-2">
                                <i class="fa-solid fa-trophy"></i> Leaderboard
                            </button>
                        </div>
                    </div>
                `;
            },

            showProgress() {
                if (!APP_STATE.currentUser) {
                    this.showModal("Log Masuk Diperlukan", "Sila log masuk untuk melihat rekod progress peribadi anda.", () => {
                        this.closeModal();
                        this.showLogin();
                    });
                    return;
                }

                const user = APP_STATE.currentUser;
                const totalAns = user.totalAnswered || 0;
                const totalCorr = user.totalCorrect || 0;
                const accuracy = totalAns > 0 ? Math.round((totalCorr / totalAns) * 100) : 0;

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="max-w-3xl mx-auto py-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-2xl font-black text-white flex items-center gap-2">
                                <i class="fa-solid fa-chart-line text-yellow-400"></i> Rekod Progress & Profil
                            </h3>
                            <button onclick="app.goHome()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-house text-xl"></i></button>
                        </div>

                        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 mb-6 shadow-xl">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-pink-600 flex items-center justify-center font-black text-2xl text-white shadow-lg">
                                    ${user.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h4 class="text-xl font-bold text-white">${user.name}</h4>
                                    <p class="text-xs text-indigo-300">Username: @${user.username}</p>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
                                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                    <p class="text-xs text-slate-400 uppercase font-semibold">Markah Terkumpul</p>
                                    <p class="text-2xl font-black text-pink-400 mt-1">${user.totalScore || 0}</p>
                                </div>
                                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                    <p class="text-xs text-slate-400 uppercase font-semibold">Soalan Dijawab</p>
                                    <p class="text-2xl font-black text-indigo-400 mt-1">${totalAns}</p>
                                </div>
                                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                    <p class="text-xs text-slate-400 uppercase font-semibold">Jawapan Betul</p>
                                    <p class="text-2xl font-black text-emerald-400 mt-1">${totalCorr}</p>
                                </div>
                                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800">
                                    <p class="text-xs text-slate-400 uppercase font-semibold">Peratus Ketepatan</p>
                                    <p class="text-2xl font-black text-yellow-400 mt-1">${accuracy}%</p>
                                </div>
                            </div>

                            <h5 class="text-sm font-bold text-white uppercase tracking-wider mb-3">Sejarah Sesi Permainan</h5>
                            ${user.history && user.history.length > 0 ? `
                                <div class="space-y-2 max-h-60 overflow-y-auto pr-2">
                                    ${user.history.slice().reverse().map(h => `
                                        <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-xs">
                                            <div>
                                                <span class="text-indigo-400 font-bold">Topik ${h.topic} (${h.difficulty})</span>
                                                <p class="text-slate-400 text-[10px]">${h.date} • Masa: ${h.timeTaken}s</p>
                                            </div>
                                            <div class="text-right">
                                                <span class="font-bold text-pink-400">${h.score} Markah</span>
                                                <p class="text-emerald-400 text-[10px]">Betul: ${h.correct}/20 (${h.accuracy}%)</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <p class="text-xs text-slate-400 italic bg-slate-950 p-4 rounded-xl text-center">Tiada sejarah permainan lagi. Jom mula bermain sekarang!</p>
                            `}
                        </div>
                    </div>
                `;
            },

            showLeaderboard() {
                // Sort users by totalScore descending
                const sorted = [...APP_STATE.users].sort((a, b) => (b.totalScore || 0) - (a.totalScore || 0)).slice(0, 10);

                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="max-w-3xl mx-auto py-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-2xl font-black text-white flex items-center gap-2">
                                <i class="fa-solid fa-trophy text-yellow-400"></i> Leaderboard 10 Pemain Teratas
                            </h3>
                            <button onclick="app.goHome()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-house text-xl"></i></button>
                        </div>

                        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 shadow-xl overflow-hidden">
                            ${sorted.length > 0 ? `
                                <div class="space-y-3">
                                    ${sorted.map((u, idx) => `
                                        <div class="bg-slate-950 border ${idx === 0 ? 'border-yellow-500/50 bg-yellow-500/5' : 'border-slate-800'} p-4 rounded-2xl flex items-center justify-between">
                                            <div class="flex items-center gap-4">
                                                <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-sm ${idx === 0 ? 'bg-yellow-500 text-slate-950' : idx === 1 ? 'bg-slate-300 text-slate-950' : idx === 2 ? 'bg-amber-700 text-white' : 'bg-slate-800 text-indigo-300'}">
                                                    #${idx + 1}
                                                </div>
                                                <div>
                                                    <h4 class="text-sm font-bold text-white">${u.name}</h4>
                                                    <p class="text-[10px] text-slate-400">Soalan dijawab: ${u.totalAnswered || 0}</p>
                                                </div>
                                            </div>
                                            <div class="text-right">
                                                <p class="text-base font-black text-pink-400">${u.totalScore || 0} <span class="text-xs text-slate-400 font-normal">markah</span></p>
                                                <p class="text-xs text-emerald-400 font-semibold">${u.totalAnswered ? Math.round(((u.totalCorrect || 0) / u.totalAnswered) * 100) : 0}% ketepatan</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            ` : `
                                <p class="text-xs text-slate-400 italic text-center py-8">Tiada rekod pemain lagi dalam leaderboard.</p>
                            `}
                        </div>
                    </div>
                `;
            },

            showSettings() {
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="max-w-md mx-auto py-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-2xl font-black text-white flex items-center gap-2">
                                <i class="fa-solid fa-gear text-slate-400"></i> Tetapan Game
                            </h3>
                            <button onclick="app.goHome()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-house text-xl"></i></button>
                        </div>
                        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 space-y-4 shadow-xl">
                            <div>
                                <h4 class="text-sm font-bold text-white mb-1">Mod Paparan Responsif</h4>
                                <p class="text-xs text-slate-400">Game ini dioptimumkan sepenuhnya untuk mod Portrait dan Landscape merentasi Komputer, Tablet, serta Telefon Pintar.</p>
                            </div>
                            <hr class="border-slate-800">
                            <div>
                                <h4 class="text-sm font-bold text-white mb-1">Kurikulum KPM</h4>
                                <p class="text-xs text-slate-400">Selaras dengan KSSR Semakan Matematik Tahun 6 KPM (Topik 8.0 Pengurusan Data & Kebolehjadian).</p>
                            </div>
                            <hr class="border-slate-800">
                            <div class="pt-2">
                                <button onclick="app.goHome()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition shadow-lg text-sm">Kembali ke Menu Utama</button>
                            </div>
                        </div>
                    </div>
                `;
            },

            showModal(title, message, callback) {
                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                content.innerHTML = `
                    <h4 class="text-xl font-black text-white mb-2">${title}</h4>
                    <p class="text-xs text-slate-300 mb-6 leading-relaxed">${message}</p>
                    <button id="modal-ok-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition shadow-lg text-white text-sm">OK</button>
                `;
                modal.classList.remove('hidden');
                document.getElementById('modal-ok-btn').onclick = callback;
            },

            closeModal() {
                document.getElementById('modal-container').classList.add('hidden');
            }
        };

        // Initialize App on Window Load
        window.onload = function() {
            app.init();
        };
    </script>
</body>
</html>
