<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 flex flex-col select-none">

    <div id="app" class="flex-1 flex flex-col max-w-5xl mx-auto w-full p-4 md:p-6 justify-between">
        
        <header id="main-header" class="hidden bg-white/90 backdrop-blur-md rounded-2xl p-4 shadow-md mb-4 flex flex-wrap items-center justify-between gap-4 border border-indigo-100">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-blue-500 to-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg font-game text-xl">
                    🎮
                </div>
                <div>
                    <h1 class="font-game font-bold text-base md:text-lg text-indigo-900 leading-tight">MATH KIDS <span class="text-pink-500">EDU KIDZ</span></h1>
                    <p class="text-[11px] text-slate-500 font-medium">Tahun 4 • KSSR Matematik</p>
                </div>
            </div>

            <!-- Player Status & Quick Navigation -->
            <div class="flex items-center gap-3 flex-wrap">
                <div id="player-badge" class="hidden bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-xl flex items-center gap-2">
                    <span id="nav-avatar" class="text-lg">👦</span>
                    <div>
                        <p id="nav-username" class="text-xs font-bold text-indigo-900 leading-none">Nama</p>

                <div class="flex items-center gap-1.5">
                    <button onclick="navigateTo('home')" title="Menu Utama" class="p-2.5 bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded-xl transition flex items-center justify-center shadow-sm">

                    <button onclick="navigateTo('topics')" title="Topik" class="p-2.5 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-xl transition flex items-center justify-center shadow-sm">
                        <i class="fa-solid fa-book-open"></i>
                    </button>
                    <button onclick="navigateTo('progress')" title="Progress" class="p-2.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-xl transition flex items-center justify-center shadow-sm">

                    <button onclick="navigateTo('leaderboard')" title="Leaderboard" class="p-2.5 bg-amber-100 hover:bg-amber-200 text-amber-700 rounded-xl transition flex items-center justify-center shadow-sm">

        <main id="view-container" class="flex-1 flex flex-col justify-center">

        <footer class="mt-6 text-center text-xs text-slate-400 font-medium py-2">
            MATH KIDS – EDU KIDZ &copy; 2026 • KSSR Matematik Tahun 4 Malaysia (Koordinat, Nisbah & Kadaran)
        </footer>

    </div>

    <!-- Modal Box -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border-4 border-indigo-100 transform transition-all text-center">
            <div id="modal-icon" class="text-4xl mb-3">🎉</div>
            <h3 id="modal-title" class="font-game font-bold text-2xl text-slate-800 mb-2">Tajuk Modal</h3>
            <p id="modal-message" class="text-slate-600 text-sm mb-6 leading-relaxed whitespace-pre-line">Mesej kandungan dipaparkan di sini.</p>
            <div id="modal-actions" class="flex gap-3 justify-center">
                <button onclick="closeModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-game px-6 py-2.5 rounded-xl shadow-lg transition">OK</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let usersList = JSON.parse(localStorage.getItem('mathkids_users') || '[]');
        let currentView = 'welcome';
        let currentGameSession = {
            topicId: null,
            topicName: '',
            difficulty: null,
            timerMode: 30,
            questions: [],
            currentIndex: 0,
            score: 0,
            correctCount: 0,
            wrongCount: 0,
            timerInterval: null,
            timeLeft: 0,
            answersLog: []
        };

        let questionBank = [];

        function initQuestionBank() {
            if (questionBank.length > 0) return;

            // TOPIC 1: Kenal dan Tentukan Koordinat (60 unique questions)
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 10 ? 'Mengingat' : i <= 40 ? 'Memahami' : 'Mengaplikasi';
                let x = ((i * 3) % 5) + 1;
                let y = ((i * 7) % 5) + 1;
                if (x === y) y = (y % 5) + 1;

                let qText = "";
                let options = [];
                let correctAns = "";
                let explanation = "";
                let labels = ['A', 'B', 'C', 'P', 'Q', 'R', 'S', 'T'];
                let lbl = labels[i % labels.length];

                if (diff === 'Senang') {
                    qText = `Berdasarkan grid koordinat di atas, apakah koordinat bagi titik ${lbl} yang terletak pada lajur dan baris tersebut?`;
                    let wrong1 = `(${y},${x})`;
                    let wrong2 = `(${x+1 > 5 ? 1 : x+1},${y})`;
                    let wrong3 = `(${x},${y+1 > 5 ? 1 : y+1})`;
                    options = [`(${x},${y})`, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5);
                    correctAns = `(${x},${y})`;
                    explanation = `Koordinat titik ${lbl} ditulis dalam bentuk (x, y). Nilai x (melintang) dibaca dahulu iaitu ${x}, diikuti nilai y (menegak) iaitu ${y}.`;
                } else if (diff === 'Sederhana') {
                    qText = `Jika asalan O ialah (0,0), tentukan koordinat bagi objek ${lbl} dengan mengira jarak dari paksi-x dan paksi-y pada grid di atas.`;
                    let wrong1 = `(${y},${x})`;
                    let wrong2 = `(${x > 1 ? x-1 : x+1},${y})`;
                    let wrong3 = `(${x},${y > 1 ? y-1 : y+1})`;
                    options = [`(${x},${y})`, wrong1, wrong2, wrong3].sort(() => Math.random() - 0.5);
                    correctAns = `(${x},${y})`;
                    explanation = `Paksi-x menunjukkan nilai ${x} dan paksi-y menunjukkan nilai ${y}. Oleh itu, koordinat titik ${lbl} ialah (${x},${y}).`;
                } else {
                    let moveX = (i % 2) + 1;
                    let moveY = ((i + 1) % 2) + 1;
                    qText = `Titik ${lbl} terletak pada koordinat (${x}, ${y}). Jika titik ${lbl} digerakkan ${moveX} unit ke kanan dan ${moveY} unit ke atas pada grid, apakah koordinat baharu?`;
                    let nx = x + moveX;
                    let ny = y + moveY;
                    options = [`(${nx},${ny})`, `(${x},${ny})`, `(${nx},${y})`, `(${nx+1},${ny+1})`].sort(() => Math.random() - 0.5);
                    correctAns = `(${nx},${ny})`;
                    explanation = `Nilai x asal ${x} ditambah ${moveX} menjadi ${nx}. Nilai y asal ${y} ditambah ${moveY} menjadi ${ny}. Koordinat baharu ialah (${nx},${ny}).`;
                }

                questionBank.push({
                    id: `K4-KOOR-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Kenal dan Tentukan Koordinat',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Objektif',
                    question: qText,
                    visualType: 'grid',
                    visualData: { x: x, y: y, label: lbl },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: explanation
                });
            }

            // TOPIC 2: Tanda Titik Koordinat (60 unique questions)
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 15 ? 'Mengingat' : i <= 45 ? 'Memahami' : 'Mengaplikasi';
                let cx = ((i * 2) % 4) + 1;
                let cy = ((i * 5) % 4) + 1;
                let labels2 = ['P', 'Q', 'R', 'S', 'T', 'K', 'L', 'M'];
                let lbl2 = labels2[i % labels2.length];
                let qText = "";
                let options = [];
                let correctAns = "";

                if (diff === 'Senang') {
                    qText = `Pilih kedudukan titik ${lbl2} yang betul pada koordinat (${cx}, ${cy}) di atas grid.`;
                    options = [`Koordinat (${cx},${cy}) pada grid`, `Koordinat (${cy},${cx})`, `Koordinat (${cx+1},${cy})`, `Koordinat (${cx},${cy+1})`].sort(() => Math.random() - 0.5);
                    correctAns = `Koordinat (${cx},${cy}) pada grid`;
                } else if (diff === 'Sederhana') {
                    qText = `Antara berikut, manakah titik ${lbl2} yang mewakili koordinat (${cx}, ${cy}) dengan tepat pada grid koordinat di atas?`;
                    options = [`Titik ${lbl2} pada (${cx},${cy})`, `Titik ${lbl2} pada (${cy},${cx})`, `Titik ${lbl2} pada (${cx+1},${cy})`, `Titik ${lbl2} pada (0,${cy})`].sort(() => Math.random() - 0.5);
                    correctAns = `Titik ${lbl2} pada (${cx},${cy})`;
                } else {
                    qText = `Tandakan titik ${lbl2} pada koordinat (${cx}, ${cy}). Berapakah jumlah nilai koordinat (x + y) bagi titik tersebut?`;
                    let sumXY = cx + cy;
                    options = [`${sumXY} unit`, `${cx} unit`, `${cy} unit`, `${sumXY + 2} unit`].sort(() => Math.random() - 0.5);
                    correctAns = `${sumXY} unit`;
                }

                questionBank.push({
                    id: `K4-TANDA-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Tanda Titik Koordinat',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Objektif',
                    question: qText,
                    visualType: 'grid',
                    visualData: { x: cx, y: cy, label: lbl2 },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: `Titik koordinat (x, y) ditandakan dengan mencari nilai pada paksi-x (${cx}) terlebih dahulu, kemudian bergerak ke nilai pada paksi-y (${cy}).`
                });
            }

            // TOPIC 3: Nisbah (60 unique questions)
            const itemsList = [
                {a: 'epal', b: 'oren', iconA: '🍎', iconB: '🍊'},
                {a: 'buku', b: 'pensel', iconA: '📚', iconB: '✏️'},
                {a: 'bola biru', b: 'bola merah', iconA: '🔵', iconB: '🔴'},
                {a: 'gula-gula', b: 'biskut', iconA: '🍬', iconB: '🍪'},
                {a: 'bunga merah', b: 'bunga kuning', iconA: '🌸', iconB: '🌻'},
                {a: 'kereta', b: 'bas', iconA: '🚗', iconB: '🚌'}
            ];
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 15 ? 'Mengingat' : i <= 45 ? 'Memahami' : 'Mengaplikasi';
                let item = itemsList[i % itemsList.length];
                let numA = ((i * 3) % 4) + 2;
                let numB = ((i * 5) % 5) + 2;
                let qText = "";
                let options = [];
                let correctAns = `${numA} kepada ${numB}`;

                if (diff === 'Senang') {
                    qText = `Berdasarkan gambar rajah objek ${item.a} dan ${item.b} di atas, apakah nisbah bilangan ${item.a} kepada bilangan ${item.b}?`;
                    options = [`${numA} kepada ${numB}`, `${numB} kepada ${numA}`, `${numA} kepada ${numA+numB}`, `${numB} kepada ${numA+numB}`].sort(() => Math.random() - 0.5);
                    correctAns = `${numA} kepada ${numB}`;
                } else if (diff === 'Sederhana') {
                    let mult = (i % 2) + 2;
                    let tA = numA * mult;
                    let tB = numB * mult;
                    qText = `Terdapat ${tA} buah ${item.a} dan ${tB} buah ${item.b} di dalam bakul. Nyatakan nisbah dalam bentuk ringkas ${item.a} kepada ${item.b}.`;
                    options = [`${numA} kepada ${numB}`, `${numB} kepada ${numA}`, `${tA} kepada ${tB}`, `1 kepada 1`].sort(() => Math.random() - 0.5);
                    correctAns = `${numA} kepada ${numB}`;
                } else {
                    qText = `Nisbah bilangan ${item.a} kepada ${item.b} ialah ${numA}:${numB}. Jika terdapat ${numA * 2} buah ${item.a}, berapakah bilangan ${item.b}?`;
                    let ansB = numB * 2;
                    options = [`${ansB}`, `${numA * 2}`, `${ansB + 2}`, `${ansB - 1}`].sort(() => Math.random() - 0.5);
                    correctAns = `${ansB}`;
                }

                questionBank.push({
                    id: `K4-NISB-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Nisbah',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Objektif',
                    question: qText,
                    visualType: 'ratio',
                    visualData: { countA: numA, countB: numB, iconA: item.iconA, iconB: item.iconB, labelA: item.a, labelB: item.b },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: `Nisbah membandingkan kuantiti ${item.a} (${numA}) kepada ${item.b} (${numB}). Susunan jawapan mestilah mengikut tertib yang diminta dalam soalan.`
                });
            }

            // TOPIC 4: KADARAN (REFINED & FULLY UNIQUE 60 QUESTIONS: 20 Senang, 20 Sederhana, 20 Susah)
            const kadaranItems = [
                {name: 'Pensel', icon: '✏️', unitName: 'batang'},
                {name: 'Buku Latihan', icon: '📘', unitName: 'buah'},
                {name: 'Botol Air Mineral', icon: '🍼', unitName: 'botol'},
                {name: 'Peket Biskut', icon: '🍪', unitName: 'peket'},
                {name: 'Epal Merah', icon: '🍎', unitName: 'biji'},
                {name: 'Pen Merah', icon: '✒️', unitName: 'batang'},
                {name: 'Kotak Pensel Warna', icon: '🎨', unitName: 'kotak'},
                {name: 'Buku Cerita', icon: '📚', unitName: 'naskhah'}
            ];

            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 15 ? 'Mengingat' : i <= 45 ? 'Memahami' : 'Mengaplikasi';
                let item = kadaranItems[i % kadaranItems.length];
                
                // Completely unique mathematical parameters to prevent any repetition
                let unitPrice = ((i * 3) % 5) + 2; // price per unit (2 to 6 RM)
                let qText = "";
                let options = [];
                let correctAns = "";
                let explanation = "";

                if (diff === 'Senang') {
                    let givenQty = ((i % 4) + 1); // 1 to 4 units
                    let targetQty = givenQty + ((i % 3) + 1); // 2 to 7 units
                    let targetPrice = unitPrice * targetQty;
                    
                    qText = `Harga bagi ${givenQty} ${item.unitName} ${item.name} ialah RM${unitPrice * givenQty}. Berapakah jumlah harga untuk membeli ${targetQty} ${item.unitName} ${item.name} yang sama?`;
                    
                    let w1 = `RM${targetPrice + unitPrice}`;
                    let w2 = `RM${Math.max(1, targetPrice - unitPrice)}`;
                    let w3 = `RM${targetPrice + (unitPrice * 2)}`;
                    options = [`RM${targetPrice}`, w1, w2, w3].sort(() => Math.random() - 0.5);
                    correctAns = `RM${targetPrice}`;
                    explanation = `Cari harga 1 ${item.unitName} dahulu iaitu RM${unitPrice * givenQty} ÷ ${givenQty} = RM${unitPrice}. Harga untuk ${targetQty} ${item.unitName} ialah ${targetQty} × RM${unitPrice} = RM${targetPrice}.`;

                } else if (diff === 'Sederhana') {
                    let givenQty = ((i % 3) + 2); // 2, 3, 4 units
                    let givenTotal = unitPrice * givenQty;
                    let targetQty = givenQty + 3; // +3 units
                    let targetTotal = unitPrice * targetQty;

                    qText = `Ibu membeli ${givenQty} ${item.unitName} ${item.name} dengan jumlah harga RM${givenTotal}. Menggunakan kaedah unitari, berapakah harga bagi ${targetQty} ${item.unitName} ${item.name}?`;

                    let w1 = `RM${targetTotal + unitPrice}`;
                    let w2 = `RM${Math.abs(targetTotal - (unitPrice * 2))}`;
                    let w3 = `RM${targetTotal + 3}`;
                    options = [`RM${targetTotal}`, w1, w2, w3].sort(() => Math.random() - 0.5);
                    correctAns = `RM${targetTotal}`;
                    explanation = `Kaedah unitari: 1 ${item.unitName} bernilai RM${givenTotal} ÷ ${givenQty} = RM${unitPrice}. Maka, ${targetQty} ${item.unitName} bernilai ${targetQty} × RM${unitPrice} = RM${targetTotal}.`;

                } else {
                    // Susah: Two-step proportions or inverse/complex comparisons
                    let baseQty = 4;
                    let basePrice = unitPrice * baseQty;
                    let multiFactor = ((i % 2) + 2); // 2 or 3
                    let complexQty = baseQty * multiFactor;
                    let complexPrice = basePrice * multiFactor;

                    qText = `Harga bagi ${baseQty} ${item.unitName} ${item.name} ialah RM${basePrice}. Jika Encik Ali mempunyai bajet sebanyak RM${complexPrice + (unitPrice * multiFactor)}, berapakah maksimum ${item.unitName} ${item.name} yang boleh dibeli?`;

                    let maxPossibleQty = complexQty + multiFactor;
                    let w1 = `${maxPossibleQty - 2}`;
                    let w2 = `${maxPossibleQty + 2}`;
                    let w3 = `${maxPossibleQty - 1}`;
                    options = [`${maxPossibleQty}`, w1, w2, w3].sort(() => Math.random() - 0.5);
                    correctAns = `${maxPossibleQty}`;
                    explanation = `Harga 1 ${item.unitName} = RM${basePrice} ÷ ${baseQty} = RM${unitPrice}. Dengan bajet RM${complexPrice + (unitPrice * multiFactor)}, bilangan maksimum ialah (${complexPrice + (unitPrice * multiFactor)}) ÷ RM${unitPrice} = ${maxPossibleQty} ${item.unitName}.`;
                }

                questionBank.push({
                    id: `K4-KADA-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Kadaran',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Objektif',
                    question: qText,
                    visualType: 'proportion',
                    visualData: { price: unitPrice, qty: 3, item: item.name, icon: item.icon },
                    options: options,
                    correct: correctAns,
                    marks: 5,
                    explanation: explanation
                });
            }

            // TOPIC 5: Penyelesaian Masalah (60 unique questions)
            for (let i = 1; i <= 60; i++) {
                let diff = i <= 20 ? 'Senang' : i <= 40 ? 'Sederhana' : 'Susah';
                let aras = i <= 10 ? 'Mengingat' : i <= 40 ? 'Memahami' : 'Mengaplikasi';
                let qText = "";
                let options = [];
                let correctAns = "";
                let explanation = "";

                if (diff === 'Senang') {
                    // Unique coordinate and simple everyday word problems
                    let startX = (i % 4) + 1;
                    let moveX = ((i * 2) % 3) + 2;
                    let endX = startX + moveX;
                    qText = `Siti berada di titik (${startX}, 3) pada grid koordinat dan bergerak ke kanan sejauh ${moveX} unit secara melintang. Apakah koordinat baharu Siti?`;
                    correctAns = `(${endX}, 3)`;
                    let w1 = `(${startX}, ${3 + moveX})`;
                    let w2 = `(${endX - 1}, 3)`;
                    let w3 = `(${endX + 1}, 4)`;
                    options = [correctAns, w1, w2, w3].sort(() => Math.random() - 0.5);
                    explanation = `Pergerakan melintang ke kanan hanya mengubah nilai koordinat x (bertambah). Nilai x baharu ialah ${startX} + ${moveX} = ${endX}. Koordinat baharu ialah (${endX}, 3).`;

                } else if (diff === 'Sederhana') {
                    // Unique ratio word problems
                    let ratioA = (i % 3) + 2; // 2, 3, 4
                    let ratioB = ((i * 2) % 4) + 3; // 3, 4, 5, 6
                    let multiplier = (i % 3) + 2; // 2, 3, 4
                    let totalA = ratioA * multiplier;
                    let totalB = ratioB * multiplier;

                    qText = `Nisbah bilangan pen merah kepada pen biru di dalam sebuah kotak ialah ${ratioA}:${ratioB}. Jika terdapat ${totalA} batang pen merah, berapakah bilangan pen biru di dalam kotak tersebut?`;
                    correctAns = `${totalB} batang`;
                    let w1 = `${totalA} batang`;
                    let w2 = `${totalB + ratioB} batang`;
                    let w3 = `${Math.max(2, totalB - ratioA)} batang`;
                    options = [correctAns, w1, w2, w3].sort(() => Math.random() - 0.5);
                    explanation = `Gunakan konsep nisbah setara. Pen merah bertambah sebanyak ${multiplier} kali ganda (${ratioA} × ${multiplier} = ${totalA}). Maka pen biru juga perlu didarab dengan ${multiplier} (${ratioB} × ${multiplier} = ${totalB}).`;

                } else {
                    // Unique complex unitary method / proportion problem
                    let unitCount = (i % 3) + 3; // 3, 4, 5
                    let unitPrice = ((i * 5) % 4) + 3; // 3, 4, 5, 6 RM per unit
                    let totalCost = unitCount * unitPrice;
                    let targetCount = unitCount + 4; // e.g. +4 units
                    let targetCost = targetCount * unitPrice;

                    qText = `Harga bagi ${unitCount} buah buku latihan ialah RM${totalCost}. Encik Ahmad ingin membeli ${targetCount} buah buku latihan yang sama untuk anaknya. Berapakah jumlah wang yang perlu dibayar?`;
                    correctAns = `RM${targetCost}`;
                    let w1 = `RM${targetCost + unitPrice}`;
                    let w2 = `RM${Math.max(5, targetCost - (unitPrice * 2))}`;
                    let w3 = `RM${totalCost + targetCount}`;
                    options = [correctAns, w1, w2, w3].sort(() => Math.random() - 0.5);
                    explanation = `Cari harga 1 buah buku latihan terlebih dahulu: RM${totalCost} ÷ ${unitCount} = RM${unitPrice}. Seterusnya darab dengan ${targetCount} buah buku: ${targetCount} × RM${unitPrice} = RM${targetCost}.`;
                }

                questionBank.push({
                    id: `K4-PENY-${diff[0].toUpperCase()}-${String(i).padStart(3, '0')}`,
                    topic: 'Penyelesaian Masalah',
                    difficulty: diff,
                    cognitive: aras,
                    type: 'Objektif',
                    question: qText,
                    visualType: 'problem',
                    visualData: { title: 'Penyelesaian Masalah Harian' },
                    options: options,

                });

                        <div class="flex items-center gap-2 text-xs font-bold">
                            <span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-xl border border-indigo-200">⭐ <span id="live-score">${currentGameSession.score}</span></span>
                            ${currentGameSession.timerMode > 0 ? `<span id="live-timer-badge" class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-xl border border-amber-200"><i class="fa-solid fa-clock"></i> <span id="live-timer">${currentGameSession.timeLeft}</span>s</span>` : ''}
                            <span class="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-xl border border-emerald-200">Soalan ${currentGameSession.currentIndex + 1}/20</span>
                        </div>
                    </div>

                    <div class="py-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[10px] font-bold uppercase tracking-wider bg-purple-100 text-purple-700 px-2.5 py-0.5 rounded-full">${q.topic} • ${q.difficulty}</span>
                            <span class="text-[10px] font-bold text-slate-400">Aras: ${q.cognitive} | ID: ${q.id}</span>
                        </div>
                        <h3 class="font-game font-bold text-base md:text-lg text-slate-800 mb-3 leading-snug">${q.question}</h3>

                        <!-- DYNAMIC VISUAL DIAGRAM CANVAS BOX -->
                        <div class="bg-indigo-50/50 border-2 border-indigo-200 rounded-2xl p-3 mb-4 flex flex-col items-center justify-center">
                            <canvas id="visual-canvas" width="360" height="200" class="max-w-full rounded-xl bg-white shadow-inner border border-indigo-100"></canvas>
                        </div>

                        <!-- Options Grid -->
                        <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                            ${q.options.map((opt, idx) => `
                                <button onclick="submitAnswer('${escapeQuotes(opt)}')" class="option-btn text-left p-3 rounded-2xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 font-game text-xs font-bold text-slate-700 transition flex items-center justify-between shadow-sm">
                                    <span><span class="inline-block w-5 h-5 bg-slate-100 text-slate-600 rounded-lg text-center mr-2 text-[10px] leading-5">${String.fromCharCode(65 + idx)}</span> ${opt}</span>
                                    <i class="fa-solid fa-circle-chevron-right text-slate-300 text-xs"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="pt-3 border-t border-slate-100">
                        <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                            <div class="bg-gradient-to-r from-blue-500 to-indigo-600 h-2 rounded-full transition-all duration-300" style="width: ${((currentGameSession.currentIndex + 1) / 20) * 100}%"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderQuestionVisual() {
            const canvas = document.getElementById('visual-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const q = currentGameSession.questions[currentGameSession.currentIndex];
            if (!q) return;

            if (q.visualType === 'grid') {
                const originX = 40, originY = 160, step = 25;
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;

                for (let i = 0; i <= 6; i++) {
                    ctx.beginPath();
                    ctx.moveTo(originX + i * step, 20);
                    ctx.lineTo(originX + i * step, originY);
                    ctx.stroke();
                    if (i > 0) {
                        ctx.fillStyle = '#64748b';
                        ctx.font = '10px Inter';
                        ctx.fillText(i, originX + i * step - 3, originY + 12);
                    }
                }

                for (let j = 0; j <= 6; j++) {
                    ctx.beginPath();
                    ctx.moveTo(originX, originY - j * step);
                    ctx.lineTo(originX + 6 * step, originY - j * step);
                    ctx.stroke();
                    if (j > 0) {
                        ctx.fillStyle = '#64748b';
                        ctx.font = '10px Inter';
                        ctx.fillText(j, originX - 15, originY - j * step + 4);
                    }
                }

                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(originX, originY);
                ctx.lineTo(originX + 160, originY);
                ctx.moveTo(originX, originY);
                ctx.lineTo(originX, originY - 160);
                ctx.stroke();

                ctx.fillStyle = '#334155';
                ctx.font = 'bold 11px Fredoka';
                ctx.fillText('O (0,0)', originX - 35, originY + 12);
                ctx.fillText('x', originX + 165, originY + 4);
                ctx.fillText('y', originX - 4, originY - 165);

                const px = q.visualData.x;
                const py = q.visualData.y;
                const plotX = originX + px * step;
                const plotY = originY - py * step;

                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(plotX, plotY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#1e1b4b';
                ctx.font = 'bold 12px Fredoka';
                ctx.fillText(`${q.visualData.label}(${px},${py})`, plotX + 10, plotY - 5);

            } else if (q.visualType === 'ratio') {
                const d = q.visualData;
                ctx.fillStyle = '#1e1b4b';
                ctx.font = 'bold 12px Fredoka';
                ctx.fillText(`Perbandingan Kuantiti: ${d.countA} ${d.labelA} & ${d.countB} ${d.labelB}`, 20, 30);

                let startX = 30;
                let startY = 60;
                ctx.font = '22px sans-serif';
                for (let i = 0; i < d.countA; i++) {
                    ctx.fillText(d.iconA, startX + (i * 42), startY + 28);
                }
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 11px Fredoka';
                ctx.fillText(`Bilangan ${d.labelA} = ${d.countA}`, startX, startY + 65);

                for (let j = 0; j < d.countB; j++) {
                    ctx.fillText(d.iconB, startX + (j * 42), startY + 110);
                }
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 11px Fredoka';
                ctx.fillText(`Bilangan ${d.labelB} = ${d.countB}`, startX, startY + 145);

            } else if (q.visualType === 'proportion') {
                const d = q.visualData;
                ctx.fillStyle = '#1e1b4b';
                ctx.font = 'bold 13px Fredoka';
                ctx.fillText(`Kaedah Unitari & Kadaran Harga`, 20, 30);

                ctx.fillStyle = '#f59e0b';
                ctx.font = '36px sans-serif';
                ctx.fillText(d.icon || '📦', 40, 95);

                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 14px Fredoka';
                ctx.fillText(`Harga 1 unit ${d.item} = RM${d.price}`, 100, 75);
                ctx.fillStyle = '#64748b';
                ctx.font = '12px Inter';
                ctx.fillText(`Gunakan kaedah unitari untuk cari nilai perkadaran.`, 100, 95);

            } else {
                ctx.fillStyle = '#4f46e5';
                ctx.font = 'bold 14px Fredoka';
                ctx.fillText('🧩 Situasi Matematik Harian KSSR', 30, 80);
                ctx.fillStyle = '#64748b';
                ctx.font = '12px Inter';
                ctx.fillText('Fahami kehendak soalan dan pilih jawapan yang tepat.', 30, 110);
            }
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
        }

        function startGameLoop() {
            if (currentGameSession.timerInterval) clearInterval(currentGameSession.timerInterval);
            if (currentGameSession.timerMode > 0) {
                currentGameSession.timeLeft = currentGameSession.timerMode;
                currentGameSession.timerInterval = setInterval(() => {
                    currentGameSession.timeLeft--;
                    const timerEl = document.getElementById('live-timer');
                    if (timerEl) timerEl.innerText = currentGameSession.timeLeft;
                    if (currentGameSession.timeLeft <= 0) {
                        clearInterval(currentGameSession.timerInterval);
                        handleTimeOut();
                    }
                }, 1000);
            }
        }

        function handleTimeOut() {
            const q = currentGameSession.questions[currentGameSession.currentIndex];
            currentGameSession.wrongCount++;
            currentGameSession.answersLog.push({ questionId: q.id, correct: false, userAns: 'MASA TAMAT', correctAns: q.correct });
            
            showModal('⏰ MASA TAMAT!', `Jawapan yang betul ialah: ${q.correct}\n\n${q.explanation}`, '⚠️');
            setTimeout(() => { closeModal(); nextQuestion(); }, 3000);
        }

        function submitAnswer(userAns) {
            if (currentGameSession.timerInterval) clearInterval(currentGameSession.timerInterval);
            const q = currentGameSession.questions[currentGameSession.currentIndex];
            const isCorrect = (userAns === q.correct);

            if (isCorrect) {
                currentGameSession.score += 5;
                currentGameSession.correctCount++;
                currentGameSession.answersLog.push({ questionId: q.id, correct: true, userAns, correctAns: q.correct });
                showModal('🎉 TAHNIAH!', `Jawapan Anda Betul!\n\n+5 Markah\n\n${q.explanation}`, '✨');
            } else {
                currentGameSession.wrongCount++;
                currentGameSession.answersLog.push({ questionId: q.id, correct: false, userAns, correctAns: q.correct });
                showModal('❌ CUBA LAGI!', `Jawapan yang betul ialah: ${q.correct}\n\n${q.explanation}`, '💡');
            }

            setTimeout(() => { closeModal(); nextQuestion(); }, 2500);
        }

        function nextQuestion() {
            currentGameSession.currentIndex++;
            if (currentGameSession.currentIndex >= 20) {
                finishGameSession();
            } else {
                renderView();
                renderQuestionVisual();
                startGameLoop();
            }
        }

        function finishGameSession() {
            if (currentGameSession.timerInterval) clearInterval(currentGameSession.timerInterval);
            
            currentUser.totalScore = (currentUser.totalScore || 0) + currentGameSession.score;
            currentUser.stats.totalAnswered += 20;
            currentUser.stats.totalCorrect += currentGameSession.correctCount;
            currentUser.stats.totalWrong += currentGameSession.wrongCount;

            if (!currentUser.topicsCompleted) currentUser.topicsCompleted = {};
            currentUser.topicsCompleted[currentGameSession.topicName] = Math.min(100, (currentUser.topicsCompleted[currentGameSession.topicName] || 0) + 20);

            const idx = usersList.findIndex(u => u.playerId === currentUser.playerId);
            if (idx !== -1) {
                usersList[idx] = currentUser;
            }
            localStorage.setItem('mathkids_users', JSON.stringify(usersList));
            localStorage.setItem('mathkids_active_user', JSON.stringify(currentUser));

            navigateTo('result');
        }

        function renderResultView() {
            const accuracy = Math.round((currentGameSession.correctCount / 20) * 100);
            return `
                <div class="max-w-md mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 text-center w-full">
                    <span class="text-5xl">🏆</span>
                    <h2 class="font-game font-bold text-2xl text-indigo-900 mt-2">TAHNIAH ${currentUser.username.toUpperCase()}!</h2>
                    <p class="text-xs text-slate-500 mb-5">Topik ${currentGameSession.topicName} Selesai</p>

                    <div class="bg-indigo-50/70 rounded-2xl p-4 mb-5 space-y-2 text-xs md:text-sm">
                        <div class="flex justify-between font-bold">
                            <span class="text-slate-600">Jumlah Markah:</span>
                            <span class="text-indigo-600 text-base">${currentGameSession.score} / 100</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-600">Jawapan Betul:</span>
                            <span class="text-emerald-600 font-bold">${currentGameSession.correctCount}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-600">Jawapan Salah:</span>
                            <span class="text-rose-600 font-bold">${currentGameSession.wrongCount}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-600">Ketepatan:</span>
                            <span class="text-purple-600 font-bold">${accuracy}%</span>
                        </div>
                    </div>

                    <div class="space-y-2.5">
                        <button onclick="navigateTo('game')" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-game py-3 rounded-xl shadow-lg text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-rotate-right"></i> Main Semula (Soalan Baru)
                        </button>
                        <button onclick="navigateTo('topics')" class="w-full bg-purple-100 text-purple-800 font-game py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-book-open"></i> Pilih Topik Lain
                        </button>
                        <button onclick="navigateTo('leaderboard')" class="w-full bg-amber-100 text-amber-800 font-game py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-trophy"></i> Leaderboard
                        </button>
                        <button onclick="navigateTo('home')" class="w-full bg-slate-100 text-slate-700 font-game py-3 rounded-xl text-xs">
                            Menu Utama
                        </button>
                    </div>
                </div>
            `;
        }

        function renderProgressView() {
            const topics = ['Kenal dan Tentukan Koordinat', 'Tanda Titik Koordinat', 'Nisbah', 'Kadaran', 'Penyelesaian Masalah'];
            const stats = currentUser.stats || { totalAnswered: 0, totalCorrect: 0, totalWrong: 0 };
            const accuracy = stats.totalAnswered > 0 ? Math.round((stats.totalCorrect / stats.totalAnswered) * 100) : 0;

            return `
                <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 w-full">
                    <div class="flex items-center justify-between mb-5">
                        <div>
                            <h2 class="font-game font-bold text-xl md:text-2xl text-indigo-900">📊 PROGRESS SAYA</h2>
                            <p class="text-xs text-slate-500">Statistik ${currentUser.username}</p>
                        </div>
                        <button onclick="navigateTo('home')" class="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-2 rounded-xl">Menu</button>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 mb-5">
                        <div class="bg-indigo-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-indigo-600 font-bold">Markah</p>
                            <p class="font-game font-bold text-xl text-indigo-900 mt-1">${currentUser.totalScore || 0}</p>
                        </div>
                        <div class="bg-emerald-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-emerald-600 font-bold">Betul</p>
                            <p class="font-game font-bold text-xl text-emerald-900 mt-1">${stats.totalCorrect}</p>
                        </div>
                        <div class="bg-rose-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-rose-600 font-bold">Salah</p>
                            <p class="font-game font-bold text-xl text-rose-900 mt-1">${stats.totalWrong}</p>
                        </div>
                        <div class="bg-purple-50 p-3 rounded-2xl text-center">
                            <p class="text-[11px] text-purple-600 font-bold">Ketepatan</p>
                            <p class="font-game font-bold text-xl text-purple-900 mt-1">${accuracy}%</p>
                        </div>
                    </div>

                    <div class="space-y-3">
                        <h3 class="font-game font-bold text-slate-800 text-xs uppercase">Pencapaian Mengikut Topik</h3>
                        ${topics.map(t => {
                            const pct = currentUser.topicsCompleted?.[t] || 0;
                            return `
                                <div>
                                    <div class="flex justify-between text-xs font-bold text-slate-700 mb-1">
                                        <span>${t}</span>
                                        <span>${pct}% Selesai</span>
                                    </div>
                                    <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                                        <div class="bg-gradient-to-r from-indigo-500 to-pink-500 h-2.5 rounded-full" style="width: ${pct}%"></div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderLeaderboardView() {
            const sortedUsers = [...usersList].sort((a,b) => (b.totalScore || 0) - (a.totalScore || 0));

            return `
                <div class="max-w-xl mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 w-full">
                    <div class="flex items-center justify-between mb-5">
                        <div>
                            <h2 class="font-game font-bold text-xl md:text-2xl text-indigo-900">🏆 LEADERBOARD</h2>
                            <p class="text-xs text-slate-500">Papan Kedudukan Pemain Terbaik</p>
                        </div>
                        <button onclick="navigateTo('home')" class="text-xs bg-slate-100 text-slate-700 font-bold px-3 py-2 rounded-xl">Menu</button>
                    </div>

                    <div class="space-y-2.5">
                        ${sortedUsers.length === 0 ? `<p class="text-center text-slate-400 text-xs py-8">Belum ada pemain berdaftar.</p>` : ''}
                        ${sortedUsers.map((u, idx) => `
                            <div class="flex items-center justify-between p-3.5 rounded-2xl ${idx === 0 ? 'bg-amber-50 border-2 border-amber-300' : idx === 1 ? 'bg-slate-100' : 'bg-white border border-slate-100'}">
                                <div class="flex items-center gap-3">
                                    <span class="font-game font-bold text-base w-5 text-center ${idx === 0 ? 'text-amber-500' : idx === 1 ? 'text-slate-500' : 'text-slate-400'}">${idx + 1}</span>
                                    <span class="text-xl">${u.avatar}</span>
                                    <div>
                                        <p class="font-game font-bold text-slate-800 text-xs">${u.username}</p>
                                        <p class="text-[10px] text-slate-400">ID: ${u.playerId}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="font-game font-bold text-indigo-600 text-sm">${u.totalScore || 0} Mata</p>
                                    <p class="text-[10px] text-slate-400">Ketepatan: ${u.stats && u.stats.totalAnswered > 0 ? Math.round((u.stats.totalCorrect / u.stats.totalAnswered) * 100) : 0}%</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderSettingsView() {
            return `
                <div class="max-w-md mx-auto bg-white rounded-3xl p-6 md:p-8 shadow-2xl border border-indigo-100 w-full">
                    <div class="text-center mb-5">
                        <span class="text-3xl">⚙️</span>
                        <h2 class="font-game font-bold text-2xl text-indigo-900 mt-1">Tetapan Akaun</h2>
                        <p class="text-xs text-slate-500">Urus profil pemain semasa</p>
                    </div>

                    <div class="space-y-4">
                        <div class="bg-indigo-50 p-4 rounded-2xl flex items-center gap-3">
                            <span class="text-2xl">${currentUser.avatar}</span>
                            <div>
                                <p class="font-game font-bold text-indigo-900 text-xs">${currentUser.username}</p>
                                <p class="text-[11px] text-indigo-600">ID: ${currentUser.playerId}</p>
                            </div>
                        </div>

                        <button onclick="logoutUser()" class="w-full bg-rose-100 hover:bg-rose-200 text-rose-700 font-game py-3 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-right-from-bracket"></i> Log Keluar
                        </button>
                        <button onclick="navigateTo('home')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-game py-3 rounded-xl text-xs">
                            Kembali ke Menu Utama
                        </button>
                    </div>
                </div>
            `;
        }

        function showModal(title, message, icon = '🎉') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
