    <script>
        /* ==========================================
           MATH KIDS - EDU KIDZ ENGINE & DATABASE
           ========================================== */

        const avatarsList = ['👦', '👧', '🦁', '🐯', '🐼', '🦊', '🐰', '🐸', '🚀', '⭐'];
        
        let db = {
            currentUser: null,
            users: [
                { name: 'Ahmad Zaki', username: 'zaki', password: '123', avatar: '👦', totalScore: 120 },
                { name: 'Siti Aminah', username: 'siti', password: '123', avatar: '👧', totalScore: 145 }
            ],
            leaderboard: [
                { name: 'Siti Aminah', score: 95, correct: 19, date: '17/09/2026' },

        function saveDB() {

                localStorage.setItem('math_kids_db', JSON.stringify(db));

            }
        }

        function loadDB() {

                let saved = localStorage.getItem('math_kids_db');
                if (saved) {
                    let parsed = JSON.parse(saved);
                    if (parsed && parsed.users) db = parsed;
                }
            } catch (e) {
                console.log('Error loading localStorage:', e);
            }
        }

        loadDB();

        const TOPICS_DATA = [
            { id: 1, name: "Kenali Unit Sentimeter dan Meter", icon: "📏", desc: "Mengenal unit cm dan m untuk ukuran panjang dengan teliti.", cat: "panjang" },
            { id: 2, name: "Ukur dan Banding Panjang Objek", icon: "📐", desc: "Menentukan, membanding dan mencari beza panjang objek.", cat: "panjang" },
            { id: 3, name: "Anggar Panjang Objek", icon: "✏️", desc: "Membuat anggaran munasabah bagi ukuran panjang.", cat: "panjang" },
            { id: 4, name: "Kenali Unit Gram dan Kilogram", icon: "⚖️", desc: "Mengenal unit g dan kg untuk jisim secara mendalam.", cat: "jisim" },
            { id: 5, name: "Timbang dan Banding Jisim Objek", icon: "🍉", desc: "Membaca bacaan timbangan dan membanding jisim.", cat: "jisim" },
            { id: 6, name: "Anggar Jisim Objek", icon: "🎒", desc: "Membuat anggaran munasabah bagi jisim objek.", cat: "jisim" },
            { id: 7, name: "Kenali Unit Mililiter dan Liter", icon: "🥤", desc: "Mengenal unit ml dan l untuk isipadu cecair.", cat: "isipadu" },
            { id: 8, name: "Sukat dan Banding Isipadu Cecair", icon: "🧴", desc: "Menyukat dan membanding isipadu cecair bekas.", cat: "isipadu" },
            { id: 9, name: "Anggar Isipadu Cecair", icon: "🫗", desc: "Anggaran isipadu cecair dalam bekas harian.", cat: "isipadu" },
            { id: 10, name: "Lengkapkan Ayat Matematik", icon: "📝", desc: "Lengkapkan ayat matematik berpandukan gambarajah visual.", cat: "campuran" },
            { id: 11, name: "Penyelesaian Masalah", icon: "💡", desc: "Menyelesaikan situasi harian melibatkan ukuran.", cat: "campuran" }
        ];

        /* ==========================================
           DIAGRAM GENERATOR ENGINE
           ========================================== */
        function generateDiagramHTML(diag) {
            if (!diag) return '';
            
            let { type, val1, val2, val3, total, op, target, icon } = diag;
            icon = icon || '📏';

            if (type === 'ruler') {
                let tLabel = target === 'total' ? '[ ? ]' : total;
                let v1Label = target === 'val1' ? '[ ? ]' : val1;
                let v2Label = target === 'val2' ? '[ ? ]' : val2;
                return `
                <div class="w-full flex flex-col items-center py-2 px-4 bg-gradient-to-r from-amber-50 to-orange-50 rounded-2xl border border-amber-200 shadow-inner">
                    <div class="text-xs font-bold text-amber-800 mb-2 flex items-center gap-1">
                        <span>${icon}</span> <span>Gambarajah Ukuran Pembaris / Segmen Panjang</span>
                    </div>
                    <div class="w-full max-w-md bg-white rounded-xl p-3 border border-amber-200 shadow-sm">
                        <div class="flex items-center gap-2 mb-2 font-bold text-xs sm:text-sm justify-center">
                            <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-lg border border-blue-300 ${target==='val1'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':''}">${v1Label}</span>
                            <span class="text-slate-500 font-black">${op || '+'}</span>
                            <span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg border border-emerald-300 ${target==='val2'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':''}">${v2Label}</span>
                            <span class="text-slate-500 font-black">=</span>
                            <span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-lg border border-purple-300 ${target==='total'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':''}">${tLabel}</span>
                        </div>
                        <!-- Visual Ruler Graphic -->
                        <div class="relative h-10 w-full bg-amber-100 rounded-lg border-2 border-amber-400 flex items-end overflow-hidden shadow-inner">
                            <div class="h-full bg-blue-500/80 flex items-center justify-center text-white text-xs font-bold transition-all" style="width: 45%;">${v1Label}</div>
                            <div class="h-full bg-emerald-500/80 flex items-center justify-center text-white text-xs font-bold transition-all border-l-2 border-white" style="width: 55%;">${v2Label}</div>
                        </div>
                        <div class="flex justify-between text-[10px] text-amber-800 font-mono mt-1 px-1 font-bold">
                            <span>0 cm</span><span>|---|---|</span><span>Jumlah: ${tLabel}</span>
                        </div>
                    </div>
                </div>`;
            }

            if (type === 'scale' || type === 'beaker') {
                let isBeaker = type === 'beaker';
                let bgGrad = isBeaker ? 'from-cyan-50 to-blue-50 border-cyan-200' : 'from-emerald-50 to-teal-50 border-emerald-200';
                let mainIcon = isBeaker ? '🥤' : '⚖️';
                let headerTxt = isBeaker ? 'Gambarajah Isipadu Cecair Bekas Sukatan' : 'Gambarajah Timbangan Jisim Objek';

                let tLabel = target === 'total' ? '[ ? ]' : total;
                let v1Label = target === 'val1' ? '[ ? ]' : val1;
                let v2Label = target === 'val2' ? '[ ? ]' : val2;

                return `
                <div class="w-full flex flex-col items-center py-2 px-4 bg-gradient-to-r ${bgGrad} rounded-2xl border shadow-inner">
                    <div class="text-xs font-bold text-slate-700 mb-2 flex items-center gap-1">
                        <span>${mainIcon}</span> <span>${headerTxt}</span>
                    </div>
                    <div class="w-full max-w-md bg-white rounded-xl p-3 border border-slate-200 shadow-sm flex flex-col items-center">
                        <div class="flex items-center gap-2 mb-3 font-bold text-xs sm:text-sm">
                            <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg border border-indigo-200 ${target==='val1'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':''}">${v1Label}</span>
                            <span class="text-slate-500 font-black">${op || '+'}</span>
                            <span class="bg-teal-100 text-teal-700 px-3 py-1 rounded-lg border border-teal-200 ${target==='val2'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':''}">${v2Label}</span>
                            <span class="text-slate-500 font-black">=</span>
                            <span class="bg-rose-100 text-rose-700 px-3 py-1 rounded-lg border border-rose-200 ${target==='total'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':''}">${tLabel}</span>
                        </div>
                        <div class="flex items-center justify-center gap-4 text-center">
                            <div class="flex flex-col items-center">
                                <div class="w-12 h-14 bg-slate-100 rounded-b-xl border-2 border-slate-300 relative flex items-end justify-center overflow-hidden">
                                    <div class="w-full ${isBeaker?'bg-cyan-400':'bg-emerald-400'} rounded-b-lg" style="height: 60%"></div>
                                    <span class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-slate-900 drop-shadow-sm">${v1Label}</span>
                                </div>
                            </div>
                            <span class="text-lg font-bold text-slate-400">${op || '+'}</span>
                            <div class="flex flex-col items-center">
                                <div class="w-12 h-14 bg-slate-100 rounded-b-xl border-2 border-slate-300 relative flex items-end justify-center overflow-hidden">
                                    <div class="w-full ${isBeaker?'bg-blue-400':'bg-teal-400'} rounded-b-lg" style="height: 75%"></div>
                                    <span class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-slate-900 drop-shadow-sm">${v2Label}</span>
                                </div>
                            </div>
                            <span class="text-lg font-bold text-slate-400">=</span>
                            <div class="flex flex-col items-center">
                                <div class="w-14 h-16 bg-amber-50 rounded-b-xl border-2 border-amber-300 relative flex items-end justify-center overflow-hidden ring-2 ring-amber-200">
                                    <div class="w-full ${isBeaker?'bg-indigo-500':'bg-purple-500'} rounded-b-lg" style="height: 90%"></div>
                                    <span class="absolute inset-0 flex items-center justify-center text-xs font-black text-white drop-shadow">${tLabel}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            if (type === 'balance') {
                let { leftVal1, leftVal2, rightVal1, rightVal2 } = diag;
                return `
                <div class="w-full flex flex-col items-center py-2 px-4 bg-gradient-to-r from-purple-50 to-indigo-50 rounded-2xl border border-purple-200 shadow-inner">
                    <div class="text-xs font-bold text-purple-900 mb-2 flex items-center gap-1">
                        <span>⚖️</span> <span>Imbangan Penimbang Dua Sisi Seimbang</span>
                    </div>
                    <div class="w-full max-w-md bg-white rounded-xl p-3 border border-purple-200 shadow-sm flex flex-col items-center">
                        <div class="flex items-center justify-between w-full gap-2 mb-2">
                            <!-- Left Tray -->
                            <div class="flex-1 bg-purple-50 p-2 rounded-xl border border-purple-200 text-center">
                                <div class="text-[10px] text-purple-600 font-bold uppercase mb-1">Dulang Kiri</div>
                                <div class="text-xs font-bold text-purple-900 bg-white py-1.5 px-2 rounded-lg border border-purple-100 shadow-xs">
                                    ${leftVal1} ${leftVal2 ? '+ ' + leftVal2 : ''}
                                </div>
                            </div>
                            <div class="text-lg font-black text-purple-500">=</div>
                            <!-- Right Tray -->
                            <div class="flex-1 bg-amber-50 p-2 rounded-xl border border-amber-200 text-center">
                                <div class="text-[10px] text-amber-700 font-bold uppercase mb-1">Dulang Kanan</div>
                                <div class="text-xs font-bold text-amber-900 bg-white py-1.5 px-2 rounded-lg border border-amber-100 shadow-xs">
                                    ${rightVal1} ${rightVal2 ? '+ ' + rightVal2 : ''}
                                </div>
                            </div>
                        </div>
                        <div class="w-full h-8 bg-slate-100 rounded-lg border border-slate-300 relative flex items-center justify-center">
                            <div class="w-3/4 h-1 bg-purple-500 rounded-full"></div>
                            <div class="absolute w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-b-[12px] border-b-slate-600 bottom-1"></div>
                        </div>
                    </div>
                </div>`;
            }

            // Default block diagram
            let tLabel = target === 'total' ? '[ ? ]' : (total || '');
            let v1Label = target === 'val1' ? '[ ? ]' : val1;
            let v2Label = target === 'val2' ? '[ ? ]' : val2;
            let v3Label = target === 'val3' ? '[ ? ]' : (val3 || '');

            return `
            <div class="w-full flex flex-col items-center py-2 px-4 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl border border-blue-200 shadow-inner">
                <div class="text-xs font-bold text-blue-900 mb-2 flex items-center gap-1">
                    <span>📝</span> <span>Model Blok Ayat Matematik</span>
                </div>
                <div class="w-full max-w-md bg-white rounded-xl p-3 border border-blue-200 shadow-sm flex items-center justify-center gap-2 flex-wrap font-bold text-xs sm:text-sm">
                    <span class="px-3 py-1.5 rounded-xl border ${target==='val1'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':'bg-blue-100 text-blue-800 border-blue-200'}">${v1Label}</span>
                    <span class="text-slate-500 font-extrabold">${op || '+'}</span>
                    <span class="px-3 py-1.5 rounded-xl border ${target==='val2'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':'bg-emerald-100 text-emerald-800 border-emerald-200'}">${v2Label}</span>
                    ${v3Label ? `<span class="text-slate-500 font-extrabold">${op || '+'}</span><span class="px-3 py-1.5 rounded-xl border ${target==='val3'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':'bg-purple-100 text-purple-800 border-purple-200'}">${v3Label}</span>` : ''}
                    <span class="text-slate-500 font-extrabold">=</span>
                    <span class="px-3 py-1.5 rounded-xl border ${target==='total'?'bg-amber-300 text-amber-900 border-amber-500 font-black scale-105 shadow-sm':'bg-rose-100 text-rose-800 border-rose-200'}">${tLabel}</span>
                </div>
            </div>`;
        }

        /* ==========================================
           REFINED QUESTION GENERATOR
           ========================================== */
        function generateQuestions(topicId, level) {
            let questions = [];
            let cognitiveLevel = level === 'mudah' ? 'Mengingat' : (level === 'sederhana' ? 'Memahami' : 'Mengaplikasi');
            let gameTypes = ['objective', 'matching', 'dragdrop', 'fillblank'];

            for (let i = 1; i <= 20; i++) {
                let qId = `t${topicId}_${level}_${i}`;
                let gType = gameTypes[(i - 1) % gameTypes.length];
                let qData = {};

                if (topicId === 1) {
                    const t1MudahPool = [
                        { item: "panjang sebatang klip kertas kecil", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "lebar sehelai kad laporan sekolah", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "panjang sebatang pensel warna pendek", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "lebar sebuah buku tulis latihan", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "panjang pemadam getah pensel", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "lebar lencana sekolah pada baju uniform", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "panjang sebatang pen dakwat biru", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "lebar kepingan setem pos Malaysia", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "panjang krayon warna hijau", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "lebar jalur pembaris plastik 15cm", unit: "sentimeter (cm)", alt: "meter (m)", code: "cm" },
                        { item: "tinggi sebatang tiang bendera sekolah", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "panjang keseluruhan padang bola sepak", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "tinggi bangunan dewan sekolah dua tingkat", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "panjang pagar kawat di taman herba", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "lebar gelanggang permainan badminton", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "tinggi sebuah bas persiaran sekolah", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "panjang koridor bangunan bilik darjah", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "tinggi pintu masuk utama kelas tahun dua", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "panjang laluan trek larian 100 meter", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" },
                        { item: "tinggi menara tangki air sekolah", unit: "meter (m)", alt: "sentimeter (cm)", code: "m" }
                    ];

                    let itemObj = t1MahaPoolGet(t1MudahPool, i);
                    qData = {
                        id: qId, topicId: 1, level: level, cognitive: cognitiveLevel, type: gType,
                        question: `Pilih unit ukuran panjang piawai yang paling tepat dan logik untuk menyukat ${itemObj.item}.`,
                        options: [itemObj.unit, itemObj.alt, 'kilogram (kg)', 'liter (l)'],
                        answer: itemObj.unit,
                        explanation: `Objek tersebut dikategorikan sebagai ukuran berskala ${itemObj.code === 'cm' ? 'pendek' : 'panjang'}, maka unit ${itemObj.unit} adalah tepat.`
                    };
                } else if (topicId === 2) {
                    const namesA = ["Reben Merah", "Tali Biru", "Pita Kuning", "Kain Hijau", "Wayar Putih", "Selendang Ungu"];
                    const namesB = ["Reben Oren", "Tali Coklat", "Pita Kelabu", "Kain Emas", "Wayar Merak", "Selendang Oren"];
                    let nA = namesA[(i * 3) % namesA.length];
                    let nB = namesB[(i * 5) % namesB.length];
                    let vA = 12 + (i * 7) % 75;
                    let vB = 15 + (i * 11) % 75;
                    if (vA === vB) vB += 6;

                    let diff = Math.abs(vA - vB);
                    qData = {

                        <div class="mb-4">
                            <span id="cognitiveBadge" class="text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1 rounded-full">Aras Kognitif: ${gameState.questionsList[0]?.cognitive || 'Mengingat'}</span>
                            <h3 id="qText" class="font-kids font-bold text-lg sm:text-xl text-slate-800 mt-3 leading-snug">Memuatkan soalan...</h3>
                        </div>

                        <!-- Dynamic Visual Diagram Container -->
                        <div id="qDiagramContainer" class="my-4 min-h-[100px] flex justify-center items-center"></div>
                    </div>

                    <div id="qInteractionArea" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4"></div>
                </div>
            </div>`;
        }

        function initGamePlay() {
            loadQuestionToUI();
        }

        function loadQuestionToUI() {
            if (gameState.currentIndex >= gameState.questionsList.length) {
                finishGame();
                return;
            }

            let q = gameState.questionsList[gameState.currentIndex];
            document.getElementById('liveQIndex').innerText = gameState.currentIndex + 1;
            document.getElementById('liveScore').innerText = gameState.score;
            document.getElementById('gameProgressBar').style.width = `${((gameState.currentIndex + 1) / 20) * 100}%`;
            document.getElementById('cognitiveBadge').innerText = `Aras Kognitif: ${q.cognitive || 'Mengingat'}`;
            document.getElementById('qText').innerText = q.question;

            // Render Visual Diagram if available
            let diagramContainer = document.getElementById('qDiagramContainer');
            if (q.diagram) {
                diagramContainer.innerHTML = generateDiagramHTML(q.diagram);
                diagramContainer.classList.remove('hidden');
            } else {
                diagramContainer.innerHTML = '';
                diagramContainer.classList.add('hidden');
            }

            let area = document.getElementById('qInteractionArea');
            area.innerHTML = '';

            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "bg-slate-50 hover:bg-blue-50 hover:border-blue-500 border-2 border-slate-200 text-slate-700 font-bold p-4 rounded-2xl transition text-left flex items-center justify-between group active:scale-95";
                btn.innerHTML = `<span>${opt}</span> <div class="w-6 h-6 rounded-full bg-slate-200 group-hover:bg-blue-600 group-hover:text-white flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></div>`;
                btn.onclick = () => submitAnswer(opt, q.answer);
                area.appendChild(btn);
            });

            if (gameState.timerSetting > 0) {
                gameState.timeLeft = gameState.timerSetting;
                document.getElementById('liveTimer').innerText = gameState.timeLeft;
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = setInterval(() => {
                    gameState.timeLeft--;
                    document.getElementById('liveTimer').innerText = gameState.timeLeft;
                    if (gameState.timeLeft <= 0) {
                        clearInterval(gameState.timerInterval);
                        handleTimeout(q.answer);
                    }
                }, 1000);
            }
        }

        function submitAnswer(selected, correct) {
            clearInterval(gameState.timerInterval);
            let isCorrect = selected.toString().trim().toLowerCase() === correct.toString().trim().toLowerCase();
            
            if (isCorrect) {
                gameState.score += 5;
                gameState.correctCount++;
                showFeedbackModal(true, correct);
            } else {
                gameState.wrongCount++;
                showFeedbackModal(false, correct);
            }

            gameState.answersRecord.push({
                question: gameState.questionsList[gameState.currentIndex].question,
                selected,
                correct,
                isCorrect
            });
        }

        function handleTimeout(correct) {
            gameState.wrongCount++;
            showFeedbackModal(false, correct, true);
            gameState.answersRecord.push({
                question: gameState.questionsList[gameState.currentIndex].question,
                selected: 'Masa Habis',
                correct,
                isCorrect: false
            });
        }

        function showFeedbackModal(isCorrect, correctAns, isTimeout = false) {
            let modal = document.getElementById('customModal');
            let icon = document.getElementById('modalIcon');
            let title = document.getElementById('modalTitle');
            let msg = document.getElementById('modalMessage');
            let btn = document.getElementById('modalBtnPrimary');

            if (isCorrect) {
                icon.className = "w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-3xl mx-auto mb-4 animate-bounce";
                icon.innerHTML = "🎉";
                title.innerText = "TAHNIAH! 🎆";
                msg.innerHTML = `Jawapan anda betul! +5 Markah diberikan.<br><span class='text-xs text-slate-400'>Teruskan usaha cemerlang!</span>`;
                btn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition w-full";
                
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            } else {
                icon.className = "w-16 h-16 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-3xl mx-auto mb-4";
                icon.innerHTML = "💡";
                title.innerText = isTimeout ? "MASA TAMAT! ⏱️" : "BELUM TEPAT! ❌";
                msg.innerHTML = `Jawapan yang betul ialah:<br><strong class='text-blue-600 text-lg'>${correctAns}</strong>`;
                btn.className = "bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition w-full";
            }

            btn.onclick = () => {
                modal.classList.add('hidden');
                gameState.currentIndex++;
                loadQuestionToUI();
            };

            modal.classList.remove('hidden');
        }

        function finishGame() {
            clearInterval(gameState.timerInterval);
            if (db.currentUser) {
                db.currentUser.totalScore = (db.currentUser.totalScore || 0) + gameState.score;
                db.leaderboard.push({
                    name: db.currentUser.name,
                    score: gameState.score,
                    correct: gameState.correctCount,
                    date: new Date().toLocaleDateString('ms-MY')
                });
                db.leaderboard.sort((a,b) => b.score - a.score);
                saveDB();
            }
            router.navigate('results');
        }

        function renderResultsView() {
            let accuracy = Math.round((gameState.correctCount / 20) * 100);
            let badge = accuracy >= 85 ? '🏆 MATEMATIK MASTER' : (accuracy >= 60 ? '⭐ PAKAR UKUR' : '🌱 USAHA LAGI');

            return `
            <div class="flex-1 flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl border border-slate-100 text-center relative overflow-hidden">
                    <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full mx-auto flex items-center justify-center text-4xl shadow-md mb-4 floating">🏆</div>
                    <h2 class="font-kids font-bold text-3xl text-slate-800 mb-1">TAHNIAH! 🎉</h2>
                    <p class="text-slate-500 text-xs mb-6">Anda telah menyelesaikan 20 soalan cabaran.</p>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <div class="text-xs text-blue-600 font-bold uppercase">Markah Diperoleh</div>
                            <div class="font-kids font-bold text-3xl text-blue-700 mt-1">${gameState.score} <span class="text-sm">/ 100</span></div>
                        </div>
                        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                            <div class="text-xs text-emerald-600 font-bold uppercase">Ketepatan</div>
                            <div class="font-kids font-bold text-3xl text-emerald-700 mt-1">${accuracy}%</div>
                        </div>
                    </div>

                    <div class="space-y-2 mb-6 text-left bg-slate-50 p-4 rounded-2xl border border-slate-100 text-xs font-bold text-slate-700 flex justify-around">
                        <div>✅ Betul: <span class="text-emerald-600">${gameState.correctCount}</span></div>
                        <div>❌ Salah: <span class="text-rose-600">${gameState.wrongCount}</span></div>
                        <div>🎖️ Badge: <span class="text-amber-600">${badge}</span></div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="router.navigate('game')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition text-xs"><i class="fa-solid fa-rotate-right mr-1"></i> Main Semula</button>
                        <button onclick="router.navigate('topics')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition text-xs"><i class="fa-solid fa-book mr-1"></i> Topik Lain</button>
                        <button onclick="router.navigate('leaderboard')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-xl shadow-md transition text-xs"><i class="fa-solid fa-trophy mr-1"></i> Leaderboard</button>
                        <button onclick="router.navigate('dashboard')" class="bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl shadow-md transition text-xs"><i class="fa-solid fa-house mr-1"></i> Menu Utama</button>
                    </div>
                </div>
            </div>`;
        }

        function renderProfileView() {
            let p = db.currentUser || { name: 'Pemain', username: 'tetamu', avatar: '👦', totalScore: 0 };
            return `
            <div class="flex-1 flex flex-col gap-6 max-w-2xl mx-auto w-full">
                <div class="flex items-center justify-between bg-white rounded-2xl p-4 border border-slate-100 shadow-sm">
                    <button onclick="router.navigate('dashboard')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Menu Utama</button>
                    <h2 class="font-kids font-bold text-lg text-slate-800">Profil Pemain</h2>
                    <div class="w-20"></div>
                </div>
                <div class="bg-white rounded-3xl p-8 border border-slate-100 shadow-sm text-center">
                    <div class="w-24 h-24 rounded-3xl bg-blue-100 text-5xl flex items-center justify-center mx-auto mb-4 shadow-inner">${p.avatar}</div>
                    <h3 class="font-kids font-bold text-2xl text-slate-800">${p.name}</h3>
                    <p class="text-xs text-slate-400 mb-6">@${p.username}</p>
                    <div class="grid grid-cols-2 gap-4 max-w-md mx-auto mb-6">
                        <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100 text-center">
                            <div class="text-xs text-amber-600 font-bold uppercase">Jumlah Markah</div>
                            <div class="font-kids font-bold text-2xl text-amber-700 mt-1">${p.totalScore || 0}</div>
                        </div>
                        <div class="bg-purple-50 p-4 rounded-2xl border border-purple-100 text-center">
                            <div class="text-xs text-purple-600 font-bold uppercase">Badge Diperoleh</div>
                            <div class="font-kids font-bold text-2xl text-purple-700 mt-1">🏆 3</div>
                        </div>
                    </div>
                    <button onclick="authManager.logout()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-6 py-3 rounded-xl transition text-sm"><i class="fa-solid fa-right-from-bracket mr-2"></i> Log Keluar Akaun</button>
                </div>
            </div>`;
        }

        function renderLeaderboardView() {
            let list = db.leaderboard.length > 0 ? db.leaderboard.map((item, idx) => `
                <div class="flex items-center justify-between p-4 bg-slate-50 hover:bg-blue-50/50 rounded-2xl border border-slate-100 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-xl ${idx===0?'bg-amber-400 text-white':(idx===1?'bg-slate-300 text-white':(idx===2?'bg-amber-600 text-white':'bg-slate-200 text-slate-600'))} flex items-center justify-center font-bold text-sm">${idx+1}</div>
                        <div><h4 class="font-kids font-bold text-slate-800 text-sm">${item.name}</h4><p class="text-[10px] text-slate-400">${item.date}</p></div>
                    </div>
                    <div class="font-kids font-bold text-blue-600 text-base">⭐ ${item.score} <span class="text-xs text-slate-400 font-sans">markah</span></div>
                </div>
            `).join('') : `<p class='text-center text-slate-400 text-xs py-8'>Belum ada rekod leaderboard lagi. Jom mula bermain!</p>`;

            return `
            <div class="flex-1 flex flex-col gap-6 max-w-2xl mx-auto w-full">
                <div class="flex items-center justify-between bg-white rounded-2xl p-4 border border-slate-100 shadow-sm">
                    <button onclick="router.navigate('dashboard')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Menu Utama</button>
                    <h2 class="font-kids font-bold text-lg text-slate-800">🏆 Leaderboard Pemain</h2>
                    <div class="w-20"></div>
                </div>
                <div class="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-3">${list}</div>
            </div>`;
        }

        const authManager = {
            handleLogin: function(e) {
                e.preventDefault();
                let username = document.getElementById('loginUser').value.trim();
                let pass = document.getElementById('loginPass').value;
                let found = db.users.find(u => u.username === username && u.password === pass);
                if (found) {
                    db.currentUser = found;
                    saveDB();
                    router.navigate('dashboard');
                } else {
                    showAlert("Log Masuk Gagal", "Username atau Password salah. Sila cuba lagi.");
                }
            },
            handleRegister: function(e) {
                e.preventDefault();
                let name = document.getElementById('regName').value.trim();
                let username = document.getElementById('regUser').value.trim();
                let password = document.getElementById('regPass').value;
                let avatar = document.querySelector('input[name="regAvatar"]:checked')?.value || '👦';

                if (db.users.some(u => u.username === username)) {
                    showAlert("Pendaftaran Gagal", "Username telah digunakan.");
                    return;
                }

                let newUser = { name, username, password, avatar, totalScore: 0 };
                db.users.push(newUser);
                db.currentUser = newUser;
                saveDB();
                router.navigate('dashboard');
            },
            logout: function() {
                db.currentUser = null;
                saveDB();
                router.navigate('login');
            }
        };

        function showAlert(title, message) {
            let modal = document.getElementById('customModal');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        window.onload = function() {
            loadDB();
            if (db.currentUser) {
                router.navigate('dashboard');
            } else {
                router.navigate('login');
            }
        };
    </script>
</body>
</html>
