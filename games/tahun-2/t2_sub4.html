    <script>
        const categories = [
            { id: 1, title: "Kenali Jam dan Masa", icon: "⏰", desc: "Mengenal jam analog, jarum jam, jarum minit dan baca waktu." },
            { id: 2, title: "Rekod Waktu", icon: "🕐", desc: "Memadankan jam analog, waktu digital dan bacaan minit." },
            { id: 3, title: "Perkaitan Waktu", icon: "🔄", desc: "Hubungan unit masa (jam, minit, hari, minggu, bulan)." },
            { id: 4, title: "Lengkapkan Ayat Matematik", icon: "🧩", desc: "Ayat matematik melibatkan jam, minit dan operasi waktu." },
            { id: 5, title: "Penyelesaian Masalah", icon: "🧠", desc: "Situasi harian tempoh masa, waktu mula dan waktu tamat." }
        ];

        const levels = [
            { id: 'mudah', title: '🟢 Mudah', desc: 'Mengingat & Memahami asas waktu' },
            { id: 'sederhana', title: '🟡 Sederhana', desc: 'Memahami & Mengaplikasi bacaan 5-minit' },
            { id: 'sukar', title: '🔴 Sukar', desc: 'Pengiraan tempoh & penaakulan masa' }
        ];

        const gameModes = [
            { id: 'objektif', title: '🎯 Objektif', desc: 'Pilih jawapan yang betul daripada 4 pilihan' },
            { id: 'padanan', title: '🔗 Padanan', desc: 'Padankan waktu jam dengan padanan yang tepat' },
            { id: 'dragdrop', title: '🖱️ Seret & Lepas', desc: 'Seret jawapan ke petak ruang kosong' },
            { id: 'isikosong', title: '✏️ Isi Tempat Kosong', desc: 'Taip atau pilih jawapan ringkas' },
            { id: 'campuran', title: '🎮 Campuran', desc: 'Gabungan pelbagai bentuk soalan secara rawak' }
        ];

        const timeLimits = [
            { id: 30, title: '⏱️ 30 Saat', secs: 30 },
            { id: 60, title: '⏱️ 1 Minit', secs: 60 },
            { id: 0, title: '♾️ Tiada Had', secs: 0 }
        ];

        function generateQuestionBank() {
            const bank = {};
            const names = ['Ali', 'Siti', 'Ahmad', 'Mei Ling', 'Rani', 'John', 'Fatimah', 'Zul'];
            
            categories.forEach(cat => {
                bank[cat.id] = {};
                levels.forEach(lvl => {
                    bank[cat.id][lvl.id] = [];
                    for (let i = 1; i <= 20; i++) {
                        let q = generateSingleQuestion(cat.id, lvl.id, i, names);
                        bank[cat.id][lvl.id].push(q);
                    }
                });
            });
            return bank;
        }

        function generateSingleQuestion(catId, lvlId, index, names) {
            const name = names[index % names.length];
            let qObj = {
                id: `Q-${catId}-${lvlId}-${index}`,
                category: catId,
                level: lvlId,
                score: 5,
                explanation: "Syabas! Teruskan kefahaman tentang konsep masa dan waktu."
            };

            if (catId === 1) { // Kenali Jam dan Masa
                if (lvlId === 'mudah') {
                    const hours = (index % 12) + 1;
                    qObj.question = `Apakah waktu yang ditunjukkan pada jam analog di atas (jarum panjang di 12)?`;
                    qObj.clockTime = { hour: hours, minute: 0 };
                    const correctStr = `${hours}:00`;
                    qObj.answer = correctStr;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([correctStr, `${(hours%12)+1}:00`, `${(hours-2+12)%12+1}:00`, `${(hours+3)%12+1}:00`]);
                    qObj.explanation = `Jarum pendek menunjuk ke nombor ${hours} dan jarum panjang di nombor 12 bermaksud pukul ${hours}:00.`;
                } else if (lvlId === 'sederhana') {
                    const hours = (index % 12) + 1;
                    const mins = (index % 4) * 15; // 0, 15, 30, 45
                    qObj.question = `Jarum pendek pada ${hours} dan jarum minit pada ${(mins===0?12:mins/5)}. Pukul berapakah itu?`;
                    qObj.clockTime = { hour: hours, minute: mins };
                    const correctStr = `${hours}:${mins < 10 ? '0'+mins : mins}`;
                    qObj.answer = correctStr;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([correctStr, `${(hours%12)+1}:${mins}`, `${hours}:${(mins+15)%60 < 10 ? '0'+((mins+15)%60) : (mins+15)%60}`, `${(hours-1+12)%12+1}:30`]);
                    qObj.explanation = `Setiap nombor pada jam mewakili 5 minit. Suku jam ialah 15 minit dan setengah jam ialah 30 minit.`;
                } else { // sukar
                    const hours = (index % 12) + 1;
                    const mins = ((index * 5) % 12) * 5;
                    qObj.question = `Perhatikan kedudukan jarum jam dan minit. Jika jarum minit bergerak melepasi beberapa angka, apakah waktu yang tepat?`;
                    qObj.clockTime = { hour: hours, minute: mins };
                    const correctStr = `${hours}:${mins < 10 ? '0'+mins : mins}`;
                    qObj.answer = correctStr;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([correctStr, `${(hours%12)+1}:${(mins+10)%60 < 10 ? '0'+(mins+10)%60 : (mins+10)%60}`, `${hours}:${(mins+30)%60 < 10 ? '0'+((mins+30)%60) : (mins+30)%60}`, `${(hours-1+12)%12+1}:15`]);
                    qObj.explanation = `Bacaan jarum pendek dahulu diikuti jarum minit (darab 5 setiap angka). Jawapannya ialah ${correctStr}.`;
                }
            } else if (catId === 2) { // Rekod Waktu
                if (lvlId === 'mudah') {
                    const h = (index % 12) + 1;
                    qObj.question = `Padankan jam analog berikut dengan waktu digital yang sepadan.`;
                    qObj.clockTime = { hour: h, minute: 0 };
                    qObj.answer = `${h}:00`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`${h}:00`, `${h}:30`, `${(h%12)+1}:00`, `${(h+2)%12+1}:15`]);
                    qObj.explanation = `Waktu tepat ditunjukkan apabila jarum minit di angka 12.`;
                } else if (lvlId === 'sederhana') {
                    const h = (index % 12) + 1;
                    qObj.question = `${name} melihat jam menunjukkan pukul ${h}:30 pagi. Apakah rekod waktu digital yang betul?`;
                    qObj.clockTime = { hour: h, minute: 30 };
                    qObj.answer = `${h}:30 pagi`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`${h}:30 pagi`, `${h}:15 pagi`, `${(h%12)+1}:30 pagi`, `${h}:00 pagi`]);
                    qObj.explanation = `Setengah jam bersamaan 30 minit. Jadi rekodnya ialah ${h}:30 pagi.`;
                } else {
                    const h = (index % 11) + 1;
                    qObj.question = `Pilih waktu petang yang betul bagi jarum jam di angka ${h} dan jarum minit di angka 6 (30 minit).`;
                    qObj.clockTime = { hour: h, minute: 30 };
                    qObj.answer = `${h}:30 petang`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`${h}:30 petang`, `${h}:00 petang`, `${(h%12)+1}:30 petang`, `${h}:15 petang`]);
                    qObj.explanation = `Waktu petang merujuk kepada aktiviti selepas tengah hari sehingga senja.`;
                }
            } else if (catId === 3) { // Perkaitan Waktu
                if (lvlId === 'mudah') {
                    const val = index % 3;
                    if (val === 0) {
                        qObj.question = `1 jam bersamaan dengan berapa minit?`;
                        qObj.answer = `60 minit`;
                        qObj.options = shuffleArray([`60 minit`, `30 minit`, `24 minit`, `12 minit`]);
                    } else if (val === 1) {
                        qObj.question = `1 hari bersamaan dengan berapa jam?`;
                        qObj.answer = `24 jam`;
                        qObj.options = shuffleArray([`24 jam`, `12 jam`, `60 jam`, `7 jam`]);
                    } else {
                        qObj.question = `1 minggu bersamaan dengan berapa hari?`;
                        qObj.answer = `7 hari`;
                        qObj.options = shuffleArray([`7 hari`, `30 hari`, `12 hari`, `24 hari`]);
                    }
                    qObj.type = 'objektif';
                } else if (lvlId === 'sederhana') {
                    const val = index % 3;
                    if (val === 0) {
                        qObj.question = `½ jam bersamaan dengan berapa minit?`;
                        qObj.answer = `30 minit`;
                        qObj.options = shuffleArray([`30 minit`, `15 minit`, `45 minit`, `60 minit`]);
                    } else if (val === 1) {
                        qObj.question = `¼ jam bersamaan dengan berapa minit?`;
                        qObj.answer = `15 minit`;
                        qObj.options = shuffleArray([`15 minit`, `30 minit`, `10 minit`, `20 minit`]);
                    } else {
                        qObj.question = `1 tahun bersamaan dengan berapa bulan?`;
                        qObj.answer = `12 bulan`;
                        qObj.options = shuffleArray([`12 bulan`, `7 bulan`, `24 bulan`, `365 bulan`]);
                    }
                    qObj.type = 'objektif';
                } else {
                    qObj.question = `Berapakah jumlah minit dalam 2 jam?`;
                    qObj.answer = `120 minit`;
                    qObj.type = 'objektif';
                    qObj.options = shuffleArray([`120 minit`, `60 minit`, `90 minit`, `180 minit`]);
                    qObj.explanation = `1 jam = 60 minit. Maka 2 jam = 60 + 60 = 120 minit.`;
                }
            } else if (catId === 4) { // KATEGORI 4: LENGKAPKAN AYAT MATEMATIK (REFINED: COMPLETELY UNIQUE, TEXT-ONLY, NO DUPLICATES)
                const uniqueQuestions = {
                    mudah: [
                        { q: "Lengkapkan ayat matematik hubungan unit asas:\n60 minit = ____ jam", ans: "1", opts: ["1", "2", "60", "12"], exp: "60 minit adalah tepat sama dengan 1 jam." },
                        { q: "Lengkapkan ayat matematik pecahan separuh masa:\n30 minit = ____ jam", ans: "1/2", opts: ["1/2", "1/4", "1", "2"], exp: "30 minit ialah separuh atau 1/2 jam." },
                        { q: "Lengkapkan ayat matematik suku jam:\n15 minit = ____ jam", ans: "1/4", opts: ["1/4", "1/2", "1", "3"], exp: "15 minit dikenali sebagai suku jam atau 1/4 jam." },
                        { q: "Lengkapkan ayat matematik bilangan hari:\n7 hari = ____ minggu", ans: "1", opts: ["1", "7", "24", "30"], exp: "7 hari lengkap mengira 1 minggu." },
                        { q: "Lengkapkan ayat matematik pusingan jam sehari:\n24 jam = ____ hari", ans: "1", opts: ["1", "24", "7", "12"], exp: "24 jam sehari semalam bersamaan dengan 1 hari." },
                        { q: "Lengkapkan ayat matematik bulan dalam setahun:\n12 bulan = ____ tahun", ans: "1", opts: ["1", "12", "365", "24"], exp: "12 bulan lengkap membentuk 1 tahun kalendar." },
                        { q: "Lengkapkan ayat tambah mudah waktu:\n1 jam + 1 jam = ____ jam", ans: "2", opts: ["2", "1", "3", "60"], exp: "1 jam ditambah 1 jam menghasilkan 2 jam." },
                        { q: "Lengkapkan ayat tolak mudah waktu:\n4 jam - 1 jam = ____ jam", ans: "3", opts: ["3", "4", "2", "5"], exp: "4 jam ditolak 1 jam baki 3 jam." },
                        { q: "Lengkapkan ayat matematik waktu pagi:\nPukul 8:00 pagi ke 9:00 pagi melibatkan tempoh ____ jam", ans: "1", opts: ["1", "2", "60", "30"], exp: "Jarak masa dari pukul 8:00 pagi hingga 9:00 pagi ialah 1 jam." },
                        { q: "Lengkapkan ayat matematik tempoh minit:\nPukul 2:00 petang hingga 2:30 petang ialah ____ minit", ans: "30", opts: ["30", "15", "60", "45"], exp: "Dari 2:00 ke 2:30 ialah 30 minit." },
                        { q: "Lengkapkan ayat matematik hari bekerja sekolah:\nDalam seminggu, hari persekolahan ialah ____ hari", ans: "5", opts: ["5", "7", "2", "6"], exp: "Hari persekolahan kebiasaannya adalah 5 hari (Isnin hingga Jumaat)." },
                        { q: "Lengkapkan ayat matematik hujung minggu:\nHujung minggu (Sabtu dan Ahad) berjumlah ____ hari", ans: "2", opts: ["2", "5", "7", "1"], exp: "Sabtu dan Ahad ialah 2 hari cuti hujung minggu." },
                        { q: "Lengkapkan ayat matematik pertukaran jam:\n2 jam = ____ minit", ans: "120", opts: ["120", "60", "90", "180"], exp: "2 darab 60 minit = 120 minit." },
                        { q: "Lengkapkan ayat matematik separuh jam:\n½ jam = ____ minit", ans: "30", opts: ["30", "15", "60", "45"], exp: "Setengah jam bernilai 30 minit." },
                        { q: "Lengkapkan ayat matematik suku jam:\n¼ jam = ____ minit", ans: "15", opts: ["15", "30", "60", "10"], exp: "Suku jam bernilai 15 minit." },
                        { q: "Lengkapkan ayat matematik gandaan hari:\n14 hari = ____ minggu", ans: "2", opts: ["2", "1", "7", "14"], exp: "14 bahagi 7 hari = 2 minggu." },
                        { q: "Lengkapkan ayat matematik jam sehari semalam:\n1 hari = ____ jam", ans: "24", opts: ["24", "12", "60", "7"], exp: "Sehari semalam lengkap berputar selama 24 jam." },
                        { q: "Lengkapkan ayat matematik jumlah bulan:\n2 tahun = ____ bulan", ans: "24", opts: ["24", "12", "36", "18"], exp: "2 darab 12 bulan = 24 bulan." },
                        { q: "Lengkapkan ayat matematik asas minggu:\n1 minggu = ____ hari", ans: "7", opts: ["7", "30", "12", "24"], exp: "Seminggu mengandungi 7 hari." },
                        { q: "Lengkapkan ayat matematik unit masa pendek:\n1 minit = ____ saat", ans: "60", opts: ["60", "24", "12", "100"], exp: "1 minit bersamaan dengan 60 saat." }
                    ],
                    sederhana: [
                        { q: "Lengkapkan ayat operasi tambah jam:\n3 jam + 2 jam = ____ jam", ans: "5", opts: ["5", "3", "6", "1"], exp: "3 ditambah 2 menghasilkan 5 jam." },
                        { q: "Lengkapkan ayat operasi tolak jam:\n6 jam - 3 jam = ____ jam", ans: "3", opts: ["3", "2", "4", "6"], exp: "6 ditolak 3 baki 3 jam." },
                        { q: "Lengkapkan ayat penukaran jam kepada minit:\n3 jam = ____ minit", ans: "180", opts: ["180", "120", "150", "90"], exp: "3 darab 60 minit = 180 minit." },
                        { q: "Lengkapkan ayat penukaran minggu kepada hari:\n3 minggu = ____ hari", ans: "21", opts: ["21", "14", "28", "7"], exp: "3 darab 7 hari = 21 hari." },
                        { q: "Lengkapkan ayat tambah minit:\n20 minit + 40 minit = ____ jam", ans: "1", opts: ["1", "60", "2", "30"], exp: "20 minit + 40 minit = 60 minit, iaitu 1 jam." },
                        { q: "Lengkapkan ayat tolak minit:\n60 minit - 15 minit = ____ minit", ans: "45", opts: ["45", "30", "50", "15"], exp: "60 - 15 = 45 minit." },
                        { q: "Lengkapkan ayat gabungan unit:\nPukul 4:30 bermaksud 4 jam ____ minit", ans: "30", opts: ["30", "15", "45", "60"], exp: "Angka 30 pada minit bermaksud 30 minit." },
                        { q: "Lengkapkan ayat tempoh jam:\nDari pukul 1:00 petang ke pukul 5:00 petang ialah ____ jam", ans: "4", opts: ["4", "5", "3", "6"], exp: "5 tolak 1 = 4 jam." },
                        { q: "Lengkapkan ayat penukaran tahun:\n36 bulan = ____ tahun", ans: "3", opts: ["3", "2", "4", "12"], exp: "36 bahagi 12 bulan = 3 tahun." },
                        { q: "Lengkapkan ayat perbandingan masa:\n120 minit adalah sama nilai dengan ____ jam", ans: "2", opts: ["2", "1", "3", "4"], exp: "120 bahagi 60 = 2 jam." },
                        { q: "Lengkapkan ayat penambahan hari:\n5 hari + 2 hari = ____ minggu", ans: "1", opts: ["1", "7", "2", "5"], exp: "5 + 2 = 7 hari, bersamaan 1 minggu." },
                        { q: "Lengkapkan ayat baki jam dalam sehari:\nJika sudah berlalu 10 jam, baki masa dalam sehari ialah ____ jam", ans: "14", opts: ["14", "12", "10", "24"], exp: "24 jam - 10 jam = 14 jam." },
                        { q: "Lengkapkan ayat pengiraan suku jam:\n3 keping suku jam (3 × ¼ jam) = ____ minit", ans: "45", opts: ["45", "30", "15", "60"], exp: "3 darab 15 minit = 45 minit." },
                        { q: "Lengkapkan ayat penukaran 180 minit:\n180 minit = ____ jam", ans: "3", opts: ["3", "2", "4", "1"], exp: "180 bahagi 60 = 3 jam." },
                        { q: "Lengkapkan ayat tambah waktu petang:\nPukul 3:00 petang tambah 2 jam menjadi pukul ____ petang", ans: "5:00", opts: ["5:00", "4:00", "6:00", "3:00"], exp: "3 + 2 = pukul 5:00 petang." },
                        { q: "Lengkapkan ayat tolak waktu pagi:\nPukul 10:00 pagi tolak 3 jam ialah pukul ____ pagi", ans: "7:00", opts: ["7:00", "8:00", "6:00", "9:00"], exp: "10 - 3 = pukul 7:00 pagi." },
                        { q: "Lengkapkan ayat penukaran 4 minggu:\n4 minggu = ____ hari", ans: "28", opts: ["28", "21", "14", "30"], exp: "4 darab 7 hari = 28 hari." },
                        { q: "Lengkapkan ayat penambahan setengah jam:\n30 minit + 30 minit = ____ jam", ans: "1", opts: ["1", "2", "60", "0"], exp: "30 + 30 = 60 minit = 1 jam." },
                        { q: "Lengkapkan ayat pengiraan minit jam 4:\n4 jam = ____ minit", ans: "240", opts: ["240", "180", "120", "300"], exp: "4 darab 60 minit = 240 minit." },
                        { q: "Lengkapkan ayat baki hari dalam seminggu:\nJika hari ini Isnin, 3 hari kemudian ialah hari ____", ans: "Khamis", opts: ["Khamis", "Rabu", "Jumaat", "Selasa"], exp: "Isnin (+3 hari) = Khamis." }
                    ],
                    sukar: [
                        { q: "Lengkapkan ayat penukaran minit kompleks:\n90 minit = ____ jam ____ minit", ans: "1 jam 30 minit", opts: ["1 jam 30 minit", "1 jam 15 minit", "2 jam 30 minit", "1 jam 45 minit"], exp: "90 minit = 60 minit (1 jam) + 30 minit." },

                        { q: "Fatimah membaca buku cerita dari pukul 3:15 petang hingga 5:00 petang. Berapakah tempoh membaca?", ans: "1 jam 45 minit", opts: ["1 jam 45 minit", "1 jam 30 minit", "2 jam", "1 jam 15 minit"], exp: "Dari 3:15 ke 4:15 (1 jam) + 45 minit = 1 jam 45 minit." },
                        { q: "Zul mula membaiki basikal pada pukul 2:00 petang dan siap pada pukul 4:30 petang. Berapakah tempoh masa kerja membaiki?", ans: "2 jam 30 minit", opts: ["2 jam 30 minit", "2 jam", "3 jam", "2 jam 15 minit"], exp: "Dari 2:00 ke 4:00 (2 jam) + 30 minit = 2 jam 30 minit." },
                        { q: "Kelas renang bermula pada pukul 8:00 pagi dan tamat pada pukul 10:15 pagi. Berapakah tempoh keseluruhan kelas?", ans: "2 jam 15 minit", opts: ["2 jam 15 minit", "2 jam", "2 jam 30 minit", "3 jam"], exp: "Dari 8:00 ke 10:00 (2 jam) + 15 minit = 2 jam 15 minit." }
                    ]
                };

                const subQList = uniqueProblemQuestions[lvlId];
                const selectedData = subQList[(index - 1) % subQList.length];

                qObj.question = selectedData.q;
                qObj.answer = selectedData.ans;
                qObj.type = 'objektif';
                qObj.options = shuffleArray(selectedData.opts);
                qObj.explanation = selectedData.exp;
            }
            return qObj;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }

                    <div class="text-center mb-6">
                        ${q.clockTime ? renderAnalogClockSVG(q.clockTime.hour, q.clockTime.minute) : ''}
                        <h4 class="kid-font text-lg sm:text-xl font-bold text-slate-800 mt-4 px-2 whitespace-pre-line">
                            "${q.question}"
                        </h4>
                    </div>

                    <!-- Options Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6" id="options-grid">
                        ${q.options.map((opt, idx) => `
                            <button onclick="submitAnswer('${escapeQuotes(opt)}')" class="option-btn bg-slate-50 hover:bg-blue-50 hover:border-blue-500 border-2 border-slate-200 text-slate-700 font-bold py-3.5 px-4 rounded-2xl shadow-sm transition transform hover:scale-102 text-sm sm:text-base text-left flex items-center space-x-3">
                                <span class="w-8 h-8 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-xs">${String.fromCharCode(65 + idx)}</span>
                                <span class="flex-1">${opt}</span>
                            </button>
                        `).join('')}
                    </div>

                    <div class="text-center">
                        <button onclick="appState.navigateTo('category_select')" class="text-slate-400 hover:text-rose-500 font-bold text-xs">
                            ❌ Tamatkan Sesi Permainan
                        </button>
                    </div>
                </div>
            `;
        }

        function renderAnalogClockSVG(hour, minute) {
            const hourDeg = (hour % 12) * 30 + (minute / 60) * 30;
            const minDeg = minute * 6;

            return `
                <div class="analog-clock-container my-4">
                    <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                        <circle cx="100" cy="100" r="95" fill="#ffffff" stroke="#3b82f6" stroke-width="8" />
                        <circle cx="100" cy="100" r="88" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
                        
                        ${[...Array(12)].map((_, i) => {
                            const angle = (i + 1) * 30 * (Math.PI / 180);
                            const x1 = 100 + 75 * Math.sin(angle);
                            const y1 = 100 - 75 * Math.cos(angle);
                            const x2 = 100 + 84 * Math.sin(angle);
                            const y2 = 100 - 84 * Math.cos(angle);
                            const tx = 100 + 62 * Math.sin(angle);
                            const ty = 100 - 62 * Math.cos(angle);
                            const num = i + 1;
                            return `
                                <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#334155" stroke-width="3" stroke-linecap="round" />
                                <text x="${tx}" y="${ty + 5}" font-family="Fredoka" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">${num}</text>
                            `;
                        }).join('')}

                        ${[...Array(60)].map((_, i) => {
                            if (i % 5 === 0) return '';
                            const angle = i * 6 * (Math.PI / 180);
                            const x1 = 100 + 80 * Math.sin(angle);
                            const y1 = 100 - 80 * Math.sin(angle);
                            const x2 = 100 + 84 * Math.sin(angle);
                            const y2 = 100 - 84 * Math.sin(angle);
                            return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#cbd5e1" stroke-width="1.5" />`;
                        }).join('')}

                        <line x1="100" y1="100" x2="${100 + 45 * Math.sin(hourDeg * Math.PI / 180)}" y2="${100 - 45 * Math.cos(hourDeg * Math.PI / 180)}" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
                        <line x1="100" y1="100" x2="${100 + 65 * Math.sin(minDeg * Math.PI / 180)}" y2="${100 - 65 * Math.cos(minDeg * Math.PI / 180)}" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
                        <circle cx="100" cy="100" r="6" fill="#3b82f6" />
                    </svg>
                </div>
            `;
        }

        function escapeQuotes(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        function initGameTimer() {
            if (appState.selectedTimeLimit <= 0) return;
            appState.timeLeft = appState.selectedTimeLimit;
            if (appState.timer) clearInterval(appState.timer);

            appState.timer = setInterval(() => {
                appState.timeLeft--;
                const badge = document.getElementById('timer-badge');
                if (badge) badge.innerText = `⏱️ ${appState.timeLeft}s`;

                if (appState.timeLeft <= 0) {
                    clearInterval(appState.timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            const q = appState.gameQuestions[appState.currentQuestionIndex];
            appState.incorrectCount++;
            showModal("⏰ Masa Tamat!", `Maaf, masa telah tamat.\nJawapan yang betul ialah: ${q.answer}\n\n${q.explanation}`, false, nextQuestion);
        }

        function submitAnswer(selectedOpt) {
            if (appState.timer) clearInterval(appState.timer);
            const q = appState.gameQuestions[appState.currentQuestionIndex];
            
            const isCorrect = String(selectedOpt).trim().toLowerCase() === String(q.answer).trim().toLowerCase();

            if (isCorrect) {
                appState.score += 5;
                appState.correctCount++;
                showModal("🎉 Hebat! Betul!", `Syabas! Jawapan anda tepat.\n\n${q.explanation}`, true, nextQuestion);
            } else {
                appState.incorrectCount++;
                showModal("❌ Jawapan Belum Tepat", `Jawapan yang betul ialah: ${q.answer}\n\n${q.explanation}`, false, nextQuestion);
            }
        }

        function nextQuestion() {
            appState.currentQuestionIndex++;
            if (appState.currentQuestionIndex >= appState.gameQuestions.length || appState.currentQuestionIndex >= 20) {
                finishGame();
            } else {
                render();
            }
        }

        function finishGame() {
            if (appState.timer) clearInterval(appState.timer);
            
            if (appState.currentUser) {
                let users = getUsers();
                if (users[appState.currentUser]) {
                    let u = users[appState.currentUser];
                    u.totalScore += appState.score;
                    u.totalGames += 1;
                    u.totalQuestions += (appState.correctCount + appState.incorrectCount);
                    u.correctAnswers += appState.correctCount;
                    u.incorrectAnswers += appState.incorrectCount;

                    if (!u.categoryProgress) u.categoryProgress = {};
                    let catId = appState.selectedCategory;
                    if (!u.categoryProgress[catId]) u.categoryProgress[catId] = { answered: 0, correct: 0 };
                    u.categoryProgress[catId].answered += (appState.correctCount + appState.incorrectCount);
                    u.categoryProgress[catId].correct += appState.correctCount;

                    users[appState.currentUser] = u;
                    saveUsers(users);
                }
            }

            appState.navigateTo('result');
        }

        function renderResultView() {
            const totalQ = appState.correctCount + appState.incorrectCount;
            const accuracy = totalQ > 0 ? Math.round((appState.correctCount / totalQ) * 100) : 0;
            let maxPossible = totalQ * 5;
            if (maxPossible === 0) maxPossible = 100;

            let msg = "💪 Jangan berputus asa! Cuba lagi!";
            let icon = "💪";
            if (accuracy >= 90) {
                msg = "🏆 Hebat! Anda memang juara Matematik!";
                icon = "🏆";
            } else if (accuracy >= 75) {
                msg = "🌟 Syabas! Prestasi yang sangat baik!";
                icon = "🌟";
            } else if (accuracy >= 50) {
                msg = "👍 Bagus! Teruskan berlatih!";
                icon = "👍";
            }

            return `
                <div class="max-w-xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-white text-center">
                    <div class="text-6xl mb-2">${icon}</div>
                    <h3 class="kid-font text-3xl font-bold text-slate-800 mb-1">🎉 TAMAT PERMAINAN!</h3>
                    <p class="text-slate-500 text-xs sm:text-sm mb-6">${msg}</p>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                        <div class="bg-amber-50 p-3 rounded-2xl border border-amber-100">
                            <p class="text-xs text-amber-600 font-bold mb-1">⭐ SKOR</p>
                            <p class="text-xl kid-font font-bold text-amber-700">${appState.score}</p>
                        </div>
                        <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100">
                            <p class="text-xs text-emerald-600 font-bold mb-1">✅ BETUL</p>
                            <p class="text-xl kid-font font-bold text-emerald-700">${appState.correctCount}</p>
                        </div>
                        <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100">
                            <p class="text-xs text-rose-600 font-bold mb-1">❌ SALAH</p>
                            <p class="text-xl kid-font font-bold text-rose-700">${appState.incorrectCount}</p>
                        </div>
                        <div class="bg-blue-50 p-3 rounded-2xl border border-blue-100">
                            <p class="text-xs text-blue-600 font-bold mb-1">📊 KETEPATAN</p>
                            <p class="text-xl kid-font font-bold text-blue-700">${accuracy}%</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="startGameWithTime(appState.selectedTimeLimit)" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition text-sm">
                            🔄 MAIN LAGI
                        </button>
                        <button onclick="appState.navigateTo('category_select')" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition text-sm">
                            📚 PILIH KATEGORI
                        </button>
                        <button onclick="appState.navigateTo('dashboard')" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition text-sm">
                            📊 LIHAT PROGRESS
                        </button>
                        <button onclick="appState.navigateTo('leaderboard')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded-2xl shadow-md transition text-sm">
                            🏆 LEADERBOARD
                        </button>
                    </div>

                    <div class="mt-6">
                        <button onclick="appState.navigateTo('home')" class="text-slate-500 hover:text-slate-700 font-bold text-xs">
                            🏠 Kembali ke Menu Utama
                        </button>
                    </div>
                </div>
            `;
        }

        function renderLeaderboardView() {
            const users = getUsers();
            const sortedUsers = Object.keys(users).map(name => ({
                name, ...users[name]
            })).sort((a, b) => b.totalScore - a.totalScore);

            return `
                <div class="max-w-2xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border border-white">
                    <div class="text-center mb-6">
                        <div class="text-4xl mb-2">🏆</div>
                        <h3 class="kid-font text-3xl font-bold text-slate-800">Leaderboard Pemain</h3>
                        <p class="text-xs text-slate-500">Kedudukan skor tertinggi semua pemain Math Kids</p>
                    </div>

                    <div class="space-y-3 mb-6 max-h-96 overflow-y-auto pr-1">
                        ${sortedUsers.length === 0 ? `
                            <p class="text-center text-slate-400 text-sm py-8">Belum ada pemain berdaftar. Daftar akaun sekarang!</p>
                        ` : sortedUsers.map((u, index) => {
                            let badge = `#${index + 1}`;
                            let badgeBg = 'bg-slate-100 text-slate-600';
                            if (index === 0) { badge = '🥇 1'; badgeBg = 'bg-amber-100 text-amber-700 border border-amber-300'; }
                            else if (index === 1) { badge = '🥈 2'; badgeBg = 'bg-slate-200 text-slate-700 border border-slate-300'; }
                            else if (index === 2) { badge = '🥉 3'; badgeBg = 'bg-orange-100 text-orange-700 border border-orange-300'; }

                            const acc = u.totalQuestions > 0 ? Math.round((u.correctAnswers / u.totalQuestions) * 100) : 0;

                            return `
                                <div class="flex items-center justify-between p-4 rounded-2xl bg-slate-50 border border-slate-200 shadow-sm">
                                    <div class="flex items-center space-x-3">
                                        <span class="w-10 h-10 rounded-xl ${badgeBg} flex items-center justify-center font-bold text-sm">${badge}</span>
                                        <div>
                                            <h4 class="kid-font font-bold text-base text-slate-800">${u.name}</h4>
                                            <p class="text-xs text-slate-500">${u.totalGames} permainan • Ketepatan: ${acc}%</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="kid-font font-bold text-lg text-blue-600">${u.totalScore}</span>
                                        <span class="text-xs text-slate-400 block">markah</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="text-center">
                        <button onclick="appState.navigateTo('home')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-5 py-2.5 rounded-2xl text-xs font-bold transition">
                            ⬅️ Menu Utama
                        </button>
                    </div>
                </div>
            `;
        }

        function handleRegister(e) {
            e.preventDefault();
            const user = document.getElementById('reg-username').value.trim();
            const pass = document.getElementById('reg-password').value.trim();
            
            let users = getUsers();
            if (users[user]) {
                showModal("⚠️ Ralat Pendaftaran", "Nama pengguna ini telah wujud. Sila guna nama lain atau log masuk.", false);
                return;
            }

            users[user] = {
                password: pass,
                totalScore: 0,
                totalGames: 0,
                totalQuestions: 0,
                correctAnswers: 0,
                incorrectAnswers: 0,
                categoryProgress: {}
            };
            saveUsers(users);

            appState.currentUser = user;
            showModal("🎉 Pendaftaran Berjaya!", `Selamat datang, ${user}! Akaun anda telah berjaya dicipta.`, true, () => {
                closeModal();
                appState.navigateTo('dashboard');
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            let users = getUsers();
            if (!users[user] || users[user].password !== pass) {
                showModal("❌ Log Masuk Gagal", "Nama pengguna atau kata laluan tidak sah. Sila cuba lagi.", false);
                return;
            }

            appState.currentUser = user;
            showModal("🚀 Log Masuk Berjaya", `Selamat kembali, ${user}! Jom teruskan belajar.`, true, () => {
                closeModal();
                appState.navigateTo('dashboard');
            });
        }

        function logoutUser() {
            appState.currentUser = null;
            showModal("🚪 Log Keluar", "Anda telah berjaya log keluar daripada akaun.", true, () => {
                closeModal();
                appState.navigateTo('home');
            });
        }

        function checkAuthAndProceed(targetView) {
            if (!appState.currentUser) {
                showModal("👤 Log Masuk Diperlukan", "Sila log masuk atau daftar akaun dahulu untuk merekodkan skor dan progress anda!", false, () => {
                    closeModal();
                    appState.navigateTo('login');
                });
            } else {
                appState.navigateTo(targetView);
            }
        }

        let modalCallback = null;
        function showModal(title, message, isSuccess = true, callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = isSuccess ? '🎉' : '⚠️';
            modalCallback = callback;

            const box = document.getElementById('modal-box');
            const container = document.getElementById('modal-container');
            container.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const box = document.getElementById('modal-box');
            const container = document.getElementById('modal-container');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                container.classList.add('hidden');
                if (modalCallback) {
                    let cb = modalCallback;
                    modalCallback = null;
                    cb();
                }
            }, 200);
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
