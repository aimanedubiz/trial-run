        // Sound generator using Web Audio API (No external URLs needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!gameState.audioEnabled) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(110, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'win') {
                let notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                        o.start();
                        o.stop(audioCtx.currentTime + 0.2);
                    }, idx * 100);
                });
            }
        }

        // ==========================================
        // GAME CONTROLLER ACTIONS
        // ==========================================
        function switchScreen(screen) {
            gameState.currentScreen = screen;
            render();
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            const found = gameState.users.find(u => u.username === username && u.password === pass);
            if (found) {
                gameState.currentUser = found;
                playSound('win');
                switchScreen('menu');
            } else {
                alert('Nama pengguna atau kata laluan tidak sah. Sila cuba lagi atau daftar akaun.');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const pass = document.getElementById('regPassword').value.trim();

            if (gameState.users.some(u => u.username === username)) {
                alert('Nama pengguna sudah wujud. Sila pilih nama pengguna lain.');
                return;
            }

            const newUser = {
                name,
                username,
                password: pass,
                highScore: 0,
                totalPlayed: 0,
                totalCorrect: 0,
                totalWrong: 0,
                badges: ['Shape Explorer']
            };

            gameState.users.push(newUser);
            saveUsers();
            gameState.currentUser = newUser;
            playSound('win');
            switchScreen('menu');
        }

        function handleLogout() {
            gameState.currentUser = null;
            switchScreen('login');
        }

        function selectTopic(topicId) {
            gameState.selectedTopic = topicId;
            switchScreen('gamemode');
        }

        function selectGameMode(modeId) {
            gameState.selectedGameMode = modeId;
            switchScreen('difficulty');
        }

        function selectDifficulty(diffId) {
            gameState.selectedDifficulty = diffId;
            switchScreen('timer');
        }

        function toggleAudio() {
            gameState.audioEnabled = !gameState.audioEnabled;
            const btn = document.getElementById('audioToggleBtn');
            if (btn) {
                btn.innerText = gameState.audioEnabled ? '🔊 ON' : '🔇 OFF';
                btn.className = gameState.audioEnabled ? 'bg-green-500 text-white px-3 py-1.5 rounded-xl font-bold text-xs' : 'bg-gray-400 text-white px-3 py-1.5 rounded-xl font-bold text-xs';
            }
        }

        function startGameSession(timeLimit) {
            gameState.selectedTimeOption = timeLimit;
            gameState.currentQuestionIndex = 0;
            gameState.score = 0;
            gameState.correctCount = 0;
            gameState.wrongCount = 0;
            gameState.streak = 0;
            gameState.timeLeft = timeLimit;

            // Generate 20 unique random questions from bank
            const bank = questionBank[gameState.selectedTopic][gameState.selectedDifficulty];
            // Shuffle and pick 20
            const shuffled = [...bank].sort(() => 0.5 - Math.random());
            gameState.questions = shuffled.slice(0, 20);

            switchScreen('play');
            startTimer();
        }

        function startTimer() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            if (gameState.selectedTimeOption === 0) return; // Infinity

            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                const timerEl = document.getElementById('timerDisplay');
                if (timerEl) timerEl.innerText = `⏱️ ${gameState.timeLeft}s`;

                if (gameState.timeLeft <= 0) {
                    clearInterval(gameState.timerInterval);
                    handleTimeOut();
                }
            }, 1000);
        }

        function handleTimeOut() {
            playSound('wrong');
            gameState.wrongCount++;
            gameState.streak = 0;
            const q = gameState.questions[gameState.currentQuestionIndex];
            showFeedbackModal(false, `Masa habis! Jawapan betul ialah: ${q.options[q.answer]}. ${q.explanation}`);
        }

        function checkAnswer(selectedIdx) {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            const q = gameState.questions[gameState.currentQuestionIndex];
            const isCorrect = (selectedIdx === q.answer);

            const modal = document.getElementById('feedbackModal');
            const content = document.getElementById('feedbackContent');

            if (isCorrect) {
                playSound('correct');
                gameState.correctCount++;
                gameState.score += 5; // 5 marks per question -> max 100
                gameState.streak++;
                if (gameState.streak % 3 === 0) playSound('win');

                content.innerHTML = `
                    <div class="text-5xl mb-2">🎉🎆⭐</div>
                    <h3 class="text-2xl font-bold text-green-600 mb-1">TAHNIAH! JAWAPAN BETUL!</h3>
                    <p class="text-sm text-indigo-600 font-bold mb-3">+5 MARKAH</p>
                    <p class="text-xs text-gray-600 mb-4">${q.explanation}</p>
                    <button onclick="nextQuestion()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow">
                        SETERUSNYA ▶
                    </button>
                `;
            } else {
                playSound('wrong');
                gameState.wrongCount++;
                gameState.streak = 0;

                content.innerHTML = `
                    <div class="text-5xl mb-2">❌</div>
                    <h3 class="text-2xl font-bold text-red-600 mb-1">CUBA LAGI!</h3>
                    <p class="text-sm font-semibold text-gray-700 mb-2">Jawapan betul ialah: <span class="text-green-600">${q.options[q.answer]}</span></p>
                    <p class="text-xs text-gray-600 mb-4">${q.explanation}</p>
                    <button onclick="nextQuestion()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow">
                        SETERUSNYA ▶
                    </button>
                `;
            }

            modal.classList.remove('hidden');
        }

        function showFeedbackModal(isCorrect, text) {
            const modal = document.getElementById('feedbackModal');
            const content = document.getElementById('feedbackContent');
            content.innerHTML = `
                <div class="text-5xl mb-2">⏰❌</div>
                <h3 class="text-2xl font-bold text-red-600 mb-1">MASA TAMAT!</h3>
                <p class="text-xs text-gray-600 mb-4">${text}</p>
                <button onclick="nextQuestion()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 rounded-xl shadow">
                    SETERUSNYA ▶
                </button>
            `;
            modal.classList.remove('hidden');
        }

        function nextQuestion() {
            const modal = document.getElementById('feedbackModal');
            modal.classList.add('hidden');

            gameState.currentQuestionIndex++;
            if (gameState.currentQuestionIndex < gameState.questions.length) {
                gameState.timeLeft = gameState.selectedTimeOption;
                render();
                if (gameState.selectedTimeOption > 0) startTimer();
            } else {
                playSound('win');
                switchScreen('result');
            }
        }

        // Initialize app on window load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
